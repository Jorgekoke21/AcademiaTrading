<script>
/* ============================================================
   INDICADORES — todos se calculan a partir de la serie OHLC
   real del gráfico. Nunca son líneas dibujadas a mano.
   Cada función devuelve un array alineado con las velas,
   con null en las posiciones donde todavía no hay dato.
   ============================================================ */
const IND = {
  sma(cd, n, sel = k => k.c) {
    const o = new Array(cd.length).fill(null); let s = 0;
    for (let i = 0; i < cd.length; i++) {
      s += sel(cd[i]); if (i >= n) s -= sel(cd[i - n]);
      if (i >= n - 1) o[i] = s / n;
    }
    return o;
  },
  ema(cd, n, sel = k => k.c) {
    const o = new Array(cd.length).fill(null), a = 2 / (n + 1);
    let prev = null, s = 0;
    for (let i = 0; i < cd.length; i++) {
      const v = sel(cd[i]);
      if (i < n - 1) { s += v; continue; }
      if (i === n - 1) { s += v; prev = s / n; o[i] = prev; continue; }
      prev = v * a + prev * (1 - a); o[i] = prev;
    }
    return o;
  },
  rsi(cd, n = 14) {
    const o = new Array(cd.length).fill(null);
    let ag = 0, al = 0;
    for (let i = 1; i < cd.length; i++) {
      const d = cd[i].c - cd[i - 1].c, g = Math.max(0, d), l = Math.max(0, -d);
      if (i <= n) { ag += g / n; al += l / n; if (i === n) o[i] = 100 - 100 / (1 + (al ? ag / al : 100)); continue; }
      ag = (ag * (n - 1) + g) / n; al = (al * (n - 1) + l) / n;
      o[i] = 100 - 100 / (1 + (al ? ag / al : 100));
    }
    return o;
  },
  stoch(cd, n = 14, d = 3, sm = 3) {
    const raw = new Array(cd.length).fill(null);
    for (let i = n - 1; i < cd.length; i++) {
      let hh = -Infinity, ll = Infinity;
      for (let k = i - n + 1; k <= i; k++) { hh = Math.max(hh, cd[k].h); ll = Math.min(ll, cd[k].l); }
      raw[i] = hh === ll ? 50 : (cd[i].c - ll) / (hh - ll) * 100;
    }
    const K = IND._smooth(raw, sm), D = IND._smooth(K, d);
    return { k: K, d: D };
  },
  _smooth(a, n) {
    const o = new Array(a.length).fill(null);
    for (let i = 0; i < a.length; i++) {
      let s = 0, c = 0;
      for (let k = i - n + 1; k <= i; k++) if (k >= 0 && a[k] != null) { s += a[k]; c++; }
      if (c === n) o[i] = s / n;
    }
    return o;
  },
  tr(cd) {
    return cd.map((k, i) => i === 0 ? k.h - k.l : Math.max(k.h - k.l, Math.abs(k.h - cd[i - 1].c), Math.abs(k.l - cd[i - 1].c)));
  },
  atr(cd, n = 14) {
    const t = IND.tr(cd), o = new Array(cd.length).fill(null);
    let s = 0;
    for (let i = 0; i < cd.length; i++) {
      if (i < n) { s += t[i]; if (i === n - 1) o[i] = s / n; continue; }
      o[i] = (o[i - 1] * (n - 1) + t[i]) / n;
    }
    return o;
  },
  adx(cd, n = 14) {
    const len = cd.length, t = IND.tr(cd);
    const pDM = new Array(len).fill(0), mDM = new Array(len).fill(0);
    for (let i = 1; i < len; i++) {
      const up = cd[i].h - cd[i - 1].h, dn = cd[i - 1].l - cd[i].l;
      pDM[i] = up > dn && up > 0 ? up : 0;
      mDM[i] = dn > up && dn > 0 ? dn : 0;
    }
    const sm = arr => { const o = new Array(len).fill(null); let s = 0; for (let i = 1; i < len; i++) { if (i <= n) { s += arr[i]; if (i === n) o[i] = s; continue; } o[i] = o[i - 1] - o[i - 1] / n + arr[i]; } return o; };
    const st = sm(t), sp = sm(pDM), sm2 = sm(mDM);
    const pdi = new Array(len).fill(null), mdi = new Array(len).fill(null), dx = new Array(len).fill(null), adx = new Array(len).fill(null);
    for (let i = 0; i < len; i++) {
      if (st[i] == null || !st[i]) continue;
      pdi[i] = 100 * sp[i] / st[i]; mdi[i] = 100 * sm2[i] / st[i];
      const den = pdi[i] + mdi[i];
      dx[i] = den ? 100 * Math.abs(pdi[i] - mdi[i]) / den : 0;
    }
    let s = 0, c = 0;
    for (let i = 0; i < len; i++) {
      if (dx[i] == null) continue;
      c++; s += dx[i];
      if (c === n) adx[i] = s / n;
      else if (c > n) adx[i] = (adx[i - 1] * (n - 1) + dx[i]) / n;
    }
    return { adx, pdi, mdi };
  },
  bb(cd, n = 20, k = 2) {
    const mid = IND.sma(cd, n), up = new Array(cd.length).fill(null), dn = new Array(cd.length).fill(null);
    for (let i = n - 1; i < cd.length; i++) {
      let s = 0; for (let j = i - n + 1; j <= i; j++) s += Math.pow(cd[j].c - mid[i], 2);
      const sd = Math.sqrt(s / n);
      up[i] = mid[i] + k * sd; dn[i] = mid[i] - k * sd;
    }
    const w = mid.map((m, i) => m != null && up[i] != null ? (up[i] - dn[i]) / m * 100 : null);
    return { mid, up, dn, w };
  },
  donchian(cd, n = 20) {
    const up = new Array(cd.length).fill(null), dn = new Array(cd.length).fill(null), mid = new Array(cd.length).fill(null);
    for (let i = n - 1; i < cd.length; i++) {
      let hh = -Infinity, ll = Infinity;
      for (let k = i - n + 1; k <= i; k++) { hh = Math.max(hh, cd[k].h); ll = Math.min(ll, cd[k].l); }
      up[i] = hh; dn[i] = ll; mid[i] = (hh + ll) / 2;
    }
    return { up, dn, mid };
  },
  /* VWAP de sesión: se reinicia en los índices indicados */
  vwap(cd, resets = [0]) {
    const o = new Array(cd.length).fill(null), R = new Set(resets);
    let pv = 0, vv = 0;
    for (let i = 0; i < cd.length; i++) {
      if (R.has(i)) { pv = 0; vv = 0; }
      const tp = (cd[i].h + cd[i].l + cd[i].c) / 3;
      /* proxy de volumen: rango de la vela (a mayor rango, más actividad) */
      const v = Math.max(1e-6, cd[i].h - cd[i].l);
      pv += tp * v; vv += v; o[i] = pv / vv;
    }
    return o;
  },
  /* utilidades de lectura */
  slope(a, i, back = 5) {
    if (i < back || a[i] == null || a[i - back] == null) return null;
    return (a[i] - a[i - back]) / back;
  },
  last(a) { for (let i = a.length - 1; i >= 0; i--) if (a[i] != null) return a[i]; return null; }
};

/* medidas de impulso / retroceso entre dos índices de la serie */
function measure(cd, i1, i2) {
  const a = cd[i1], b = cd[i2];
  const p1 = a.c, p2 = b.c;
  const d = p2 - p1, n = Math.abs(i2 - i1) || 1;
  const atr = IND.atr(cd, 14);
  const at = atr[i2] ?? IND.last(atr) ?? 1;
  return {
    usd: d, pct: d / p1 * 100, bars: n,
    speed: d / n, atr: at, atrN: d / at
  };
}
/* ============================================================
   MOTOR DE GRÁFICOS — velas SVG, overlays, pasos y toggles
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const el = h => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const C = { bull: '#2BBF7B', bear: '#E5484D', gold: '#E8B44A', liq: '#8B7BF0', info: '#4CC2E0', warn: '#F0983C', mut: '#6B7686', tx: '#DDE3EC', line: '#232A35' };

/* ---------- generador determinista de series ---------- */
function rnd(seed) { let s = (Math.abs(seed) * 9301 + 49297) % 233280 || 7; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }

function legOf(i, pts) {
  for (let k = 0; k < pts.length - 1; k++) if (i >= pts[k][0] && i <= pts[k + 1][0]) return { a: pts[k][1], b: pts[k + 1][1] };
  return { a: pts[0][1], b: pts[pts.length - 1][1] };
}

/* S(pts, seed, opt) — pts: [[índice, precio, 'H'|'L'|null], ...] */
function S(pts, seed = 3, opt = {}) {
  const r = rnd(seed), n = pts[pts.length - 1][0] + 1, path = new Array(n);
  for (let k = 0; k < pts.length - 1; k++) {
    const [ia, pa] = pts[k], [ib, pb] = pts[k + 1], span = (ib - ia) || 1;
    for (let i = ia; i <= ib; i++) {
      const t = (i - ia) / span;
      const e = opt.linear ? t : (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
      path[i] = pa + (pb - pa) * e;
    }
  }
  let lo = Infinity, hi = -Infinity;
  pts.forEach(p => { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); });
  const amp = (hi - lo) || 1;

          if (o.label) s += pill((x1 + x2) / 2, (y1 + y2) / 2 - 12, o.label, A, 'middle', { fs: o.fs || 10 });
          return s;
        }
        case 'trend': {
          return `<line x1="${x(o.i1).toFixed(1)}" y1="${y(o.p1).toFixed(1)}" x2="${x(o.i2).toFixed(1)}" y2="${y(o.p2).toFixed(1)}" stroke="${A}" stroke-width="${o.lw || 1.4}" ${o.dash ? `stroke-dasharray="${o.dash}"` : ''} opacity="${o.op ?? .85}"/>`;
        }
        case 'note': {
          const c = spec.candles[o.i];
          const py = o.py != null ? y(o.py) : (o.side === 'H' ? y(c.h) - (o.off ?? 26) : y(c.l) + (o.off ?? 26));
          let s = '';
          if (o.arrow !== false) {
            const ty = o.side === 'H' ? y(c.h) - 6 : y(c.l) + 6;
            s += `<line x1="${x(o.i).toFixed(1)}" y1="${py + (o.side === 'H' ? 8 : -8)}" x2="${x(o.i).toFixed(1)}" y2="${ty.toFixed(1)}" stroke="${A}" stroke-width="1" stroke-dasharray="2 2" opacity=".7"/>`;
          }
          s += pill(clamp(x(o.i) + (o.dx || 0), 40, W - padR - 20), py, o.text, A, 'middle', { fs: o.fs || 10.5 });
          return s;
        }
        case 'mark': {
          const c = spec.candles[o.i], up = o.side !== 'H';
          const ty = up ? y(c.l) + 9 : y(c.h) - 9;
          const d = up ? `${x(o.i)},${ty} ${x(o.i) - 4.5},${ty + 8} ${x(o.i) + 4.5},${ty + 8}` : `${x(o.i)},${ty} ${x(o.i) - 4.5},${ty - 8} ${x(o.i) + 4.5},${ty - 8}`;
          let s = `<polygon points="${d}" fill="${A}"/>`;
          if (o.text) s += pill(clamp(x(o.i) + (o.dx || 0), 44, W - padR - 24), up ? ty + 22 : ty - 22, o.text, A, 'middle', { fs: o.fs || 10.5 });
          return s;
        }
        case 'stops': {
          const x1 = x(o.from), x2 = x(o.to), cnt = o.n || 7, yy = y(o.p);
          let s = '';
          for (let k = 0; k < cnt; k++) {
            const xx = x1 + (x2 - x1) * k / (cnt - 1);
            s += `<line x1="${xx.toFixed(1)}" y1="${(yy - 26).toFixed(1)}" x2="${xx.toFixed(1)}" y2="${(yy - 9).toFixed(1)}" stroke="${A}" stroke-width="1.2" opacity=".75"/><polygon points="${xx},${yy - 5} ${xx - 3.4},${yy - 12} ${xx + 3.4},${yy - 12}" fill="${A}" opacity=".85"/>`;
          }
          if (o.text) s += txt((x1 + x2) / 2, yy - 35, o.text, A, 'middle', { fs: 10 });
          return s;
        }
        case 'line': {
          const dat = o.data || [], lim = o.to != null ? Math.min(cur, o.to + 1) : cur;
          let d = '', open = false;
          for (let i = (o.from || 0); i < lim; i++) {
            const v = dat[i];
            if (v == null) { open = false; continue; }
            d += (open ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1) + ' '; open = true;
          }
          let s2 = d ? `<path d="${d}" fill="none" stroke="${A}" stroke-width="${o.lw || 1.5}" ${o.dash ? `stroke-dasharray="${o.dash}"` : ''} opacity="${o.op ?? .95}" stroke-linejoin="round"/>` : '';
          if (o.label && d) {
            let li = -1; for (let i = lim - 1; i >= 0; i--) if (dat[i] != null) { li = i; break; }
            if (li >= 0 && padR > 40) s2 += pill(W - padR + 6, y(dat[li]), o.label, A, 'start', { fs: o.fs || 9.5 });
          }
          return s2;
        }
        case 'ribbon': {
          const up = o.up || [], dn = o.dn || [], lim = cur;
          const path = arr => {
            let dd = '', op = false;
            for (let i = 0; i < lim; i++) { const v = arr[i]; if (v == null) { op = false; continue; } dd += (op ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1) + ' '; op = true; }
            return dd;
          };
          const pts = [];
          for (let i = 0; i < lim; i++) if (up[i] != null && dn[i] != null) pts.push(i);
          let s2 = '';
          if (pts.length > 1) {
            let d = '';
            pts.forEach((i, k) => { d += (k ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(up[i]).toFixed(1) + ' '; });
            for (let k = pts.length - 1; k >= 0; k--) { const i = pts[k]; d += 'L' + x(i).toFixed(1) + ',' + y(dn[i]).toFixed(1) + ' '; }
            s2 += `<path d="${d}Z" fill="${A}" fill-opacity="${o.fo ?? .06}"/>`;
          }
          [up, dn].forEach(arr => { const d = path(arr); if (d) s2 += `<path d="${d}" fill="none" stroke="${A}" stroke-width="${o.lw || 1.2}" opacity="${o.op ?? .7}" ${o.dash ? `stroke-dasharray="${o.dash}"` : ''}/>`; });
          if (o.mid) { const d = path(o.mid); if (d) s2 += `<path d="${d}" fill="none" stroke="${A}" stroke-width="1.1" stroke-dasharray="4 4" opacity=".55"/>`; }
          if (o.label && pts.length) s2 += pill(x(pts[pts.length - 1]) - 6, y(up[pts[pts.length - 1]]) - 10, o.label, A, 'end', { fs: 9.5 });
          return s2;
        }
        case 'txt': return txt(o.i != null ? x(o.i) : (o.xp ?? padL + 8), o.py != null ? y(o.py) : (o.yp ?? padT), o.text, A, o.anchor || 'start', { fs: o.fs || 11, ff: o.ff });
        case 'band': { /* etiqueta grande centrada arriba */
          return pill(o.i != null ? x(o.i) : (W - padR) / 2, padT - 10, o.text, A, 'middle', { fs: o.fs || 11 });
        }
        case 'bracket': {
          const x1 = x(o.from) - iw / 2, x2 = x(o.to) + iw / 2, yy = o.yp ?? (H - padB + 8);
          return `<path d="M${x1},${yy - 5} L${x1},${yy} L${x2},${yy} L${x2},${yy - 5}" fill="none" stroke="${A}" stroke-width="1" opacity=".6"/>` + txt((x1 + x2) / 2, yy + 9, o.text, A, 'middle', { fs: 10 });
        }
      }
      return '';
    }

    /* ---- paneles de indicadores, sincronizados con las mismas velas ---- */
    let ptop = H;
    PN.forEach((pn, pi) => { const top = ptop + PGAP; g += drawPane(pn, top, PH[pi]); ptop = top + PH[pi]; });

    function drawPane(pn, top, hh) {
      const ser = (pn.series || []).filter(sr => !sr.g || !st.off.has(sr.g));
      let lo2 = Infinity, hi2 = -Infinity;
      ser.forEach(sr => sr.data.forEach((v, i) => { if (v != null && i < cur) { lo2 = Math.min(lo2, v); hi2 = Math.max(hi2, v); } }));
      (pn.lines || []).forEach(l => { lo2 = Math.min(lo2, l.v); hi2 = Math.max(hi2, l.v); });
      if (!isFinite(lo2) || !isFinite(hi2)) { lo2 = 0; hi2 = 1; }
      const pd = (hi2 - lo2) * .12 || 1;
      const mn = pn.min ?? lo2 - pd, mx = pn.max ?? hi2 + pd;
      const yy = v => top + (mx - clamp(v, mn, mx)) / ((mx - mn) || 1) * hh;
      let s2 = `<rect x="${padL}" y="${top.toFixed(1)}" width="${(W - padR + 2 - padL).toFixed(1)}" height="${hh}" fill="#0C1016" stroke="#1A202B" rx="5"/>`;
      (pn.lines || []).forEach(l => {
        s2 += `<line x1="${padL + 1}" y1="${yy(l.v).toFixed(1)}" x2="${(W - padR + 1).toFixed(1)}" y2="${yy(l.v).toFixed(1)}" stroke="${l.color || '#242C38'}" stroke-width="1" stroke-dasharray="${l.dash || '3 4'}"/>`;
        if (padR > 40) s2 += txt(W - padR + 8, yy(l.v), l.label ?? String(l.v), l.color || '#4E586A', 'start', { fs: 9.5 });
      });
      if (pn.zone) s2 += `<rect x="${padL + 1}" y="${yy(pn.zone[1]).toFixed(1)}" width="${(W - padR - padL).toFixed(1)}" height="${Math.abs(yy(pn.zone[0]) - yy(pn.zone[1])).toFixed(1)}" fill="${pn.zoneColor || C.mut}" fill-opacity=".06"/>`;
      ser.forEach(sr => {
        if (sr.hist) {
          const base = clamp(sr.base ?? mn, mn, mx);
          for (let i = 0; i < cur; i++) {
            const v = sr.data[i]; if (v == null) continue;
            const y1 = yy(v), y0 = yy(base);
            s2 += `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(.8, Math.abs(y1 - y0)).toFixed(1)}" fill="${sr.color}" fill-opacity="${sr.fo ?? .45}" rx="1"/>`;
          }
          return;
        }
        let d = '', open = false;
        for (let i = 0; i < cur; i++) {
          const v = sr.data[i]; if (v == null) { open = false; continue; }
          d += (open ? 'L' : 'M') + x(i).toFixed(1) + ',' + yy(v).toFixed(1) + ' '; open = true;
        }
        if (d) s2 += `<path d="${d}" fill="none" stroke="${sr.color}" stroke-width="${sr.lw || 1.5}" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''} opacity="${sr.op ?? 1}" stroke-linejoin="round"/>`;
      });
      (pn.marks || []).filter(visible).forEach(mk2 => {
        if (mk2.i >= cur) return;
        const v = mk2.v != null ? mk2.v : (ser[0] && ser[0].data[mk2.i]);
        if (v == null) return;
        s2 += `<circle cx="${x(mk2.i).toFixed(1)}" cy="${yy(v).toFixed(1)}" r="3" fill="${mk2.color || C.gold}"/>`;
        if (mk2.text) s2 += pill(clamp(x(mk2.i) + (mk2.dx || 0), 46, W - padR - 24), yy(v) + (mk2.up ? -13 : 14), mk2.text, mk2.color || C.gold, 'middle', { fs: 9.5 });
      });
      (pn.zigs || []).filter(visible).forEach(z => {
        const dd = z.pts.filter(([i]) => i < cur).map(([i, v]) => `${x(i).toFixed(1)},${yy(v != null ? v : (ser[0] && ser[0].data[i])).toFixed(1)}`).join(' ');
        if (dd) s2 += `<polyline points="${dd}" fill="none" stroke="${z.color || C.gold}" stroke-width="1.4" stroke-dasharray="${z.dash || '4 3'}" opacity=".85"/>`;
      });
      if (pn.title) s2 += txt(padL + 8, top + 12, pn.title, '#8A97A9', 'start', { fs: 10, ff: 'JetBrains Mono, monospace' });
      let lx = padL + 8 + (pn.title ? String(pn.title).length * 6.1 + 14 : 0);
      ser.forEach(sr => {
        if (!sr.name) return;
        s2 += `<rect x="${lx.toFixed(1)}" y="${(top + 10.8).toFixed(1)}" width="10" height="2.4" rx="1" fill="${sr.color}"/>`;
        s2 += txt(lx + 14, top + 12, sr.name, '#8A97A9', 'start', { fs: 9.5 });
        lx += 14 + String(sr.name).length * 5.7 + 12;
      });
      return s2;
    }

    box.querySelectorAll('svg').forEach(s => s.remove());
    box.insertAdjacentHTML('afterbegin', `<svg viewBox="0 0 ${W} ${TOT}" width="${W}" height="${TOT}" role="img" aria-label="${esc(spec.title || 'gráfico de velas')}">${g}</svg>`);
    st.prevUpto = cur;
  }

  /* interacción: crosshair + lectura OHLC */
  if (spec.hover !== false) {
    box.addEventListener('pointermove', e => {
      if (!sc) return;
      const r = box.getBoundingClientRect(), px = e.clientX - r.left - 6;
      const i = sc.px2i(px), k = spec.candles[i];
      const cur = spec.play ? st.upto : (spec.steps ? (spec.steps[st.step].upto ?? spec.candles.length) : spec.candles.length);
      if (!k || i >= cur) { readout.style.opacity = 0; return; }
      const up = k.c >= k.o, pr = (hiLoRange() > 150 ? 0 : hiLoRange() > 25 ? 1 : 2);
      readout.innerHTML = `<b>#${i + 1}</b>${spec.tlabel ? ' · ' + esc(spec.tlabel(i)) : ''} · <span class="${up ? 'u' : 'd'}">${up ? '▲' : '▼'}</span><br>A ${k.o.toFixed(pr)} · M ${k.h.toFixed(pr)}<br>m ${k.l.toFixed(pr)} · C <b>${k.c.toFixed(pr)}</b>`;
      readout.style.opacity = 1;
      const rx = sc.x(i) + 14, flip = rx + 122 > sc.W - sc.padR;
      readout.style.left = (flip ? sc.x(i) - 110 : rx) + 'px';
      readout.style.top = clamp(sc.y(k.h) - 18, 4, sc.H - 76) + 'px';
    });
    box.addEventListener('pointerleave', () => { readout.style.opacity = 0; });
  }
  function hiLoRange() { let lo = Infinity, hi = -Infinity; spec.candles.forEach(k => { lo = Math.min(lo, k.l); hi = Math.max(hi, k.h); }); return hi - lo; }

  if (spec.onPick) {
    box.classList.add('clickable');
    box.addEventListener('click', e => {
      if (!sc) return;
      const r = box.getBoundingClientRect();
      spec.onPick({ i: sc.px2i(e.clientX - r.left - 6), p: sc.py2p(e.clientY - r.top - 4) }, api);
    });
  }

  /* toggles */
  fig.querySelectorAll('.tgl').forEach(b => b.addEventListener('click', () => {
    const g = b.dataset.g;
    if (st.off.has(g)) { st.off.delete(g); b.classList.add('on'); } else { st.off.add(g); b.classList.remove('on'); }
    render(false);
  }));

  /* pasos */
  function syncStep() {
    if (!spec.steps) return;
    const s = spec.steps[st.step];
    fig.querySelector('.step-txt .num').textContent = (st.step + 1) + '/' + spec.steps.length;
    fig.querySelector('.step-txt h5').textContent = s.t || '';
    fig.querySelector('.step-txt p').innerHTML = s.d || '';
    fig.querySelector('[data-prev]').disabled = st.step === 0;
    fig.querySelector('[data-next]').disabled = st.step === spec.steps.length - 1;
    fig.querySelectorAll('.dots i').forEach((d, i) => { d.className = i === st.step ? 'on' : (i < st.step ? 'past' : ''); });
  }
  if (spec.steps) {
    fig.querySelector('[data-prev]').addEventListener('click', () => { if (st.step > 0) { st.step--; st.prevUpto = 0; syncStep(); render('all'); } });
    fig.querySelector('[data-next]').addEventListener('click', () => { if (st.step < spec.steps.length - 1) { st.step++; syncStep(); render('new'); } });
    fig.querySelectorAll('.dots i').forEach(d => d.addEventListener('click', () => { const t = +d.dataset.d; const fw = t > st.step; st.step = t; if (!fw) st.prevUpto = 0; syncStep(); render(fw ? 'new' : 'all'); }));
    syncStep();
  }

  /* revelar capas (modo desnudo) */
  if (hasOv) fig.querySelectorAll('.reveal button').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.r;
    if (k === '*') { const all = st.rev.size === RV.length; st.rev = new Set(all ? [] : RV.map(v => v[0])); }
    else if (st.rev.has(k)) st.rev.delete(k); else st.rev.add(k);
    syncRev(); render(false);
  }));
  function syncRev() {
    if (!hasOv) return;
    fig.querySelectorAll('.reveal button').forEach(b => {
      const k = b.dataset.r;
      b.classList.toggle('on', k === '*' ? st.rev.size === RV.length : st.rev.has(k));
    });
  }

  /* ---------- reproducir mercado ---------- */
  let timer = null;
  if (spec.play) {
    const bar = fig.querySelector('.play'), pq = fig.querySelector('.pauseq');
    const posEl = bar.querySelector('.pos'), tBtn = bar.querySelector('[data-p="t"]');
    const setUpto = v => {
      const nv = clamp(v, spec.minUpto || 1, N0), fw = nv > st.upto;
      if (!fw) st.prevUpto = 0;
      st.upto = nv; render(fw ? 'new' : 'all'); sync();
      if (spec.onUpto) spec.onUpto(st.upto, api);
    };
    st.setUpto = setUpto;
    const sync = () => {
      posEl.textContent = st.upto + ' / ' + N0;
      tBtn.innerHTML = st.playing ? '&#9208; Pausa' : '&#9654; Reproducir mercado';
      tBtn.classList.toggle('playing', st.playing);
    };
    const stop = () => { clearInterval(timer); timer = null; st.playing = false; sync(); };
    const tick = () => {
      if (st.upto >= N0 || (spec.lockFwd && spec.lockFwd(st.upto))) { stop(); return; }
      setUpto(st.upto + 1);
      if (spec.gate && spec.gate(st.upto, api)) { stop(); return; }
      const q = spec.pauses && spec.pauses[st.upto];
      if (q) { stop(); ask(q); }
    };
    st.stop = stop;
    const start = () => {
      if (spec.lockFwd && spec.lockFwd(st.upto)) return;
      pq.hidden = true;
      if (st.upto >= N0) { st.upto = clamp(spec.playFrom ?? 2, 1, N0); st.prevUpto = 0; render('all'); }
      st.playing = true; clearInterval(timer); timer = setInterval(tick, 620 / st.spd); sync();
    };
    function ask(q) {
      pq.hidden = false;
      pq.innerHTML = `<div class="pq-h">Vela ${st.upto} · para un momento y piénsalo</div>
        <div class="pq-g">
          <span>¿Sigue intacta la estructura?</span><span>¿Qué nivel está atacando?</span>
          <span>¿Dónde queda liquidez sin tocar?</span><span>¿Qué tendría que pasar para confirmar un cambio?</span>
        </div>
        ${q.t ? `<p class="pq-t">${q.t}</p>` : ''}
        <div class="pq-b"><button data-x="r">Ver respuesta</button><button data-x="g">Seguir &#9654;</button></div>
        ${q.a ? `<p class="pq-a" hidden>${q.a}</p>` : ''}`;
      pq.querySelector('[data-x="g"]').onclick = () => { pq.hidden = true; start(); };
      const rb = pq.querySelector('[data-x="r"]'), ans = pq.querySelector('.pq-a');
      if (rb) rb.onclick = () => { if (ans) ans.hidden = false; rb.remove(); };
    }
    bar.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.s) {
        st.spd = +b.dataset.s;
        bar.querySelectorAll('.spd button').forEach(x => x.classList.toggle('on', x === b));
        if (st.playing) { clearInterval(timer); timer = setInterval(tick, 620 / st.spd); }
        return;
      }
      const k = b.dataset.p; if (!k) return;
      if (k === 't') { st.playing ? stop() : start(); return; }
      stop(); pq.hidden = true;
      const lk = spec.lockFwd && spec.lockFwd(st.upto);
      if (k === 's') setUpto(clamp(spec.playFrom ?? 2, 1, N0));
      else if (k === 'b') setUpto(st.upto - 1);
      else if (k === 'f' && !lk) { setUpto(st.upto + 1); if (spec.gate) spec.gate(st.upto, api); }
      else if (k === 'e' && !lk) {
        /* «hasta el final» respeta las pausas obligatorias */
        let v = st.upto; while (v < N0) { v++; if (spec.gate && spec.gateAt && spec.gateAt(v)) break; }
        setUpto(v); if (spec.gate) spec.gate(st.upto, api);
      }
    });
    sync();
  }

  const api = {
    node: fig,
    st,
    syncRev,
    render,
    setOv(ov) { spec.ov = ov; render(false); },
    setCandles(c) { spec.candles = c; st.prevUpto = 0; render('all'); },
    on(g) { st.off.delete(g); render(false); },
    offAll(gs) { gs.forEach(g => st.off.add(g)); render(false); },
    toggle(g, v) { v ? st.off.delete(g) : st.off.add(g); render(false); },
    step(i) { if (spec.steps) { st.step = i; syncStep(); render('all'); } },
    reveal(k) { st.rev.add(k); syncRev(); render(false); },
    upto(v) { if (spec.play) { st.upto = clamp(v, 1, N0); st.prevUpto = 0; render('all'); if (st.setUpto) st.setUpto(st.upto); } },
    /* utilidades para componentes del laboratorio */
    scale: () => sc,
    box,
    spec,
    cur: () => spec.play ? st.upto : (spec.steps ? (spec.steps[st.step].upto ?? spec.candles.length) : spec.candles.length),
    next() { if (spec.play && st.setUpto && !(spec.lockFwd && spec.lockFwd(st.upto))) { st.setUpto(st.upto + 1); if (spec.gate) spec.gate(st.upto, api); } },
    stop() { if (st.stop) st.stop(); }
  };
  REG.push({ box, render, api });
  requestAnimationFrame(() => render('all'));
  return api;
}

/* modo aprendizaje / modo desnudo */
function setNaked(v) {
  document.body.classList.toggle('naked', v);
  try { localStorage.setItem('xau_naked', v ? '1' : '0'); } catch (e) { }
  REG.forEach(r => { if (r.api) { r.api.st.rev.clear(); r.api.syncRev(); } });
  REG.forEach(r => { if (r.box.isConnected) r.render(false); });
  const b = document.querySelector('#nakedBtn');
  if (b) { b.textContent = v ? 'Modo desnudo' : 'Modo aprendizaje'; b.classList.toggle('nk', v); }
  const l = document.querySelector('#toolsG .nk-l'); if (l) l.textContent = v ? 'Modo desnudo' : 'Modo aprendizaje';
}

let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => REG.forEach(r => { if (r.box.isConnected) r.render(false); }), 160); });

/* ---------- bloque de 6 preguntas ---------- */
const QK = [
  ['Qué veo', '01'], ['Cómo lo detecto', '02'], ['Qué significa', '03'],
  ['Dónde importa', '04'], ['Qué NO significa', '05'], ['Qué observo después', '06']
];
function qa(items, K = QK) {
  const n = el(`<div class="qa">
    <div class="qa-tabs">${K.map((k, i) => `<button data-i="${i}" class="${i === 0 ? 'on' : ''}"><span class="dg">${k[1]}</span>${k[0]}</button>`).join('')}</div>
    <div class="qa-body"></div></div>`);
  const body = n.querySelector('.qa-body');
  const show = i => { body.innerHTML = `<span class="k">${K[i][0]}</span>${items[i] || '—'}`; };
  n.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    n.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); show(+b.dataset.i);
  }));
  show(0); return n;
}

/* ---------- comparación lado a lado ---------- */
function vs(items, o = {}) {
  const out = el(`<div class="vswrap"></div>`);
  const g = el(`<div class="vsblk"></div>`);
  items.forEach((it, ix) => {
    if (ix) g.appendChild(el(`<div class="vs-sep"><span>VS</span></div>`));
    const col = el(`<div class="vs-col ${it.c || ''}"><div class="vs-h"><span class="tag">${esc(it.tag || '')}</span><h5>${it.t}</h5></div></div>`);
    if (it.chart) col.appendChild(mkChart({ h: 196, padR: 40, naked: false, ...it.chart, flat: true }).node);
    if (it.pts) col.appendChild(el(`<ul class="vs-pts">${it.pts.map(p => `<li>${p}</li>`).join('')}</ul>`));
    g.appendChild(col);
  });
  out.appendChild(g);
  if (o.key) out.appendChild(el(`<div class="note key">${o.key}</div>`));
  return out;
}

/* ---------- escenarios condicionales A / B / C ---------- */
function scen(items, o = {}) {

/* ---------- laboratorio por capas (desmontar patrón / análisis) ---------- */
function layerLab(o) {
  const ch = mkChart({ ...o.chart, groups: [], naked: false });
  const wrap = el(`<div class="llab"></div>`);
  wrap.appendChild(ch.node);
  const side = el(`<div class="llab-side">
    <div class="llab-q">${o.q || '¿Ves alguna estructura reconocible?'}</div>
    <div class="llab-list"></div>
    <div class="llab-bar"><button data-a="add">+ ${o.addLabel || 'Añadir capa'}</button><button data-a="reset" class="sec">Reiniciar</button></div>
  </div>`);
  wrap.appendChild(side);
  const list = side.querySelector('.llab-list'), addB = side.querySelector('[data-a="add"]');
  let n = 0;
  const paint = () => {
    list.innerHTML = o.steps.map((s, i) => `<div class="ll ${i < n ? 'on' : ''}">
      <div class="ll-h"><span class="ic">${i < n ? '✓' : i + 1}</span><b>${s.t}</b>${s.tag ? `<span class="tg ${s.tag === 'redundante' ? 'r' : ''}">${s.tag}</span>` : ''}</div>
      ${i < n ? `<p>${s.d}</p>` : ''}</div>`).join('');
    addB.disabled = n >= o.steps.length;
    addB.textContent = n >= o.steps.length ? 'Todas las capas visibles' : '+ ' + (o.addLabel || 'Añadir capa') + ' ' + (n + 1) + '/' + o.steps.length;
  };
  const apply = () => {
    o.steps.forEach((s, i) => ch.toggle(s.g, i < n));
    paint();
  };
  addB.addEventListener('click', () => { if (n < o.steps.length) { n++; apply(); } });
  side.querySelector('[data-a="reset"]').addEventListener('click', () => { n = 0; apply(); });
  ch.offAll(o.steps.map(s => s.g));
  paint();
  return wrap;
}

/* ---------- ejercicio «¿qué sabemos?» ---------- */
function knowBlock(o) {
  const n = el(`<div class="knblk">
    <div class="kn-q">${o.q || '¿Qué sabemos en este momento?'}</div>
    <div class="kn">${o.items.map((it, i) => `<label data-i="${i}"><input type="checkbox"><span>${it.t}</span></label>`).join('')}</div>
    <div class="kn-bar"><button data-a="go">Comprobar</button></div>
    <div class="kn-res"></div>
  </div>`);
  const res = n.querySelector('.kn-res');
  n.querySelector('[data-a="go"]').addEventListener('click', () => {
    const picked = [...n.querySelectorAll('.kn input')].map(i => i.checked);
    n.querySelectorAll('.kn label').forEach((l, i) => {
      const ok = o.items[i].ok;
      l.classList.toggle('ok', ok && picked[i]);
      l.classList.toggle('bad', !ok && picked[i]);
      if (!l.querySelector('.why')) l.querySelector('span').insertAdjacentHTML('beforeend', `<span class="why">${o.items[i].why}</span>`);
    });
    res.innerHTML = '';
    res.appendChild(facts({ h: o.h, i: o.i, u: o.u }));
    res.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
  return n;
}

/* ---------- panel de lectura manual (confluencias / concordancia) ---------- */
function readPanel(o) {
  const n = el(`<div class="rpanel">
    <div class="rp-g">${o.rows.map((r, i) => `<div class="rp-row" data-i="${i}">
      <div class="rp-k">${r.t}${r.fam ? `<span class="fam">${r.fam}</span>` : ''}</div>
      <div class="rp-o">${r.opts.map((op, j) => `<button data-j="${j}">${op}</button>`).join('')}</div>
    </div>`).join('')}</div>
    <div class="rp-bar"><button data-a="go">Comparar lectura</button><button data-a="rs" class="sec">Limpiar</button></div>
    <div class="rp-res"></div>
  </div>`);
  const pick = new Array(o.rows.length).fill(-1);
  n.querySelectorAll('.rp-row').forEach((row, i) => row.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    row.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); pick[i] = +b.dataset.j;
  })));
  const res = n.querySelector('.rp-res');
  n.querySelector('[data-a="rs"]').addEventListener('click', () => {
    pick.fill(-1); n.querySelectorAll('.rp-o button').forEach(b => b.classList.remove('on')); res.innerHTML = '';
  });
  n.querySelector('[data-a="go"]').addEventListener('click', () => {
    const same = [], diff = [], miss = [];
    o.rows.forEach((r, i) => {
      if (pick[i] < 0) { miss.push(`<b>${r.t}</b> — sin responder: ${r.why}`); return; }
      (pick[i] === r.ref ? same : diff).push(`<b>${r.t}</b> — tú: ${r.opts[pick[i]]}${pick[i] === r.ref ? '' : ' · lectura del gráfico: ' + r.opts[r.ref]}. ${r.why}`);
    });
    res.innerHTML = `<div class="rp-cols">
      <div class="rp-c ok"><h5>Coincidencias (${same.length})</h5><ul>${same.map(x => `<li>${x}</li>`).join('') || '<li>Ninguna todavía.</li>'}</ul></div>
      <div class="rp-c no"><h5>Diferencias (${diff.length})</h5><ul>${diff.map(x => `<li>${x}</li>`).join('') || '<li>Ninguna.</li>'}</ul></div>
    </div>${miss.length ? `<div class="rp-c mi"><h5>Información que no marcaste</h5><ul>${miss.map(x => `<li>${x}</li>`).join('')}</ul></div>` : ''}`;
    res.appendChild(facts({ h: o.h, i: o.i, u: o.u }));
    if (o.inval) res.appendChild(el(`<div class="note no">${o.inval}</div>`));
  });
  return n;
}

/* ---------- bloques declarativos ---------- */
function build(blocks) {
  const frag = document.createDocumentFragment();
  blocks.forEach(b => {
    if (!b) return;
    if (b.nodeType) { frag.appendChild(b); return; }
    switch (b.k) {
      case 'h': frag.appendChild(el(`<h3 class="sec">${b.t}</h3>`)); if (b.d) frag.appendChild(el(`<p class="sub">${b.d}</p>`)); break;
      case 'p': frag.appendChild(el(`<div class="body"><p>${b.t}</p></div>`)); break;
      case 'chart': frag.appendChild(mkChart(b).node); break;
      case 'qa': frag.appendChild(qa(b.items, b.keys)); break;
      case 'note': frag.appendChild(el(`<div class="note ${b.t2 || ''}">${b.t}</div>`)); break;
      case 'cards': frag.appendChild(el(`<div class="grid g${b.n || 3}">${b.items.map(c => `<div class="card ${c.c || ''}"><h4>${c.t}</h4>${c.d.map(p => `<p>${p}</p>`).join('')}</div>`).join('')}</div>`)); break;
      case 'flow': frag.appendChild(el(`<div class="flow">${b.items.map((s, i) => `<div class="st"><span class="i">${String(i + 1).padStart(2, '0')}</span><h5>${s.t}</h5><p>${s.d}</p></div>`).join('')}</div>`)); break;
      case 'ticks': frag.appendChild(el(`<ul class="ticks ${b.t2 || ''}">${b.items.map(i => `<li>${i}</li>`).join('')}</ul>`)); break;
      case 'grid': { const g = el(`<div class="grid g${b.n || 2}"></div>`); b.items.forEach(x => g.appendChild(x.nodeType ? x : mkChart(x).node)); frag.appendChild(g); break; }
      case 'raw': frag.appendChild(el(b.t)); break;
      case 'vs': frag.appendChild(vs(b.items, b)); break;
      case 'neq': frag.appendChild(neq(b.items)); break;
      case 'facts': frag.appendChild(facts(b)); break;
      case 'scen': frag.appendChild(scen(b.items, b)); break;
      case 'llab': frag.appendChild(layerLab(b)); break;
      case 'know': frag.appendChild(knowBlock(b)); break;
      case 'bot': frag.appendChild(bot(b.items)); break;
      case 'rpanel': frag.appendChild(readPanel(b)); break;
    }
  });
  return frag;
}

/* ============================================================
   IMPULSO Y RETROCESO — módulo con medidor interactivo
   ============================================================ */

/* laboratorio: seleccionar dos swings y medir el tramo */
function impulseLab(cfg) {
  const cd = cfg.candles, sw = cfg.swings; /* sw: [[i,'H'|'L'], ...] */
  const atr = IND.atr(cd, 14);
  const px = (i, s) => s === 'H' ? cd[i].h : cd[i].l;
  let a = cfg.start ? cfg.start[0] : sw[0][0], b = cfg.start ? cfg.start[1] : sw[1][0];

  const wrap = el(`<div class="llab"></div>`);
  const side = el(`<div class="llab-side">
    <div class="llab-q">Haz clic en dos giros del gráfico</div>
    <div class="meas"></div>
    <div class="llab-bar"><button data-a="imp" class="sec">Medir el impulso</button><button data-a="ret" class="sec">Medir el retroceso</button></div>
  </div>`);

  const ov = () => {
    const ia = Math.min(a, b), ib = Math.max(a, b);
    const sa = (sw.find(s => s[0] === ia) || [ia, 'L'])[1], sb = (sw.find(s => s[0] === ib) || [ib, 'H'])[1];
    const pa = px(ia, sa), pb = px(ib, sb);
    const up = pb >= pa, col = up ? C.bull : C.bear;
    return [
      ...sw.map(([i, s]) => ({ k: 'swing', i, side: s, text: s === 'H' ? 'H' : 'L', color: i === a || i === b ? C.gold : '#4E586A', fs: 9.5 })),
      { k: 'trend', i1: ia, p1: pa, i2: ib, p2: pb, color: col, lw: 2, op: .9 },
      { k: 'level', p: pa, from: ia, to: ib, color: col, dash: '2 4', op: .45 },
      { k: 'level', p: pb, from: ia, to: ib, color: col, dash: '2 4', op: .45 },
      { k: 'bracket', from: ia, to: ib, text: (ib - ia) + ' velas', color: col },
      { k: 'note', i: Math.round((ia + ib) / 2), py: (pa + pb) / 2, text: (pb - pa >= 0 ? '+' : '') + (pb - pa).toFixed(1) + ' $', color: col, arrow: false, fs: 11.5 }
    ];
  };

  const ch = mkChart({
    title: cfg.title || 'Medidor de tramos', tf: cfg.tf || 'XAUUSD · M15', h: cfg.h || 300, naked: false,
    candles: cd, ov: ov(),
    panes: [{
      title: 'ATR(14)', h: 72,
      series: [{ data: atr, color: C.warn, name: 'volatilidad media por vela' }]
    }],
    onPick: ({ i }) => {
      let best = sw[0][0], d = 1e9;
      sw.forEach(([j]) => { if (Math.abs(j - i) < d) { d = Math.abs(j - i); best = j; } });
      if (best === a || best === b) return;
      a = b; b = best;
      ch.setOv(ov()); paint();
    }
  });

  const meas = side.querySelector('.meas');
  function paint() {
    const ia = Math.min(a, b), ib = Math.max(a, b);
    const sa = (sw.find(s => s[0] === ia) || [ia, 'L'])[1], sb = (sw.find(s => s[0] === ib) || [ib, 'H'])[1];
    const pa = px(ia, sa), pb = px(ib, sb);
    const d = pb - pa, bars = ib - ia || 1;
    const at = atr[ib] ?? IND.last(atr) ?? 1;
    /* tramo anterior, para calcular profundidad del retroceso */
    const prev = sw.filter(s => s[0] < ia).pop();
    let deep = null;
    if (prev) {
      const pp = px(prev[0], prev[1]);
      const prevLeg = pa - pp;
      if (prevLeg && Math.sign(prevLeg) !== Math.sign(d)) deep = Math.abs(d / prevLeg) * 100;
    }
    const rows = [
      ['distancia', (d >= 0 ? '+' : '') + d.toFixed(1) + ' $'],
      ['porcentaje', (d / pa * 100).toFixed(2) + ' %'],
      ['velas', bars],
      ['velocidad', (d / bars).toFixed(2) + ' $/vela'],
      ['ATR(14) actual', at.toFixed(2) + ' $'],
      ['tramo en ATR', (Math.abs(d) / at).toFixed(1) + ' × ATR']
    ];
    if (deep != null) rows.push(['retroceso del tramo previo', deep.toFixed(0) + ' %']);
    const verdict = deep != null
      ? (deep < 40 ? ['retroceso poco profundo', 'El movimiento previo apenas se devuelve: el lado que empujó sigue defendiendo el precio. <b>Aporta evidencia</b> de continuación, no la garantiza.', 'bull']
        : deep < 70 ? ['retroceso normal', 'Profundidad corriente. No añade ni quita evidencia por sí sola: hay que mirar dónde se frena y qué estructura deja.', '']
          : ['retroceso profundo', 'Se devuelve casi todo el tramo. El impulso previo pierde significado y conviene tratar la zona como disputada, no como tendencia clara.', 'warn'])
      : (Math.abs(d) / at > 3 ? ['impulso fuerte', 'Recorrido muy superior a la volatilidad media de las velas: eso es <b>expansión</b>. Suele dejar desequilibrios (FVG) detrás.', 'bull']
        : Math.abs(d) / at > 1.6 ? ['impulso normal', 'Movimiento en línea con la volatilidad reciente.', '']
          : ['impulso débil / contracción', 'El tramo apenas supera lo que se mueve una vela normal. Es contracción: el mercado está comprimiendo, no tendenciando.', 'warn']);
    meas.innerHTML = `<div class="ms-rows">${rows.map(r => `<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>
      <div class="ms-v ${verdict[2]}"><h5>${verdict[0]}</h5><p>${verdict[1]}</p></div>`;
  }

  side.querySelector('[data-a="imp"]').addEventListener('click', () => { a = cfg.imp[0]; b = cfg.imp[1]; ch.setOv(ov()); paint(); });
  side.querySelector('[data-a="ret"]').addEventListener('click', () => { a = cfg.ret[0]; b = cfg.ret[1]; ch.setOv(ov()); paint(); });

  wrap.appendChild(ch.node); wrap.appendChild(side);
  paint();
  return wrap;
}

/* ---------- galería reutilizable ---------- */
function gallery(items) {
  const wrap = el('<div></div>');
  const bar = el(`<div class="gal">${items.map((it, i) => `<button data-i="${i}" class="${i ? '' : 'on'}">${it.n}</button>`).join('')}</div>`);
  const host = el('<div></div>');
  wrap.append(bar, host);
  const show = i => {
    host.innerHTML = '';
    const it = items[i];
    host.appendChild(mkChart(it.chart).node);
    if (it.cards) host.appendChild(el(`<div class="grid g2">${it.cards.map(c => `<div class="card ${c.c || ''}"><h4>${c.t}</h4>${c.d.map(p => `<p>${p}</p>`).join('')}</div>`).join('')}</div>`));
  };
  bar.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    bar.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); show(+b.dataset.i);
  }));
  show(0); return wrap;
}

function chartMom(n) {
  const base = [[0, 4290, 'L'], [16, 4360, 'H'], [26, 4338, 'L'], [42, 4412, 'H']];
  if (n === 1) {
    const c = RS(base.concat([[54, 4380, 'L'], [66, 4430, 'H']]), 331, { rough: .6 });
    return {
      title: 'Escenario A', tf: 'XAUUSD · M15', h: 230, candles: c,
      ov: [{ k: 'level', p: 4380, color: C.bull, dash: '4 4', label: 'HL' }],
      panes: [{ title: 'RSI(14)', h: 66, min: 10, max: 90, lines: [{ v: 50, color: '#242C38', label: '50' }], series: [{ data: IND.rsi(c, 14), color: C.info }] },
      { title: 'Estocástico', h: 60, min: 0, max: 100, lines: [{ v: 20, color: '#1E3A30', label: '20' }], series: [{ data: IND.stoch(c).k, color: C.gold }] }]
    };
  }
  if (n === 2) {
    const c = RS(base.concat([[54, 4382, 'L'], [72, 4424, 'H'], [84, 4396, 'L']]), 332, { rough: .64 });
    const r = IND.rsi(c, 14);
    return {
      title: 'Escenario B', tf: 'XAUUSD · M15', h: 230, candles: c,
      ov: [{ k: 'level', p: 4382, color: C.warn, dash: '4 4', label: 'HL intacto' }, { k: 'trend', i1: 42, p1: 4412, i2: 72, p2: 4424, color: C.bull, dash: '3 3' }],
      panes: [{ title: 'RSI(14)', h: 66, min: 10, max: 90, lines: [{ v: 50, color: '#242C38', label: '50' }], series: [{ data: r, color: C.info }], zigs: [{ pts: [[42, r[42]], [72, r[72]]], color: C.bear }] },
      { title: 'Estocástico', h: 60, min: 0, max: 100, lines: [{ v: 80, color: '#3A2530', label: '80' }], series: [{ data: IND.stoch(c).k, color: C.gold }] }]
    };
  }
  const c = RS(base.concat([[54, 4382, 'L'], [72, 4424, 'H'], [88, 4352, 'L'], [98, 4384, 'H'], [112, 4318, 'L']]), 333, { rough: .66 });
  const r = IND.rsi(c, 14);
  return {
    title: 'Escenario C', tf: 'XAUUSD · M15', h: 230, candles: c,
    ov: [{ k: 'level', p: 4382, color: C.bear, dash: '4 4', label: 'HL perdido' }, { k: 'mark', i: 86, side: 'L', text: 'desplazamiento', color: C.bear, fs: 9.5 }, { k: 'swing', i: 98, side: 'H', text: 'LH', color: C.bear, fs: 9.5 }],
    panes: [{ title: 'RSI(14)', h: 66, min: 10, max: 90, lines: [{ v: 50, color: '#242C38', label: '50' }], series: [{ data: r, color: C.info }] },
    { title: 'Estocástico', h: 60, min: 0, max: 100, lines: [{ v: 20, color: '#1E3A30', label: '20' }], series: [{ data: IND.stoch(c).k, color: C.gold }] }]
  };
}

/* ---------------- FRACTALIDAD Y MULTI-TIMEFRAME LAB ---------------- */
function zoomLab(levels) {
  const wrap = el(`<div class="zoom">
    <div class="zoom-tabs">${levels.map((l, i) => `<button data-i="${i}" class="${i ? '' : 'on'}">${l.tf}</button>`).join('')}</div>
    <div class="zoom-body"></div>
    <div class="zoom-bar"><button data-a="out" class="sec">◂ Contexto superior</button><button data-a="in">Ampliar el recuadro ▸</button></div>
  </div>`);
  const body = wrap.querySelector('.zoom-body');
  let cur = 0;
  const nodes = levels.map(l => mkChart({ ...l.chart, title: l.tf, tf: l.role, naked: false }).node);
  const show = i => {
    cur = i;
    body.innerHTML = '';
    body.appendChild(nodes[i]);
    body.appendChild(el(`<div class="zoom-txt"><span class="lv">${levels[i].tf}</span><p>${levels[i].d}</p></div>`));
    wrap.querySelectorAll('.zoom-tabs button').forEach((b, k) => b.classList.toggle('on', k === i));
    wrap.querySelector('[data-a="in"]').disabled = i >= levels.length - 1;
    wrap.querySelector('[data-a="out"]').disabled = i === 0;
    REG.forEach(r => { if (r.box.isConnected) r.render(false); });
  };
  wrap.querySelectorAll('.zoom-tabs button').forEach(b => b.addEventListener('click', () => show(+b.dataset.i)));
  wrap.querySelector('[data-a="in"]').addEventListener('click', () => show(Math.min(levels.length - 1, cur + 1)));
  wrap.querySelector('[data-a="out"]').addEventListener('click', () => show(Math.max(0, cur - 1)));
  show(0);
  return wrap;
}

    body.appendChild(el(`<div class="grid g2"><div class="card gold"><h4>Cómo se reparte el trabajo</h4><p>${m.d}</p></div><div class="card"><h4>El error típico de este horizonte</h4><p>${m.warn}</p></div></div>`));
    w.querySelectorAll('.tfpick button').forEach((b, k) => b.classList.toggle('on', k === i));
    REG.forEach(r => { if (r.box.isConnected) r.render(false); });
  };
  w.querySelectorAll('.tfpick button').forEach(b => b.addEventListener('click', () => show(+b.dataset.i)));
  show(1);
  return w;
}

const LVL = [
  ['Nivel 1', 'limpio'], ['Nivel 2', 'realista'], ['Nivel 3', 'difícil'], ['Nivel 4', 'mercado']
];
function practiceBlock() {
  const host = el('<div></div>');
  const tabs = el(`<div class="lvtabs">${LVL.map((l, k) => `<button data-l="${k + 1}" class="${k === 0 ? 'on' : ''}">${l[0]}<span class="d">${l[1]}</span></button>`).join('')}</div>`);
  const body = el('<div></div>');
  host.appendChild(tabs); host.appendChild(body);
  let lv = 1, LIST = [], i = 0, score = 0, done = 0, locked = false;
  const pick = n => {
    lv = n; LIST = EX.filter(e => (e.lv || 2) === lv);
    if (!LIST.length) LIST = EX.slice();
    i = 0; score = 0; done = 0;
    tabs.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.l === lv));
    draw();
  };
  tabs.querySelectorAll('button').forEach(b => b.addEventListener('click', () => pick(+b.dataset.l)));

  function draw() {
    body.innerHTML = ''; locked = false;
    const ex = LIST[i];
    const node = el(`<div class="quiz">
      <div class="quiz-top"><span class="q">Ejercicio ${i + 1} de ${LIST.length}</span><span class="lvb">${LVL[lv - 1][1]}</span><span style="flex:1"></span><div class="score">Aciertos <b>${score}</b> de ${done}</div></div>
      <div class="quiz-q">${ex.q}</div>
      <div class="quiz-hint">${ex.hint}</div>
      <div class="qchart"></div>
      <div class="opts"></div>
      <div class="quiz-sol" style="display:none"></div>
      <div class="quiz-act"></div>
    </div>`);
    const chart = mkChart(Object.assign({}, ex.chart, {
      onPick: (pt) => { if (ex.type === 'click' && !locked) judgeClick(pt); }
    }));
    chart.offAll(['sol']);
    node.querySelector('.qchart').appendChild(chart.node);
    const opts = node.querySelector('.opts'), sol = node.querySelector('.quiz-sol'), act = node.querySelector('.quiz-act');

    if (ex.type === 'choice') {
      ex.opts.forEach((o, k) => {
        const b = el(`<button><span class="k">${String.fromCharCode(65 + k)}</span><span>${o}</span></button>`);
        b.addEventListener('click', () => {
          if (locked) return; locked = true;
          const good = k === ex.ok; done++; if (good) score++;
          [...opts.children].forEach((c, ci) => { c.disabled = true; if (ci === ex.ok) c.classList.add('ok'); else if (ci === k) c.classList.add('ko'); });
          reveal(good ? 'Correcto.' : 'No exactamente.');
        });
        opts.appendChild(b);
      });
    } else if (ex.type === 'multi') {
      const kn = el(`<div class="kn">${ex.items.map((it, k) => `<label data-i="${k}"><input type="checkbox"><span>${it.t}</span></label>`).join('')}</div>`);
      opts.appendChild(kn);
      const go = el('<button class="btn">Comprobar</button>');
      go.addEventListener('click', () => {
        if (locked) return; locked = true; done++;
        const picked = [...kn.querySelectorAll('input')].map(x => x.checked);
        let good = true;
        kn.querySelectorAll('label').forEach((l, k) => {
          const it = ex.items[k];
          if (picked[k] !== !!it.ok) good = false;
          l.classList.toggle('ok', it.ok && picked[k]);
          l.classList.toggle('bad', !it.ok && picked[k]);
          l.querySelector('span').insertAdjacentHTML('beforeend', `<span class="why">${it.why}</span>`);
          l.querySelector('input').disabled = true;
        });
        if (good) score++;
        go.remove();
        reveal(good ? 'Lectura limpia.' : 'Revisa lo marcado.');
      });
      opts.appendChild(go);
    } else {
      opts.appendChild(el(`<div class="mut" style="font-size:13.4px;padding:2px 0">Haz clic directamente sobre el gráfico.</div>`));
    }

    function judgeClick(pt) {
      locked = true; done++;
      let good = false;
      if (ex.target.i != null) good = Math.abs(pt.i - ex.target.i) <= ex.target.tol;
      else good = Math.abs(pt.p - ex.target.p) <= ex.target.tol;
      if (good) score++;
      reveal(good ? 'Buen ojo.' : 'Ahí no era.');
    }

    function reveal(verdict) {
      chart.on('sol');
      sol.style.display = 'block';
      sol.innerHTML = `<div class="solbox"><b>${verdict}</b> ${ex.why}</div>`;
      node.querySelector('.score').innerHTML = `Aciertos <b>${score}</b> de ${done}`;
      act.innerHTML = '';
      if (i < LIST.length - 1) { const b = el('<button class="btn">Siguiente ejercicio →</button>'); b.addEventListener('click', () => { i++; draw(); }); act.appendChild(b); }
      else {
        const b = el('<button class="btn plain">Empezar de nuevo</button>');
        b.addEventListener('click', () => { i = 0; score = 0; done = 0; draw(); });
        act.appendChild(el(`<div class="solbox" style="border-left-color:var(--bull);width:100%">Nivel terminado con <b>${score} de ${done}</b>. Lo importante no es el marcador, sino si has sabido <b>explicar por qué</b> en cada uno.</div>`));
        act.appendChild(b);
      }
      act.appendChild(el('<span style="flex:1"></span>'));
    }
    body.appendChild(node);
  }
  pick(1);
  return host;
}

/* recorrido por fases con evidencias marcables */
function examBlock(cfg) {
  const wrap = el(`<div class="exam">
    <div class="exam-h"><h4>${cfg.t}</h4><span class="st">0 / ${cfg.steps.length} fases revisadas</span></div>
    <div class="exam-steps"></div>
    <div class="exam-bar"><button data-a="go">Comparar con el análisis</button><button data-a="rs" class="sec">Empezar de nuevo</button></div>
    <div class="exam-out"></div>
  </div>`);
  const host = wrap.querySelector('.exam-steps');
  cfg.steps.forEach((s, i) => {
    const n = el(`<div class="exam-step">
      <h5><span class="n">${String(i + 1).padStart(2, '0')}</span>${s.t}<span class="c">0/${s.items.length}</span></h5>
      <div class="bd"><p class="exq">${s.q}</p>
      <div class="kn">${s.items.map((it, k) => `<label data-k="${k}"><input type="checkbox"><span>${it.t}</span></label>`).join('')}</div></div>
    </div>`);
    n.querySelector('h5').addEventListener('click', () => n.classList.toggle('open'));
    n.querySelectorAll('input').forEach(inp => inp.addEventListener('change', () => {
      n.querySelector('.c').textContent = [...n.querySelectorAll('input')].filter(x => x.checked).length + '/' + s.items.length;
      wrap.querySelector('.exam-h .st').textContent = [...host.querySelectorAll('.exam-step')].filter(st => st.querySelector('input:checked')).length + ' / ' + cfg.steps.length + ' fases revisadas';
    }));
    if (i === 0) n.classList.add('open');
    host.appendChild(n);
  });
  const out = wrap.querySelector('.exam-out');
  wrap.querySelector('[data-a="rs"]').addEventListener('click', () => {
    host.querySelectorAll('input').forEach(x => { x.checked = false; x.disabled = false; });
    host.querySelectorAll('label').forEach(l => { l.classList.remove('ok', 'bad'); const w = l.querySelector('.why'); if (w) w.remove(); });
    host.querySelectorAll('.c').forEach((c, i) => c.textContent = '0/' + cfg.steps[i].items.length);
    wrap.querySelector('.exam-h .st').textContent = '0 / ' + cfg.steps.length + ' fases revisadas';
    out.innerHTML = '';
  });
  wrap.querySelector('[data-a="go"]').addEventListener('click', () => {
    const hit = [], missed = [], wrong = [];
    host.querySelectorAll('.exam-step').forEach((n, i) => {
      n.classList.add('open');
      n.querySelectorAll('label').forEach((l, k) => {
        const it = cfg.steps[i].items[k], chk = l.querySelector('input').checked;
        l.querySelector('input').disabled = true;
        if (!l.querySelector('.why')) l.querySelector('span').insertAdjacentHTML('beforeend', `<span class="why">${it.why}</span>`);
        if (it.ok && chk) { l.classList.add('ok'); hit.push(`<b>${cfg.steps[i].t}</b> — ${it.t}`); }
        else if (it.ok && !chk) missed.push(`<b>${cfg.steps[i].t}</b> — ${it.t}`);
        else if (!it.ok && chk) { l.classList.add('bad'); wrong.push(`<b>${cfg.steps[i].t}</b> — ${it.t} <i>${it.why}</i>`); }
      });
    });
    const sec = (cls, t, list, empty) => `<div class="rp-c ${cls}"><h5>${t} (${list.length})</h5><ul>${list.map(x => `<li>${x}</li>`).join('') || `<li>${empty}</li>`}</ul></div>`;
    out.innerHTML = `<div class="exam-res">
      <div class="rg">
        ${sec('ok', 'Evidencias que detectaste', hit, 'Ninguna todavía.')}
        ${sec('mi', 'Evidencias que no marcaste', missed, 'Ninguna: las viste todas.')}
      </div>
      ${wrong.length ? sec('no', 'Interpretaciones que el gráfico no sostiene', wrong, '') : ''}
    </div>`;
    const r = el('<div class="exam-res"></div>');
    r.appendChild(facts({ h: cfg.report.h, i: cfg.report.i, u: cfg.report.u }));
    if (cfg.report.red) r.appendChild(el(`<div class="note">${cfg.report.red}</div>`));
    if (cfg.report.conf) r.appendChild(el(`<div class="note warn">${cfg.report.conf}</div>`));
    r.appendChild(el(`<div class="note no">${cfg.report.inval}</div>`));
    out.appendChild(r);
    out.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
  return wrap;
}

    <div class="kn">${cfg.items.map((it, k) => `<label data-k="${k}"><input type="checkbox"><span>${it.t}</span></label>`).join('')}</div>
    <div class="lq-b"><button class="btn">Comprobar</button></div><div class="lq-x" hidden></div></div>`);
  n.querySelector('.lq-b button').addEventListener('click', e => {
    e.target.remove();
    let good = 0, bad = 0, miss = 0;
    n.querySelectorAll('.kn label').forEach((l, k) => {
      const it = cfg.items[k], c = l.querySelector('input').checked; l.querySelector('input').disabled = true;
      if (c && it.ok === true) { l.classList.add('ok'); good++; }
      else if (c && it.ok === 'part') { l.classList.add('part'); good++; }
      else if (c) { l.classList.add('bad'); bad++; }
      else if (it.ok === true) miss++;
      l.querySelector('span').insertAdjacentHTML('beforeend', `<span class="why">${it.why}</span>`);
    });
    const x = n.querySelector('.lq-x'); x.hidden = false;
    x.innerHTML = `<b class="vd ${bad ? 'no' : miss ? 'part' : 'ok'}">${good} válidas marcadas · ${bad} que el gráfico no sostiene · ${miss} sin marcar.</b> ${cfg.why || ''}`;
    if (cfg.onAnswer) cfg.onAnswer({ good, bad, miss });
  });
  return n;
}
/* ---------- tabla de medidas (se muestra DESPUÉS de decidir mirando el precio) ---------- */
function metricsBox(rows, t = 'Lo que miden los números') {
  return el(`<div class="lmet"><h5>${t}</h5><div class="lmet-g">${rows.map(([k, v, s]) => `<div><span>${k}</span><b>${v}</b>${s ? `<i>${s}</i>` : ''}</div>`).join('')}</div></div>`);
}
function domMetrics(cd, a, b) {
  const m = LAB.dominance(cd, a, b), ax = IND.adx(cd, 14).adx, r = IND.rsi(cd, 14);
  return [
    ['Desplazamiento neto', (m.net >= 0 ? '+' : '') + m.net.toFixed(1) + ' $', m.net >= 0 ? 'sube' : 'baja'],
    ['Distancia en ATR', Math.abs(m.atrN).toFixed(1) + ' ATR', Math.abs(m.atrN) >= 4 ? 'grande' : Math.abs(m.atrN) >= 2 ? 'media' : 'pequeña'],
    ['Velocidad', Math.abs(m.speed).toFixed(2) + ' $/vela', m.bars + ' velas'],
    ['Eficiencia', Math.round(m.er * 100) + ' %', m.er >= .45 ? 'directo' : m.er >= .25 ? 'con retrocesos' : 'va y viene'],
    ['ADX(14)', ax[b] != null ? ax[b].toFixed(0) : '—', ax[b] >= 25 ? 'con fuerza' : 'sin fuerza'],
    ['RSI(14)', r[b] != null ? r[b].toFixed(0) : '—', 'momentum']
  ];
}
function lvTabs(onPick, cur = 1, list = LV4) {
  const t = el(`<div class="lvtabs">${list.map((l, k) => `<button data-l="${k + 1}" class="${k + 1 === cur ? 'on' : ''}">${l[0]}<span class="d">${l[1]}</span></button>`).join('')}</div>`);
  t.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { t.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); onPick(+b.dataset.l); }));
  return t;
}

/* ============================================================
   quizSeq — secuencia de ejercicios sobre gráfico, con niveles.
   La solución (overlays, medidas, paneles) NO existe en el DOM
   hasta que el alumno responde.
   item: { lv, cd|()=>cd, tf, q, hint, opts, why, sol(cd), metrics(cd), panes(cd), h }
   ============================================================ */
function quizSeq(items, o = {}) {
  const host = el(`<div class="lqz"></div>`), body = el('<div></div>');
  let lv = o.levels ? 1 : 0, list = [], i = 0, sc = 0, dn = 0;
  if (o.levels) host.appendChild(lvTabs(l => pick(l)));
  host.appendChild(body);
  function pick(l) { lv = l; list = o.levels ? items.filter(x => (x.lv || 1) === l) : items.slice(); if (!list.length) list = items.slice(); i = 0; sc = 0; dn = 0; draw(); }
  function draw() {
    body.innerHTML = '';
    const it = list[i], cd = typeof it.cd === 'function' ? it.cd() : it.cd, L4 = (it.lv || lv) === 4;
    const card = el(`<div class="quiz lab-card">
      <div class="quiz-top"><span class="q">${o.label || 'Ejercicio'} ${i + 1} de ${list.length}</span>${o.levels ? `<span class="lvb">${LV4[lv - 1][1]}</span>` : ''}<span style="flex:1"></span><div class="score">Razonables <b>${sc}</b> de ${dn}</div></div>
      <div class="qchart"></div><div class="qbody"></div><div class="quiz-act"></div></div>`);
    const ch = lchart(cd, { title: it.title || 'XAUUSD', tf: it.tf || 'M5', ov: (it.ov || []).slice(), h: it.h || 290, padR: it.padR, panes: it.panes0 ? it.panes0(cd) : undefined });
    if (it.ctx) card.querySelector('.qchart').appendChild(el(`<div class="qctx">${it.ctx}</div>`));
    card.querySelector('.qchart').appendChild(ch.node);
    const q = ask({
      q: L4 && !it.keepQ ? '¿Qué observas?' : it.q, hint: L4 ? '' : it.hint, opts: it.opts, why: it.why,
      onAnswer(op) {
        dn++; if (op.v === 'ok') sc++;
        card.querySelector('.score').innerHTML = `Razonables <b>${sc}</b> de ${dn}`;
        if (it.sol) ch.setOv((it.ov || []).concat(it.sol(cd).map(x => ({ ...x, force: true }))));
        if (it.panes) { ch.spec.panes = it.panes(cd); ch.render(false); }
        if (it.metrics) card.querySelector('.qbody').appendChild(metricsBox(it.metrics(cd), it.metT));
        if (it.after) card.querySelector('.qbody').appendChild(el(`<div class="note key">${it.after}</div>`));
        const act = card.querySelector('.quiz-act'); act.innerHTML = '';
        if (i < list.length - 1) { const b = el('<button class="btn">Siguiente →</button>'); b.onclick = () => { i++; draw(); }; act.appendChild(b); }
        else { act.appendChild(el(`<div class="solbox" style="width:100%">Serie terminada: <b>${sc} de ${dn}</b> respuestas razonables. Lo que cuenta es poder explicar <b>por qué</b>, no el marcador.</div>`)); const b = el('<button class="btn plain">Repetir</button>'); b.onclick = () => pick(lv || 1); act.appendChild(b); }
        if (o.onDone) o.onDone(it, op);
      }
    });
    card.querySelector('.qbody').appendChild(q);
    body.appendChild(card);
  }
  pick(1);
  return host;
}

/* ============================================================
   DETECTOR DE LIQUIDEZ
   case: { lv, tf, cd, show (velas visibles), zones:[{side,p,from,to,why}],
           ans: 'up'|'down'|'both'|'none', guide:[[pregunta, respuesta]],
           cont: {checks} (nivel 4: qué hace el precio después) }
   ============================================================ */
function liqDetector(cases) {
  const host = el('<div class="liqd"></div>'), body = el('<div></div>');
  let lv = 1, list = [], ix = 0;
  host.appendChild(lvTabs(l => { lv = l; list = cases.filter(c => c.lv === l); ix = 0; draw(); }));
  host.appendChild(body);
  const TOOLS = [['up', 'Liquidez superior'], ['down', 'Liquidez inferior'], ['both', 'Ambas'], ['none', 'No veo una zona clara']];
  function draw() {
    body.innerHTML = '';
    const c = list[ix], show = c.show || c.cd.length, cd = c.cd;
    const wrap = el(`<div class="lab">
      <div class="lab-main"></div>
      <aside class="lab-side">
        <div class="ls-top"><span>Caso ${ix + 1} de ${list.length}</span><span class="lvb">${LV4[lv - 1][1]}</span></div>
        <div class="ls-h">${lv === 4 ? '¿Qué observas? ¿Hay alguna zona evidente?' : '¿Dónde crees que puede haber liquidez?'}</div>
        <p class="ls-p">Haz clic en el gráfico para marcar la altura de las zonas que veas (hasta 3). Después elige una opción.</p>
        <div class="ls-tools">${TOOLS.map(([k, t]) => `<button data-t="${k}">${t}</button>`).join('')}</div>
        <div class="ls-guide"></div>
        <div class="ls-bar"><button class="btn" data-a="rev" disabled>Revelar</button><button class="btn plain" data-a="clr">Borrar marcas</button></div>
        <div class="ls-x"></div>
        <div class="ls-nav"></div>
      </aside></div>`);
    const base = [];
    const ch = lchart(cd, { title: 'XAUUSD', tf: c.tf || 'M5', ov: base, h: 360, play: !!c.cont, playFrom: show, causal: !!c.cont, lockFwd: () => !revealed || (pending != null) });
    wrap.querySelector('.lab-main').appendChild(ch.node);
    if (c.cont) ch.node.classList.add('noplay');
    const marks = []; let tool = null, revealed = false, pending = null;
    const paint = extra => ch.setOv(base.concat(marks.map((m, k) => ({ k: 'level', p: m.p, color: C.gold, dash: '2 3', lw: 1.3, label: 'tu marca ' + (k + 1), lab: 'in', L: 'user' })), extra || []));
    const clk = onChartClick(ch, pt => { if (revealed || pt.i >= show) return; if (marks.length >= 3) marks.shift(); marks.push(pt); paint(); gate(); });
    wrap.querySelector('[data-a="clr"]').onclick = () => { if (revealed) return; marks.length = 0; paint(); };
    const revB = wrap.querySelector('[data-a="rev"]');
    const gate = () => { revB.disabled = !tool; };
    wrap.querySelectorAll('.ls-tools button').forEach(b => b.onclick = () => {
      if (revealed) return; tool = b.dataset.t;
      wrap.querySelectorAll('.ls-tools button').forEach(x => x.classList.toggle('on', x === b)); gate();
    });
    /* preguntas guía: cada respuesta aparece solo al pedirla */
    const gd = wrap.querySelector('.ls-guide');
    if (c.guide && lv < 4) {
      let g = 0;
      const next = () => {
        if (g >= c.guide.length) return;
        const [q, a] = c.guide[g++];
        const row = el(`<div class="gq"><b>${q}</b><button class="lnk">ver una respuesta posible</button></div>`);
        row.querySelector('button').onclick = e => { e.target.replaceWith(el(`<p>${a}</p>`)); next(); };
        gd.appendChild(row);
      };
      next();
    }
    revB.onclick = () => {
      if (revealed) return; revealed = true; clk.off();
      const a = LAB.atr(cd.slice(0, show)), tol = (LAB.atrAt(a, show - 1) || 2) * 1.2;
      const sol = c.zones.flatMap(z => [
        { k: 'zone', p1: z.p + (z.side === 'H' ? tol * .15 : -tol * .15), p2: z.p - (z.side === 'H' ? tol * .5 : -tol * .5), from: z.from, to: show - 1, color: C.liq, fo: .13, label: 'zona candidata', L: 'liq', force: true },
        { k: 'stops', p: z.side === 'H' ? z.p + tol * .9 : z.p - tol * .2, from: z.from, to: z.to, n: 5, color: C.liq, L: 'liq', force: true }
      ]);
      paint(sol);
      const hitM = marks.map(m => c.zones.some(z => Math.abs(z.p - m.p) <= tol));
      const good = tool === c.ans, near = (c.ans === 'both' && (tool === 'up' || tool === 'down')) || (tool === 'both' && (c.ans === 'up' || c.ans === 'down'));
      const v = good ? 'ok' : near ? 'part' : 'no';
      const x = wrap.querySelector('.ls-x');
      x.innerHTML = `<div class="lq-x"><b class="vd ${v}">${good ? 'Coincide con la lectura del caso.' : near ? 'Has visto una parte.' : 'No coincide con la lectura del caso.'}</b>
        ${marks.length ? `<p class="mut">Tus marcas: ${hitM.map((h, k) => `${k + 1} ${h ? '✓ cerca de una zona candidata' : '· sin zona candidata cerca'}`).join(' · ')}</p>` : ''}
        <h6>¿Por qué?</h6>${c.zones.length ? c.zones.map(z => `<p>${z.why}</p>`).join('') : `<p>${c.none}</p>`}
        ${c.warn ? `<p class="mut">${c.warn}</p>` : ''}</div>`;
      if (c.cont) contStage(x);
      nav();
    };
    /* nivel 4: el caso sigue — liquidez → barrido → reacción → desplazamiento → expansión */
    function contStage(x) {
      const opts = ['Construyendo liquidez', 'Sweep potencial', 'Ruptura con aceptación', 'Reacción', 'Desplazamiento', 'Expansión', 'Todavía no se sabe'];
      const checks = new Map(c.cont.map(k => [k.at, k]));
      ch.spec.gate = u => { const k = checks.get(u); if (k && !k.done) { pending = k; showQ(k); return true; } return false; };
      ch.spec.gateAt = u => checks.has(u) && !checks.get(u).done;
      ch.node.classList.remove('noplay');
      const box = el(`<div class="ls-cont"><p><b>Ahora observa qué hace el precio cuando llegue.</b> Usa ▶ para avanzar vela a vela; se parará cuando haya algo que clasificar.</p><div class="lq-host"></div><ol class="story"></ol></div>`);
      x.appendChild(box);
      function showQ(k) {
        const h = box.querySelector('.lq-host'); h.innerHTML = '';
        h.appendChild(ask({
          q: `Vela ${k.at}: ¿qué está ocurriendo?`, opts: opts.map(t => ({ t, v: k.ok.includes(t) ? 'ok' : (k.part || []).includes(t) ? 'part' : 'no' })), why: k.why,
          onAnswer(o) { k.done = true; pending = null; box.querySelector('.story').appendChild(el(`<li class="${o.v}"><b>${o.t}</b> <span>vela ${k.at}</span></li>`)); }
        }));
      }
    }
    function nav() {
      const n = wrap.querySelector('.ls-nav'); n.innerHTML = '';
      if (ix < list.length - 1) { const b = el('<button class="btn">Siguiente caso →</button>'); b.onclick = () => { ix++; draw(); }; n.appendChild(b); }
      else n.appendChild(el(`<p class="mut">Nivel terminado. Prueba el siguiente nivel: cada vez hay menos ayudas.</p>`));
      LAB.prog.mark('liq_' + lv + '_' + ix);
    }
    body.appendChild(wrap);
  }
  list = cases.filter(c => c.lv === 1);
  draw();
  return host;
}

/* ============================================================
   POI — dibujar la zona donde empezó el movimiento fuerte,
   reproducir y observar la REACCIÓN (no el toque).
   cfg: { cd, show, poi:{i,p1,p2}, checks:[{at, ok, part, why}], tf }
   ============================================================ */
function poiLab(cfg) {
  const wrap = el(`<div class="lab">
    <div class="lab-main"></div>
    <aside class="lab-side">
      <div class="ls-h">¿Dónde comenzó el movimiento fuerte?</div>
      <p class="ls-p">Arrastra sobre el gráfico para dibujar tu zona (de un borde a otro, como un rectángulo). Puedes redibujarla.</p>
      <div class="ls-bar"><button class="btn" data-a="play" disabled>▶ Reproducir</button></div>
      <div class="ls-x"></div><ol class="story"></ol>
    </aside></div>`);
  const cd = cfg.cd, checks = new Map(cfg.checks.map(k => [k.at, k]));
  let zone = null, pending = null, started = false;
  const ch = lchart(cd, {
    title: 'XAUUSD', tf: cfg.tf || 'M5', h: 360, play: true, playFrom: cfg.show, causal: true, minUpto: cfg.show,
    lockFwd: () => !started || pending != null,
    gate: u => { const k = checks.get(u); if (k && !k.done) { pending = k; showQ(k); return true; } return false; },
    gateAt: u => checks.has(u) && !checks.get(u).done
  });
  wrap.querySelector('.lab-main').appendChild(ch.node);
  const zOv = z => z ? [{ k: 'zone', p1: z.p1, p2: z.p2, from: z.i1, color: C.gold, fo: .14, label: 'tu POI', L: 'user' }] : [];
  const drag = onChartDrag(ch, {
    move: z => { if (!started) ch.setOv(zOv(z)); },
    done: z => { if (started) return; if (z.p2 - z.p1 <= 0.01) return; zone = z; ch.setOv(zOv(z)); wrap.querySelector('[data-a="play"]').disabled = false; }
  });
  wrap.querySelector('[data-a="play"]').onclick = () => {
    if (!zone) return; started = true; drag.off();
    wrap.querySelector('[data-a="play"]').replaceWith(el('<p class="mut">Usa ▶ bajo el gráfico. El replay se parará cuando haya algo que observar.</p>'));
    ch.node.querySelector('[data-p="t"]').click();
  };
  const opts = ['No reacciona', 'Reacción débil', 'Sweep + recuperación', 'Desplazamiento', 'Cambio estructural', 'Todavía no sabemos'];
  function showQ(k) {
    const x = wrap.querySelector('.ls-x'); x.innerHTML = '';
    x.appendChild(ask({
      q: k.q || `El precio ha vuelto a la zona. ¿Qué está ocurriendo?`, opts: opts.map(t => ({ t, v: k.ok.includes(t) ? 'ok' : (k.part || []).includes(t) ? 'part' : 'no' })), why: k.why,
      onAnswer(o) {
        k.done = true; pending = null;
        wrap.querySelector('.story').appendChild(el(`<li class="${o.v}"><b>${o.t}</b> <span>vela ${k.at}</span></li>`));
        if (k.last) finish();
      }
    }));
  }
  function finish() {
    const r = cfg.poi, ov = Math.max(0, Math.min(r.p2, zone.p2) - Math.max(r.p1, zone.p1)), un = Math.max(r.p2, zone.p2) - Math.min(r.p1, zone.p1);
    const iou = un ? ov / un : 0, near = Math.abs(zone.i1 - r.i) <= 6 || (zone.i1 <= r.i && zone.i2 >= r.i);
    ch.setOv(zOv(zone).concat([{ k: 'zone', p1: r.p1, p2: r.p2, from: r.i, color: C.liq, fo: .12, label: 'POI de referencia', L: 'poi', force: true }]));
    wrap.querySelector('.ls-x').appendChild(el(`<div class="lq-x"><b class="vd ${iou > .3 && near ? 'ok' : near ? 'part' : 'no'}">${iou > .3 && near ? 'Tu zona coincide con el origen del movimiento.' : near ? 'Estabas en el sitio, con otra altura.' : 'Tu zona está en otro sitio.'}</b>
      <p>${cfg.poiWhy}</p><p class="mut">POI = zona donde prestar atención. <b>POI ≠ entrada.</b> Lo que decide es la reacción, no el toque.</p></div>`));
  }
  return wrap;
}

/* ============================================================
   BIFURCACIÓN — varias series IDÉNTICAS hasta un punto.
   Demuestra que el evento (sweep, toque de POI) no decide el futuro.
   cfg: { prefix, branches:[{t, cd, d, c}], q, opts, fork }
   ============================================================ */
function forkLab(cfg) {
  const wrap = el(`<div class="fork"></div>`);
  const pre = lchart(cfg.branches[0].cd, { title: 'XAUUSD', tf: cfg.tf || 'M5', h: 320, play: true, playFrom: cfg.fork, causal: true, lockFwd: () => true, ov: cfg.ovPre || [] });
  pre.node.classList.add('noplay');
  wrap.appendChild(pre.node);
  const tabs = el(`<div class="scen fork-tabs" hidden><div class="scen-tabs">${cfg.branches.map((b, i) => `<button data-i="${i}" class="${i ? '' : 'on'}"><b>${String.fromCharCode(65 + i)}</b>${esc(b.t)}</button>`).join('')}</div><div class="scen-body"></div></div>`);
  wrap.appendChild(ask({
    q: cfg.q, opts: cfg.opts, why: cfg.why,
    onAnswer() { tabs.hidden = false; show(0); pre.node.remove(); }
  }));
  wrap.appendChild(tabs);
  const charts = [];
  function show(i) {
    tabs.querySelectorAll('.scen-tabs button').forEach((b, k) => b.classList.toggle('on', k === i));
    const body = tabs.querySelector('.scen-body'); body.innerHTML = '';
    if (!charts[i]) charts[i] = lchart(cfg.branches[i].cd, { title: 'Escenario ' + String.fromCharCode(65 + i), tf: cfg.tf || 'M5', h: 300, play: true, playFrom: cfg.fork, causal: true, minUpto: cfg.fork, ov: cfg.branches[i].ov || [] });
    body.appendChild(charts[i].node);
    body.appendChild(el(`<div class="scen-txt ${cfg.branches[i].c || ''}"><span class="lv">idéntico hasta la vela ${cfg.fork}</span><p>${cfg.branches[i].d}</p></div>`));
    charts[i].render('all');
  }
  tabs.querySelectorAll('.scen-tabs button').forEach(b => b.onclick = () => show(+b.dataset.i));
  return wrap;
}

/* ============================================================
   CLASIFICADOR DE FASES — replay vela a vela.
   El alumno clasifica en continuo; en los puntos de control el
   replay se detiene y no avanza hasta que responde.
   cfg: { cd, from, labels, checks:[{at, ok, part, why}], q, story, panes, ov, model }
   ============================================================ */
function phaseReplay(cfg) {
  const labels = cfg.labels || ['Balance', 'Expansión', 'Retroceso', 'Transición', 'Información insuficiente'];
  const wrap = el(`<div class="lab">
    <div class="lab-main"></div>
    <aside class="lab-side">
      <div class="ls-h">${cfg.q || '¿Qué está haciendo el precio ahora?'}</div>
      <p class="ls-p">${cfg.p || 'Avanza con ▶ y clasifica cuando quieras. En algunas velas el replay se para: responde para seguir.'}</p>
      <div class="ls-tools ls-lab">${labels.map(t => `<button data-t="${esc(t)}">${t}</button>`).join('')}</div>
      <div class="ls-x"></div>
      ${cfg.story ? `<h6 class="ls-sh">${cfg.storyT || 'Tu historia del precio'}</h6><ol class="story"></ol>` : ''}
      <div class="ls-tl"></div>
    </aside></div>`);
  const checks = new Map(cfg.checks.map(k => [k.at, k]));
  let pending = null, curLab = null; const user = {};
  const ch = lchart(cfg.cd, {
    title: cfg.title || 'XAUUSD', tf: cfg.tf || 'M5', h: cfg.h || 350, play: true, playFrom: cfg.from, causal: true, ov: cfg.ov || [], panes: cfg.panes,
    lockFwd: () => pending != null,
    gate: u => { const k = checks.get(u); if (k && !k.done) { pending = k; showQ(k); return true; } return false; },
    gateAt: u => checks.has(u) && !checks.get(u).done,
    onUpto: u => { if (curLab) user[u - 1] = curLab; paintTL(u); }
  });
  wrap.querySelector('.lab-main').appendChild(ch.node);
  wrap.querySelectorAll('.ls-lab button').forEach(b => b.onclick = () => {
    curLab = b.dataset.t; const u = ch.cur(); user[u - 1] = curLab;
    wrap.querySelectorAll('.ls-lab button').forEach(x => x.classList.toggle('on', x === b));
    if (pending) answer(pending, curLab);
    paintTL(u);
  });
  function showQ(k) {
    const x = wrap.querySelector('.ls-x');
    x.innerHTML = `<div class="lq-x warnq"><b>Vela ${k.at} · ${k.q || (cfg.story ? '¿Qué cambió?' : 'Clasifica este momento')}</b><p class="mut">Pulsa una de las opciones de arriba.</p></div>`;
  }
  function answer(k, t) {
    const v = k.ok.includes(t) ? 'ok' : (k.part || []).includes(t) ? 'part' : 'no';
    k.done = true; pending = null;
    wrap.querySelector('.ls-x').innerHTML = `<div class="lq-x"><b class="vd ${v}">${VERD[v]}</b> ${k.why}</div>`;
    if (cfg.story) wrap.querySelector('.story').appendChild(el(`<li class="${v}"><b>${k.phase ? k.phase + ': ' : ''}${t}</b> <span>vela ${k.at}${v !== 'ok' ? ' · referencia: ' + k.ok[0] : ''}</span></li>`));
    if (cfg.onAnswer) cfg.onAnswer(k, t, v);
  }
  /* línea temporal: tu clasificación frente a la medida causal del precio */
  const MC = { 'balance': C.info, 'expansión': C.gold, 'transición': C.mut, 'info': '#2A3240' };
  function paintTL(u) {
    if (!cfg.model) return;
    const a = cfg.from, n = cfg.cd.length;
    let s1 = '', s2 = '';
    for (let i = a - 1; i < n; i++) {
      const w = 100 / (n - a + 1), xx = ((i - a + 1) * w).toFixed(2);
      if (i < u) {
        const m = LAB.phaseAt(cfg.cd, i).k, us = user[i] || null;
        s1 += `<rect x="${xx}%" y="0" width="${w.toFixed(2)}%" height="8" fill="${us ? (/Balance/.test(us) ? C.info : /Expansi/.test(us) ? C.gold : /Retroceso/.test(us) ? C.bear : C.mut) : '#161B24'}"/>`;
        s2 += `<rect x="${xx}%" y="12" width="${w.toFixed(2)}%" height="8" fill="${MC[m] || C.mut}"/>`;
      }
    }
    wrap.querySelector('.ls-tl').innerHTML = `<div class="tlh"><span>tú</span><span>medida (ATR, eficiencia)</span></div><svg width="100%" height="20" preserveAspectRatio="none">${s1}${s2}</svg>
      <div class="tlk"><i style="background:${C.info}"></i>balance <i style="background:${C.gold}"></i>expansión <i style="background:${C.mut}"></i>transición</div>`;
  }
  paintTL(cfg.from);
  return wrap;
}

/* ============================================================
   CICLO DEL PRECIO — reproducir, pausar, retroceder, ocultar
   etiquetas y preguntar «¿dónde estamos ahora?»
   cfg: { cd, from, ov (con at y g:'lab'), truth:[{a,b,ok,part,why}] }
   ============================================================ */
function cycleViz(cfg) {
  const OPTS = ['Balance', 'Construyendo liquidez', 'Sweep potencial', 'Reacción', 'Desplazamiento', 'Expansión', 'Nuevo balance', 'No está claro'];
  const wrap = el(`<div class="cycviz"></div>`);
  const ch = lchart(cfg.cd, { title: cfg.title || 'El ciclo del precio', tf: cfg.tf || 'M15', h: 360, play: true, playFrom: cfg.from, causal: true, ov: cfg.ov, groups: [{ id: 'lab', label: 'Etiquetas' }], panes: cfg.panes });
  wrap.appendChild(ch.node);
  const bar = el(`<div class="cyc-bar"><button class="btn" data-a="q">¿Dónde estamos ahora?</button><span class="mut">Pausa en cualquier momento y pregunta. Puedes ocultar las etiquetas para leer solo el precio.</span></div>`);
  const out = el('<div></div>');
  wrap.appendChild(bar); wrap.appendChild(out);
  bar.querySelector('[data-a="q"]').onclick = () => {
    ch.stop();
    const u = ch.cur(), t = cfg.truth.find(x => u >= x.a && u <= x.b) || { ok: ['No está claro'], part: [], why: 'En este tramo no hay una fase clara.' };
    out.innerHTML = '';
    out.appendChild(ask({ q: `Vela ${u}: ¿dónde estamos ahora?`, opts: OPTS.map(o => ({ t: o, v: t.ok.includes(o) ? 'ok' : (t.part || []).includes(o) ? 'part' : 'no' })), why: t.why }));
