/* ============================================================
   ALEJAR GRÁFICO — M1 → M5 → M15 → H1 del MISMO mercado.
   levels: [{tf, cd, ov, d}] (series agregadas de una sola base)
   ============================================================ */
function zoomOut(levels, o = {}) {
  const wrap = el(`<div class="zoom">
    <div class="zoom-tabs">${levels.map((l, i) => `<button data-i="${i}" class="${i ? '' : 'on'}">${l.tf}</button>`).join('')}</div>
    <div class="zoom-body"></div>
    <div class="zoom-bar"><button data-a="in" class="sec">◂ ${o.inT || 'Acercar'}</button><button data-a="out">${o.outT || 'Alejar gráfico'} ▸</button><button data-a="g4" class="sec g4b">Ver los ${levels.length} marcos a la vez</button></div></div>`);
  const body = wrap.querySelector('.zoom-body'); let cur = 0;
  const nodes = levels.map(l => lchart(l.cd, { title: 'XAUUSD', tf: l.tf + (l.role ? ' · ' + l.role : ''), ov: l.ov || [], h: 320 }).node);
  const show = i => {
    cur = i; body.innerHTML = ''; body.appendChild(nodes[i]);
    body.appendChild(el(`<div class="zoom-txt"><span class="lv">${levels[i].tf}</span><p>${levels[i].d}</p></div>`));
    wrap.querySelectorAll('.zoom-tabs button').forEach((b, k) => b.classList.toggle('on', k === i));
    wrap.querySelector('[data-a="out"]').disabled = i >= levels.length - 1;
    wrap.querySelector('[data-a="in"]').disabled = i === 0;
    REG.forEach(r => { if (r.box.isConnected) r.render(false); });
    if (o.onShow) o.onShow(i);
  };
  wrap.querySelectorAll('.zoom-tabs button').forEach(b => b.onclick = () => show(+b.dataset.i));
  /* pantallas grandes: los marcos lado a lado (2×2, o en fila si hay sitio) */
  wrap.querySelector('[data-a="g4"]').onclick = e => {
    const on = !wrap.classList.contains('grid4'); wrap.classList.toggle('grid4', on);
    e.target.textContent = on ? 'Volver a un marco' : `Ver los ${levels.length} marcos a la vez`;
    if (!on) { show(cur); return; }
    body.innerHTML = '';
    levels.forEach(l => body.appendChild(lchart(l.cd, { title: l.tf, tf: l.role || '', ov: l.ov || [], h: 250, padR: 46 }).node));
    REG.forEach(r => { if (r.box.isConnected) r.render('all'); });
  };
  wrap.querySelector('[data-a="out"]').onclick = () => show(Math.min(levels.length - 1, cur + 1));
  wrap.querySelector('[data-a="in"]').onclick = () => show(Math.max(0, cur - 1));
  show(0);
  return wrap;
}

/* ============================================================
   «¿DÓNDE CAMBIÓ EL COMPORTAMIENTO?» — clic, y después medir.
   Precio primero; indicadores después.
   cfg: { cd, truth, tol, panes(cd), why, tf }
   ============================================================ */
function clickChange(cfg) {

    <div class="ls-h">${cfg.q || '¿Dónde cambió el comportamiento del precio?'}</div>
    <p class="ls-p">Mira solo las velas. Haz clic sobre la vela donde crees que el precio pasó de lento a rápido.</p>

  wrap.querySelector('.lab-main').appendChild(ch.node);
  const ck = onChartClick(ch, pt => {
    ck.off();
    const d = pt.i - cfg.truth, v = Math.abs(d) <= (cfg.tol || 3) ? 'ok' : Math.abs(d) <= (cfg.tol || 3) * 2.5 ? 'part' : 'no';
    ch.setOv([
      { k: 'mark', i: pt.i, side: 'L', color: C.gold, text: 'tu clic', L: 'user' },
      { k: 'vzone', from: cfg.truth, to: Math.min(cfg.cd.length - 1, cfg.truth + (cfg.len || 8)), color: C.gold, fo: .09, label: 'desplazamiento', L: 'dsp', force: true },
      { k: 'vzone', from: Math.max(0, cfg.truth - (cfg.balLen || 30)), to: cfg.truth - 1, color: C.info, fo: .06, label: 'balance', L: 'bal', force: true }
    ]);
    ch.spec.panes = cfg.panes(cfg.cd); ch.render(false);
    wrap.querySelector('.ls-x').innerHTML = `<div class="lq-x"><b class="vd ${v}">${v === 'ok' ? 'Lo has visto.' : v === 'part' ? 'Cerca.' : 'El cambio estaba en otro sitio.'}</b> ${d ? `(${d > 0 ? d + ' velas tarde' : -d + ' velas antes'})` : ''}<p>${cfg.why}</p>
      <p class="key"><b>El precio muestra el fenómeno. Los indicadores ayudan a medirlo.</b></p></div>`;
  });

/* ============================================================
   ORDENA LAS EVIDENCIAS — sin ranking universal.
   Se evalúa por niveles (estructural / reacción / derivado),
   y la explicación depende del escenario.
   cfg: { title, ctx, cd?, items:[{t, tier, why}], why }
   ============================================================ */
function evidenceSorter(cfg) {
  const TIER = { 1: 'contexto estructural', 2: 'comportamiento / reacción', 3: 'derivado o de detalle' };
  const wrap = el(`<div class="esort">
    <div class="es-ctx">${cfg.ctx}</div>
    <div class="es-chart"></div>
    <p class="ls-p">Ordena de <b>más</b> a <b>menos</b> peso contextual <i>para este escenario</i>. Arrastra, o usa ▲▼.</p>
    <ol class="es-list"></ol>
    <div class="ls-bar"><button class="btn" data-a="go">Comparar</button></div>
    <div class="ls-x"></div></div>`);
  if (cfg.cd) wrap.querySelector('.es-chart').appendChild(lchart(cfg.cd, { title: 'XAUUSD', tf: cfg.tf || 'M5', h: 250, ov: cfg.ov || [] }).node);
  const r = LAB.prng(cfg.seed || 7);
  let order = cfg.items.map((_, i) => i).sort(() => r() - .5);
  const list = wrap.querySelector('.es-list');
  let drag = null;
  function paint() {
    list.innerHTML = order.map((k, pos) => `<li draggable="true" data-k="${k}"><span class="h">⋮⋮</span><span class="t">${cfg.items[k].t}</span><span class="b"><button data-m="-1" ${pos ? '' : 'disabled'}>▲</button><button data-m="1" ${pos < order.length - 1 ? '' : 'disabled'}>▼</button></span></li>`).join('');
    list.querySelectorAll('li').forEach(li => {
      li.addEventListener('dragstart', () => { drag = +li.dataset.k; li.classList.add('drag'); });
      li.addEventListener('dragover', e => e.preventDefault());
      li.addEventListener('drop', e => { e.preventDefault(); const to = order.indexOf(+li.dataset.k); order = order.filter(x => x !== drag); order.splice(to, 0, drag); paint(); });
      li.querySelectorAll('button').forEach(b => b.onclick = () => {
        const k = +li.dataset.k, p = order.indexOf(k), q = p + +b.dataset.m;
        [order[p], order[q]] = [order[q], order[p]]; paint();
      });
    });
  }
  paint();
  wrap.querySelector('[data-a="go"]').onclick = () => {
    const inv = [];
    order.forEach((a, i) => order.slice(i + 1).forEach(b => { if (cfg.items[a].tier > cfg.items[b].tier) inv.push([a, b]); }));
    const v = !inv.length ? 'ok' : inv.length <= 3 ? 'part' : 'no';
    list.querySelectorAll('li').forEach(li => { const it = cfg.items[+li.dataset.k]; li.classList.add('t' + it.tier); li.querySelector('.t').insertAdjacentHTML('beforeend', `<span class="why"><i>${TIER[it.tier]}</i> — ${it.why}</span>`); });
    wrap.querySelector('.ls-x').innerHTML = `<div class="lq-x"><b class="vd ${v}">${!inv.length ? 'Tu orden respeta la jerarquía de este escenario.' : inv.length + ' pares colocados al revés respecto a esta lectura.'}</b>
      ${inv.slice(0, 3).map(([a, b]) => `<p class="mut">«${cfg.items[b].t}» aporta más aquí que «${cfg.items[a].t}».</p>`).join('')}
      <p>${cfg.why}</p><p class="mut">No hay un orden universal: dentro de cada nivel, el orden es discutible. Lo que no es discutible es poner varios derivados del mismo movimiento por encima de la estructura y la reacción.</p></div>`;
  };
  return wrap;
}

/* ============================================================
   RECONSTRUIR LA HISTORIA — el alumno marca cada pieza
   sobre 80–150 velas; luego «Ver historia» la reproduce en orden.
   cfg: { cd, items:[{t, mode:'i'|'p'|'choice', truth, tol, opts, why}], story:[{upto,t,d}], ov }
   ============================================================ */
function storyRebuild(cfg) {
  const wrap = el(`<div class="lab story-lab"><div class="lab-main"></div><aside class="lab-side">
    <div class="ls-h">Reconstruye la historia</div>
    <p class="ls-p">Selecciona una pieza y márcala en el gráfico (clic en la vela o a la altura del nivel). Las que son preguntas se responden con botones.</p>
    <ol class="sr-list"></ol>
    <div class="ls-bar"><button class="btn" data-a="chk">Comprobar</button><button class="btn plain" data-a="play" disabled>Ver historia ▶</button></div>
    <div class="ls-x"></div></aside></div>`);
  const cd = cfg.cd, ans = {}; let cur = 0, checked = false;
  const ch = lchart(cd, { title: 'XAUUSD', tf: cfg.tf || 'M15', h: 380, ov: [] });
  wrap.querySelector('.lab-main').appendChild(ch.node);
  const L = wrap.querySelector('.sr-list');
  function paintList() {
    L.innerHTML = cfg.items.map((it, k) => `<li class="${k === cur ? 'on' : ''} ${ans[k] != null ? 'done' : ''} ${it.res || ''}" data-k="${k}"><span class="n">${k + 1}</span><span class="t">${it.t}${it.mode === 'choice' && k === cur && !checked ? `<span class="ch">${it.opts.map((o, j) => `<button data-j="${j}" class="${ans[k] === j ? 'on' : ''}">${o}</button>`).join('')}</span>` : ''}${it.res ? `<span class="why">${it.why}</span>` : ''}</span></li>`).join('');
    L.querySelectorAll('li').forEach(li => li.addEventListener('click', e => {
      const b = e.target.closest('button[data-j]');
      if (b && !checked) { ans[cur] = +b.dataset.j; paintList(); return; }
      cur = +li.dataset.k; paintList();
    }));
  }
  function paintMarks(extra = []) {
    ch.setOv(cfg.items.flatMap((it, k) => {
      const a = ans[k]; if (a == null || it.mode === 'choice') return [];
      return it.mode === 'i' ? [{ k: 'mark', i: a.i, side: 'L', color: C.gold, text: String(k + 1), L: 'user', fs: 9 }] : [{ k: 'level', p: a.p, color: C.gold, dash: '2 3', label: String(k + 1), lab: 'in', L: 'user' }];
    }).concat(extra));
  }
  onChartClick(ch, pt => {
    if (checked) return;
    const it = cfg.items[cur]; if (it.mode === 'choice') return;
    ans[cur] = pt; paintMarks();
    const nx = cfg.items.findIndex((x, k) => k > cur && ans[k] == null); if (nx >= 0) cur = nx; paintList();
  });
  wrap.querySelector('[data-a="chk"]').onclick = () => {
    checked = true; let ok = 0;
    cfg.items.forEach((it, k) => {
      const a = ans[k]; let good = false;
      if (a != null) {
        if (it.mode === 'choice') good = it.truth.includes(a);
        else if (it.mode === 'i') good = Array.isArray(it.truth) ? a.i >= it.truth[0] - (it.tol || 2) && a.i <= it.truth[1] + (it.tol || 2) : Math.abs(a.i - it.truth) <= (it.tol || 3);
        else good = Math.abs(a.p - it.truth) <= (it.tol || 4);
      }
      it.res = a == null ? 'miss' : good ? 'ok' : 'no'; if (good) ok++;
    });
    paintList(); paintMarks((cfg.ov || []).map(o => ({ ...o, force: true })));
    wrap.querySelector('.ls-x').innerHTML = `<div class="lq-x"><b class="vd ${ok >= cfg.items.length * .7 ? 'ok' : ok >= cfg.items.length * .4 ? 'part' : 'no'}">${ok} de ${cfg.items.length} piezas coinciden con la lectura de referencia.</b><p class="mut">Algunas piezas admiten más de una lectura: si tu marca está cerca y sabes justificarla, cuenta.</p></div>`;
    wrap.querySelector('[data-a="play"]').disabled = false;
    if (cfg.onCheck) cfg.onCheck(ok);
  };
  wrap.querySelector('[data-a="play"]').onclick = () => {
    const host = el('<div class="story-play"></div>');
    host.appendChild(mkChart({ sim: true, candles: cd, h: 360, title: 'La historia, en orden', tf: cfg.tf || 'M15', ov: cfg.storyOv, steps: cfg.story, naked: false, causal: false }).node);
    wrap.after(host); host.scrollIntoView({ behavior: 'smooth', block: 'start' });
    wrap.querySelector('[data-a="play"]').disabled = true;
  };
  paintList();
  return wrap;
}

/* ============================================================
   DE ANALIZAR A OPERAR — planificar, ejecutar, gestionar, revisar
   Componentes: TradePlanner, TradeReplay + DecisionPause,
   ProcessReview / BiasReview, diario, sobreoperación, sesión.
   ============================================================ */

/* simulación sin interfaz (operaciones guionizadas y tests) */
LAB.simulate = function (cd, start, plan, script = [], ctx = {}) {
  const tr = LAB.tradeOpen(plan, start - 1);
  tr.last = cd[start - 1].c;
  let end = null;
  for (let j = start; j < cd.length && tr.open; j++) {
    end = LAB.tradeBar(tr, cd[j], j) || end;
    if (!tr.open) { tr.endIdx = j; break; }
    script.filter(s => s.i === j).forEach(s => LAB.tradeAct(tr, s.act, { ...s.o, idx: j }));
    if (!tr.open) { tr.endIdx = j; break; }
  }
  if (tr.open) { tr.endIdx = cd.length - 1; LAB.tradeAct(tr, 'close', { idx: cd.length - 1, why: 'fin' }); }
  return { tr, rv: LAB.review(tr, ctx), R: LAB.realized(tr) };
};
/* entrada del diario a partir de una operación */
function journalEntry(o) {
  const tr = o.tr;
  return {
    sim: o.sim, title: o.title, ts: Date.now(), ctx: o.ctx || 'plan', variant: o.variant,
    noTrade: !!o.noTrade, decision: o.decision || null,
    plan: tr ? JSON.parse(JSON.stringify(tr.orig)) : null, cur: tr ? JSON.parse(JSON.stringify(tr.cur)) : null,
    log: tr ? tr.log.map(d => ({ ...d })) : [], result: tr ? +LAB.realized(tr).toFixed(2) : 0,
    maxR: tr ? +tr.maxR.toFixed(2) : 0, minR: tr ? +tr.minR.toFixed(2) : 0,
    process: o.rv || null, diff: tr ? LAB.planDiff(tr) : [], extra: o.extra || null
  };
}
const TIPO = { scalp: 'Scalping', intra: 'Intradía', swing: 'Swing' };
const MGMT = { fijo: 'Stop y objetivo fijos, sin tocar', parcial1R: 'Parcial 50 % en +1R y stop a entrada', be1R: 'Stop a entrada en +1R', trail: 'Seguir el stop bajo/sobre la estructura' };
const MOT = { plan: 'según el plan', mercado: 'cambio en el mercado', miedo: 'miedo', esperanza: 'esperanza', recuperar: 'recuperar', otro: 'otro' };
function logLine(d) {
  const a = LAB.ACTN[d.act] || d.act, f = LAB.fmt;
  const det = d.act === 'sl_away' || d.act === 'sl_tighten' ? ` ${f(d.from)} → ${f(d.to)}` : d.act === 'sl_be' ? ` ${f(d.from)} → ${f(d.to)}` : d.act === 'tp_move' ? ` ${f(d.from)} → ${f(d.to)}` : d.act === 'tp_remove' ? ` (era ${f(d.from)})` : d.act === 'tf' ? ` ${TIPO[d.from] || d.from} → ${TIPO[d.to] || d.to}` : d.act === 'close' || d.act === 'partial' ? ` (${LAB.sgn(d.res || 0)}R)` : '';
  return `<li class="a-${d.act}"><span class="w">${d.idx != null ? 'vela ' + (d.idx + 1) : ''} · ${LAB.sgn(d.r)}R</span><b>${a}</b>${det}<span class="m">motivo: ${MOT[d.why] || d.why}${d.note ? ' — ' + esc(d.note) : ''}</span></li>`;
}
/* ---------- ProcessReview + BiasReview ---------- */
function reviewCard(e) {
  if (e.noTrade) {
    return el(`<div class="rev"><div class="rev-top">
      <div class="rv res"><span>Resultado del mercado</span><b>0R</b><i>no hubo operación</i></div>
      <div class="rv proc ${e.process && e.process.verdict === 'CONSISTENTE' ? 'ok' : 'part'}"><span>Calidad de la decisión</span><b>${e.process ? e.process.verdict : 'NO TRADE'}</b><i>${e.decision || ''}</i></div></div>
      <div class="note key">${(e.process && e.process.notes[0]) || 'No operar también es una decisión. Se evalúa igual que una entrada: ¿era coherente con la información disponible?'}</div></div>`);
  }
  const p = e.plan, c = e.cur, R = e.result, sc = e.process.score;
  const quad = R >= 0 && sc >= 80 ? 'Buen proceso y buen resultado. El segundo no estaba garantizado por el primero.'
    : R >= 0 ? '<b>Una operación ganadora puede estar mal ejecutada.</b> Este resultado no valida las decisiones marcadas abajo.'
      : sc >= 80 ? '<b>Una operación perdedora puede estar bien ejecutada.</b> Respetaste hipótesis, riesgo e invalidación. El mercado hizo otra cosa.'
        : 'Resultado negativo y proceso con desviaciones: revisa primero el proceso, no el resultado.';
  const vcls = e.process.verdict === 'CONSISTENTE' ? 'ok' : e.process.verdict === 'INCONSISTENTE' ? 'no' : 'part';
  const n = el(`<div class="rev">
    <div class="rev-top">
      <div class="rv res ${R >= 0 ? 'up' : 'dn'}"><span>Resultado del mercado</span><b>${LAB.sgn(R)}R</b><i>máx. a favor ${LAB.sgn(e.maxR)}R · máx. en contra ${LAB.sgn(e.minR)}R</i></div>
      <div class="rv proc ${vcls}"><span>Calidad del proceso</span><b>${e.process.verdict}</b><i>Plan respetado: ${sc} %</i></div>
    </div>
    <div class="note key" style="margin:12px 0">${quad}</div>
    ${e.diff && e.diff.length ? `<div class="pdiff"><h5>La operación cambió</h5><table><tr><th></th><th>Plan original</th><th>Plan final</th></tr>${e.diff.map(d => `<tr><td>${d.k === 'tipo' ? 'horizonte' : d.k === 'sl' ? 'stop' : d.k === 'tp' ? 'objetivo' : d.k}</td><td>${d.k === 'tipo' ? TIPO[d.a] : d.a == null ? 'sin objetivo' : typeof d.a === 'number' ? LAB.fmt(d.a) : d.a}</td><td class="chg">${d.k === 'tipo' ? TIPO[d.b] : d.b == null ? 'sin objetivo' : typeof d.b === 'number' ? LAB.fmt(d.b) : d.b}</td></tr>`).join('')}</table></div>` : ''}
    <div class="rev-cols">
      <div><h5>Antes</h5><dl>
        <dt>Hipótesis</dt><dd>${esc(p.hip)} <span class="tag ${p.dir === 'long' ? 'b' : 's'}">${p.dir === 'long' ? 'alcista' : 'bajista'}</span></dd>
        <dt>Contexto / evidencia</dt><dd>${(p.evid || []).map(esc).join(' · ')}</dd>
        <dt>Horizonte</dt><dd>${TIPO[p.tipo]}</dd>
        <dt>Invalidación</dt><dd>${esc(p.inval)}</dd>
        <dt>Riesgo</dt><dd>1R = ${LAB.fmt(Math.abs(p.entry - p.sl))} $ por onza · ${p.risk} % de la cuenta</dd>
        <dt>Plan</dt><dd>entrada ${LAB.fmt(p.entry)} · stop ${LAB.fmt(p.sl)} · objetivo ${p.tp == null ? '—' : LAB.fmt(p.tp)}<br>${MGMT[p.mgmt]}</dd>
      </dl></div>
      <div><h5>Durante</h5>${e.log.length ? `<ul class="dlog">${e.log.map(logLine).join('')}</ul>` : '<p class="mut">Ninguna intervención: la operación siguió el plan.</p>'}</div>
      <div><h5>Después</h5><dl>
        <dt>Resultado</dt><dd>${LAB.sgn(R)}R</dd>
        <dt>Proceso</dt><dd>${e.process.verdict}</dd>
        <dt>Plan final</dt><dd>${TIPO[c.tipo]} · stop ${LAB.fmt(c.sl)} · objetivo ${c.tp == null ? 'sin objetivo' : LAB.fmt(c.tp)}</dd>
      </dl>
      ${e.process.flags.length ? `<div class="flags"><span>Este comportamiento coincidió con:</span>${e.process.flags.map(f => `<b>${f}</b>`).join('')}</div>` : '<div class="flags ok"><span>No coincidió con ningún patrón de sesgo registrado.</span></div>'}
      ${e.process.notes.length ? `<ul class="pnotes">${e.process.notes.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}
      </div>
    </div></div>`);
  return n;
}

/* ---------- TradePlanner ----------
   El botón EJECUTAR solo se desbloquea con un plan completo. */
function tradePlanner(cfg) {
  const p = Object.assign({ tipo: '', dir: '', hip: '', evid: [], inval: '', entry: NaN, sl: NaN, tp: NaN, risk: .5, mgmt: '' }, cfg.prefill || {});
  const EV = cfg.evid || ['Estructura del marco superior', 'POI / zona relevante', 'Sweep de liquidez', 'Reacción en la zona', 'Desplazamiento', 'Cambio de estructura M5', 'FVG', 'Sesión', 'Indicador (RSI/EMA/ADX)'];
  const n = el(`<div class="planner">
    <div class="pl-h"><b>Plan antes de entrar</b><span>${cfg.sub || 'Todo esto se guarda como copia inmutable en cuanto ejecutes.'}</span></div>
    <div class="pl-r"><label>Tipo</label><div class="chips" data-f="tipo">${Object.entries(TIPO).map(([k, t]) => `<button data-v="${k}">${t}</button>`).join('')}</div></div>
    <div class="pl-r"><label>Dirección</label><div class="chips" data-f="dir"><button data-v="long">Alcista (compra)</button><button data-v="short">Bajista (venta)</button></div></div>
    <div class="pl-r"><label>Hipótesis</label><textarea data-f="hip" rows="2" placeholder="¿Qué espero que ocurra y por qué ahora?"></textarea></div>
    <div class="pl-r"><label>Evidencia</label><div class="chips multi" data-f="evid">${EV.map(t => `<button data-v="${esc(t)}">${t}</button>`).join('')}</div></div>
    <div class="pl-r"><label>Invalidación</label><textarea data-f="inval" rows="2" placeholder="¿Qué tendría que pasar para que mi lectura deje de tener sentido?"></textarea></div>
    <div class="pl-g">
      <div><label>Entrada</label><input type="number" step="0.1" data-f="entry"></div>
      <div><label>Stop loss</label><input type="number" step="0.1" data-f="sl"></div>
      <div><label>Objetivo</label><input type="number" step="0.1" data-f="tp" placeholder="opcional"></div>
      <div><label>Riesgo (% cuenta)</label><input type="number" step="0.1" min="0.1" data-f="risk"></div>
    </div>
    <div class="pl-r"><label>Clic en el gráfico fija</label><div class="chips" data-f="clk"><button data-v="entry">entrada</button><button data-v="sl" class="on">stop</button><button data-v="tp">objetivo</button></div></div>
    <div class="pl-r"><label>Gestión prevista</label><select data-f="mgmt"><option value="">— elige —</option>${Object.entries(MGMT).map(([k, t]) => `<option value="${k}">${t}</option>`).join('')}</select></div>
    <div class="pl-rr"></div>
    <ul class="pl-err"></ul>
    <div class="pl-bar"><button class="btn lock" data-a="go" disabled>🔒 Ejecutar</button>${cfg.cancel ? '<button class="btn plain" data-a="cancel">No operar</button>' : ''}</div>
  </div>`);
  let clk = 'sl';
  const set = (f, v) => { p[f] = v; sync(); };
  n.querySelectorAll('.chips').forEach(g => g.querySelectorAll('button').forEach(b => b.onclick = () => {
    const f = g.dataset.f, v = b.dataset.v;
    if (f === 'clk') { clk = v; g.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); return; }
    if (g.classList.contains('multi')) { p.evid = p.evid.includes(v) ? p.evid.filter(x => x !== v) : p.evid.concat(v); b.classList.toggle('on'); sync(); return; }
    g.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); set(f, v);
  }));
  n.querySelectorAll('textarea,input,select').forEach(i => i.addEventListener('input', () => { const f = i.dataset.f; set(f, i.type === 'number' ? (i.value === '' ? NaN : +i.value) : i.value); }));
  function fill() {
    n.querySelectorAll('.chips').forEach(g => { const f = g.dataset.f; if (f === 'clk') return; g.querySelectorAll('button').forEach(b => b.classList.toggle('on', g.classList.contains('multi') ? p.evid.includes(b.dataset.v) : p[f] === b.dataset.v)); });
    n.querySelectorAll('textarea,input,select').forEach(i => { const v = p[i.dataset.f]; i.value = typeof v === 'number' ? (isFinite(v) ? +v.toFixed(2) : '') : (v || ''); });
    sync();
  }
  function plan() { return { ...p, tp: isFinite(p.tp) ? p.tp : null, evid: p.evid.slice() }; }
  function sync() {
    const pl = plan(), er = LAB.planErrors(pl);
    n.querySelector('.pl-err').innerHTML = er.map(x => `<li>${x}</li>`).join('');
    const b = n.querySelector('[data-a="go"]');
    b.disabled = er.length > 0; b.innerHTML = er.length ? '🔒 Ejecutar' : '▶ Ejecutar';
    const rr = n.querySelector('.pl-rr');
    if (isFinite(pl.entry) && isFinite(pl.sl)) {
      const r1 = Math.abs(pl.entry - pl.sl);
      rr.innerHTML = `<span>1R = <b>${r1.toFixed(2)} $</b>/oz</span>${pl.tp != null ? `<span>Objetivo = <b>${(Math.abs(pl.tp - pl.entry) / (r1 || 1)).toFixed(1)}R</b></span>` : '<span>sin objetivo fijo</span>'}<span>Riesgo: <b>${pl.risk} %</b> de la cuenta si salta el stop</span>`;
    } else rr.innerHTML = '';
    if (cfg.onChange) cfg.onChange(pl);
  }
  n.querySelector('[data-a="go"]').onclick = () => { const pl = plan(); if (LAB.planErrors(pl).length) return; cfg.onExecute(pl); };
  const cb = n.querySelector('[data-a="cancel"]'); if (cb) cb.onclick = () => cfg.cancel();
  n.setPrice = v => { p[clk] = +v.toFixed(2); fill(); };
  n.plan = plan;
  fill();
  return n;
}

/* ============================================================
   TradeReplay — simulador de operación completo
   cfg: { id, title, tf, cd | variants:[cd], start, ctx, h4, decide:[{t, act, ctx}],
          waitStep, maxWait, noTrade:{ok, why}, pauses:[{r,d,after}], prefill, evid, after }
   ============================================================ */
function tradeSim(cfg) {
  const host = el('<div class="tsim"></div>');
  function boot() {
    host.innerHTML = '';
    const att = LAB.prog.get()['att_' + cfg.id] || 0;
    const vars = cfg.variants || [cfg.cd], vi = att % vars.length, cd = vars[vi];
    const W0 = Math.max(0, cfg.start - (cfg.window || 110));
    const view = cd.slice(W0), S = cfg.start - W0;
    let stage = 'decide', tr = null, entryCtx = 'plan', planner = null, playT = null, pendQ = false, decision = null;
    const fired = new Set();
    const wrap = el(`<div>
      ${cfg.ctx ? `<div class="ts-ctx">${cfg.ctx}</div>` : ''}
      <div class="pipe"></div>
      <div class="lab"><div class="lab-main"></div><aside class="lab-side"><div class="ts-p"></div></aside></div>
      <div class="ts-rev"></div></div>`);
    host.appendChild(wrap);
    const pipe = on => { const w = wrap.querySelector('.pipe'); w.innerHTML = ''; w.appendChild(cycleStrip(on, PIPE, 'pipe-s')); };
    const ch = lchart(view, {
      title: cfg.title || 'XAUUSD', tf: cfg.tf || 'M5', h: 360, play: true, playFrom: S, causal: true, minUpto: 1,
      lockFwd: () => true, ov: [], panes: cfg.panes ? cfg.panes(view) : undefined
    });
    ch.node.classList.add('noplay');
    wrap.querySelector('.lab-main').appendChild(ch.node);
    const P = wrap.querySelector('.ts-p');
    const U = () => ch.cur();
    const lines = () => {
      if (!tr) return [];
      const o = tr.orig, c = tr.cur, x = tr.idx0 - W0;
      const L = [{ k: 'level', p: o.entry, from: x, color: C.gold, lw: 1.2, label: 'entrada', L: 'user' },
      { k: 'level', p: c.sl, from: x, color: C.bear, lw: 1.4, label: 'stop', L: 'user' }];
      if (c.sl !== o.sl) L.push({ k: 'level', p: o.sl, from: x, color: C.bear, dash: '2 4', lw: 1, op: .55, label: 'stop original', L: 'user' });
      if (c.tp != null) L.push({ k: 'level', p: c.tp, from: x, color: C.bull, lw: 1.3, label: 'objetivo', L: 'user' });
      tr.closed.forEach(z => L.push({ k: 'mark', i: z.idx - W0, side: tr.s > 0 ? 'H' : 'L', color: z.r >= 0 ? C.bull : C.bear, text: LAB.sgn(z.r) + 'R', L: 'user', fs: 9 }));
      return L;
    };
    const draw = () => ch.setOv(lines());

    /* ---- 1 · DECIDIR ---- */
    function decide() {
      stage = 'decide'; pipe([0, 1, 2]);
      const D = cfg.decide || [
        { t: 'Alcista', act: 'long' }, { t: 'Bajista', act: 'short' }, { t: 'Esperar', act: 'wait' }, { t: 'No hay escenario', act: 'none' }];
      P.innerHTML = '';
      P.appendChild(principle());
      P.appendChild(el(`<div class="ls-h">${cfg.q || '¿Tenemos realmente un escenario interesante?'}</div>`));
      const g = el(`<div class="ls-tools big">${D.map((d, k) => `<button data-k="${k}">${d.t}</button>`).join('')}</div>`);
      P.appendChild(g);
      if (cfg.waited) P.appendChild(el(`<p class="mut">Has esperado ${cfg.waited} velas.</p>`));
      g.querySelectorAll('button').forEach(b => b.onclick = () => {
        const d = D[+b.dataset.k]; decision = d.t;
        if (d.act === 'wait' || d.act === 'struct') {
          const lim = (cfg.maxWait || 30) + S;
          const to = d.act === 'struct' && cfg.structAt ? cfg.structAt - W0 : Math.min(view.length - 1, U() + (cfg.waitStep || 6));
          if (U() >= lim || to <= U()) { noTrade('Has esperado lo suficiente: si el escenario no aparece, no operar es la respuesta.'); return; }
          ch.upto(to); cfg.waited = (cfg.waited || 0) + (to - U());
          if (d.act === 'struct') { entryCtx = 'plan'; P.innerHTML = ''; P.appendChild(el(`<div class="note key">${cfg.structNote || 'La estructura se ha desarrollado. Ahora sí puedes valorar un plan.'}</div>`)); const b2 = el('<button class="btn">Planificar →</button>'); b2.onclick = () => plan({}); P.appendChild(b2); return; }
          decide(); return;
        }
        if (d.act === 'none') { noTrade(); return; }
        entryCtx = d.ctx || 'plan';
        plan({ dir: d.act, ...(d.prefill || {}) });
      });
    }
    function noTrade(msg) {
      const nt = cfg.noTrade || { ok: true, why: 'No operar es una decisión válida cuando la información no es suficiente.' };
      const rv = { score: nt.ok ? 100 : 70, verdict: nt.ok ? 'CONSISTENTE' : 'PARCIALMENTE CONSISTENTE', flags: [], notes: [msg || nt.why] };
      const e = journalEntry({ sim: cfg.id, title: cfg.title, noTrade: true, decision: decision || 'No operar', rv });
      LAB.journal.add(e);
      finish(e);
    }
    /* ---- 2 · PLANIFICAR ---- */
    function plan(pre) {
      stage = 'plan'; pipe([3]);
      P.innerHTML = '';
      const last = view[U() - 1].c;
      planner = tradePlanner({
        prefill: { entry: last, ...(cfg.prefill || {}), ...pre }, evid: cfg.evid, cancel: () => { decision = 'No operar tras planificar'; noTrade('Empezaste a planificar y decidiste no operar. Planificar sirve también para descubrir que no hay operación.'); },
        onExecute: pl => execute(pl), onChange: pl => {
          const o = [];
          if (isFinite(pl.entry)) o.push({ k: 'level', p: pl.entry, color: C.gold, dash: '3 3', label: 'entrada', L: 'user' });
          if (isFinite(pl.sl)) o.push({ k: 'level', p: pl.sl, color: C.bear, dash: '3 3', label: 'stop', L: 'user' });
          if (pl.tp != null && isFinite(pl.tp)) o.push({ k: 'level', p: pl.tp, color: C.bull, dash: '3 3', label: 'objetivo', L: 'user' });
          ch.setOv(o);
        }
      });
      P.appendChild(planner);
      if (!ch._clk) ch._clk = onChartClick(ch, pt => { if (stage === 'plan' && planner) planner.setPrice(pt.p); });
    }
    /* ---- 3 · EJECUTAR ---- */
    let pend = null;
    function execute(pl) {
      /* entrada a mercado si coincide con el precio actual; si no, orden pendiente
         que solo se ejecuta cuando el precio la alcanza (y se cancela si antes toca el stop) */
      const last = view[U() - 1].c, a = LAB.atr(view.slice(0, U())), tol = (LAB.atrAt(a, U() - 1) || 1) * .05;
      LAB.prog.mark('att_' + cfg.id, att + 1);
      stage = 'run'; pipe([4, 5]);
      if (Math.abs(pl.entry - last) <= tol) { pl.entry = last; open(pl, U() - 1); }
      else { pend = pl; manage(); P.querySelector('.pnow').innerHTML = `<b>Orden pendiente</b> en ${LAB.fmt(pl.entry)}. Avanza: si el precio no llega, no hay operación.`; ch.setOv([{ k: 'level', p: pl.entry, color: C.gold, dash: '5 3', label: 'orden', L: 'user' }, { k: 'level', p: pl.sl, color: C.bear, dash: '5 3', label: 'stop', L: 'user' }]); }
    }
    function open(pl, idx) {
      tr = LAB.tradeOpen(pl, idx + W0); tr.last = pl.entry; pend = null;
      draw(); if (!P.querySelector('.hud')) manage(); hud();
    }
    function pendingBar() {
      const u = U();
      if (u >= view.length) { decision = 'Orden no ejecutada'; noTrade('La orden no llegó a ejecutarse. No hubo operación: el plan se respetó.'); return false; }
      ch.upto(u + 1);
      const k = view[u], long = pend.dir === 'long';
      if ((long && k.l <= pend.sl) || (!long && k.h >= pend.sl)) { decision = 'Orden cancelada'; noTrade('El precio alcanzó tu invalidación antes que tu entrada: la orden se cancela sin pérdida.'); return false; }
      if (k.l <= pend.entry && k.h >= pend.entry) { open(pend, u); prevR = LAB.rAt(tr, k.c); tr.last = k.c; draw(); hud(); }
      return true;
    }
    const PZ = cfg.pauses || [{ r: .4, d: 1 }, { r: .8, d: 1 }, { r: .2, d: -1, after: .8 }, { r: -.6, d: -1 }];
    let prevR = 0;
    function stepBar() {
      if (pend) return pendingBar();
      if (!tr || !tr.open) return false;
      const u = U();
      if (u >= view.length) { LAB.tradeAct(tr, 'close', { idx: u - 1 + W0, why: 'fin' }); end('fin del ejercicio'); return false; }
      ch.upto(u + 1);
      const k = view[u], hit = LAB.tradeBar(tr, k, u + W0);
      draw(); hud();
      if (hit) { end(hit); return false; }
      const r = LAB.rAt(tr, k.c);
      for (let q = 0; q < PZ.length; q++) {
        const z = PZ[q]; if (fired.has(q)) continue;
        if (z.after != null && tr.maxR < z.after) continue;
        if ((z.d > 0 && prevR < z.r && r >= z.r) || (z.d < 0 && prevR > z.r && r <= z.r)) { fired.add(q); prevR = r; pause(r); return false; }
      }
      (cfg.pauseBars || []).forEach(b => { if (b === u + W0 && !fired.has('b' + b)) { fired.add('b' + b); pause(r); } });
      prevR = r;
      return !pendQ;
    }
    function play() { stop(); playT = setInterval(() => { if (!stepBar()) stop(); }, 520); syncBtns(); }
    function stop() { clearInterval(playT); playT = null; syncBtns(); }
    function syncBtns() { const b = P.querySelector('[data-a="play"]'); if (b) b.textContent = playT ? '⏸ Pausa' : '▶ Reproducir'; }
    function hud() {
      const h = P.querySelector('.hud'); if (!h || !tr) return;
      const u = U(), k = view[u - 1], rr = LAB.riskNow(tr);
      h.innerHTML = `<div><span>vela</span><b>${u}</b></div><div><span>precio</span><b>${k.c.toFixed(2)}</b></div>
        <div><span>R abierto</span><b class="${LAB.openR(tr) >= 0 ? 'u' : 'd'}">${LAB.sgn(LAB.openR(tr))}</b></div>
        <div><span>R cerrado</span><b>${LAB.sgn(LAB.realized(tr))}</b></div>
        <div class="${rr > 1.05 ? 'warn' : ''}"><span>riesgo real</span><b>${rr.toFixed(1)}R</b></div>`;
      const d = P.querySelector('.pnow');
      if (d) { const df = LAB.planDiff(tr); d.innerHTML = df.length ? `<b>La operación cambió:</b> ${df.map(x => `${x.k === 'tipo' ? 'horizonte' : x.k === 'sl' ? 'stop' : x.k === 'tp' ? 'objetivo' : x.k} ${x.k === 'tipo' ? TIPO[x.a] : x.a == null ? '—' : typeof x.a === 'number' ? LAB.fmt(x.a) : x.a} → ${x.k === 'tipo' ? TIPO[x.b] : x.b == null ? 'sin objetivo' : typeof x.b === 'number' ? LAB.fmt(x.b) : x.b}`).join(' · ')}` : `Plan original intacto · ${TIPO[tr.orig.tipo]} · stop ${LAB.fmt(tr.orig.sl)} · objetivo ${tr.orig.tp == null ? '—' : LAB.fmt(tr.orig.tp)}`; d.classList.toggle('chg', df.length > 0); }
    }
    /* ---- 4 · GESTIONAR (DecisionPause) ---- */
    let why = 'otro';
    function manage() {
      P.innerHTML = `<div class="hud"></div><div class="pnow"></div>
        <div class="dq" hidden></div>
        <div class="ls-bar"><button class="btn" data-a="play">▶ Reproducir</button><button class="btn plain" data-a="one">Siguiente vela</button></div>
        <h6 class="ls-sh">Intervenir (se registra todo)</h6>
        <div class="acts">
          <button data-x="hold">Mantener</button><button data-x="close">Cerrar</button><button data-x="partial">Parcial 50 %</button>
          <button data-x="sl_be">Stop a entrada</button><button data-x="sl_move">Mover stop…</button><button data-x="tp_remove">Quitar objetivo</button>
          <button data-x="tp_move">Mover objetivo…</button><button data-x="look">Mirar M15 / H1 / H4</button><button data-x="add">Añadir posición</button><button data-x="nothing">No hacer nada</button>
        </div>
        <div class="mot"><span>Motivo:</span>${Object.entries(MOT).map(([k, t]) => `<button data-m="${k}" class="${k === why ? 'on' : ''}">${t}</button>`).join('')}</div>
        <div class="acx"></div><div class="htf"></div>`;
      hud();
      P.querySelector('[data-a="play"]').onclick = () => { if (pendQ) return; playT ? stop() : play(); };
      P.querySelector('[data-a="one"]').onclick = () => { if (!pendQ) { stop(); stepBar(); } };
      P.querySelectorAll('.mot button').forEach(b => b.onclick = () => { why = b.dataset.m; P.querySelectorAll('.mot button').forEach(x => x.classList.toggle('on', x === b)); });
      P.querySelectorAll('.acts button').forEach(b => b.onclick = () => act(b.dataset.x));
    }
    function pause(r) {
      stop(); pendQ = true;
      const q = P.querySelector('.dq'); q.hidden = false;
      q.innerHTML = `<b>${LAB.sgn(r)}R · ¿Qué haces?</b><span>Elige una acción (y su motivo). No sabes lo que viene.</span>`;
    }
    function done() { pendQ = false; const q = P.querySelector('.dq'); if (q) q.hidden = true; }
    function act(x) {
      if (!tr || !tr.open) return;
      stop();
      const idx = U() - 1 + W0, box = P.querySelector('.acx'); box.innerHTML = '';
      if (x === 'sl_move' || x === 'tp_move') {
        const cur = x === 'sl_move' ? tr.cur.sl : (tr.cur.tp ?? tr.orig.entry);
        const f = el(`<div class="mv"><label>${x === 'sl_move' ? 'Nuevo stop' : 'Nuevo objetivo'}</label><input type="number" step="0.1" value="${cur.toFixed(2)}">${x === 'sl_move' ? `<button data-q="away">alejar 1R</button>` : ''}<button data-q="ok" class="on">Aplicar</button></div>`);
        box.appendChild(f);
        const inp = f.querySelector('input');
        const away = f.querySelector('[data-q="away"]'); if (away) away.onclick = () => { inp.value = (tr.cur.sl - tr.s * tr.risk0).toFixed(2); };
        f.querySelector('[data-q="ok"]').onclick = () => {
          const v = +inp.value; if (!isFinite(v)) return;
          if (x === 'sl_move' && (tr.s > 0 ? v >= tr.last : v <= tr.last)) { box.appendChild(el('<p class="bad">Ese stop estaría al otro lado del precio actual.</p>')); return; }
          LAB.tradeAct(tr, x, { to: v, why, idx }); box.innerHTML = `<p class="mut">Registrado.</p>`; draw(); hud(); done();
        };
        return;
      }
      if (x === 'look') { look(idx); return; }
      const rec = LAB.tradeAct(tr, x, { why, idx });
      box.innerHTML = `<p class="mut">Registrado: <b>${LAB.ACTN[rec.act]}</b> · ${MOT[why]}.</p>`;
      draw(); hud(); done();
      if (!tr.open) end('cierre manual');
    }
    /* mirar marcos superiores: si la operación va en contra, pregunta si cambias el horizonte */
    function look(idx) {
      const h = P.querySelector('.htf'); h.innerHTML = '';
      const now = U() + W0, m15 = LAB.agg(cd.slice(0, now), 3).slice(-40), h1 = LAB.agg(cd.slice(0, now), 12).slice(-30);
      const g = el('<div class="grid g2" style="margin:8px 0"></div>');
      g.appendChild(lchart(m15, { title: 'M15', h: 170, padR: 40, flat: true }).node);
      g.appendChild(lchart(h1, { title: 'H1', h: 170, padR: 40, flat: true }).node);
      h.appendChild(g);
      h.appendChild(el(`<p class="mut"><b>H4:</b> ${cfg.h4 || 'estructura alcista de fondo, lejos de cualquier nivel relevante.'}</p>`));
      const r = LAB.rAt(tr, tr.last);
      tr.log.push({ act: 'look', idx, r: +r.toFixed(2), why: 'otro', note: 'miró M15/H1/H4' });
      if (r < 0) {
        h.appendChild(ask({
          q: `La operación va en ${LAB.sgn(r)}R. ¿Cambias el horizonte de la operación?`,
          opts: [
            { t: 'Sí: ahora es intradía', v: 'no', why: 'Has cambiado el horizonte después de conocer información desfavorable.' },
            { t: 'Sí: ahora es swing, H4 todavía es alcista', v: 'no', why: 'Has cambiado el horizonte después de conocer información desfavorable.' },
            { t: 'No: mi plan era ' + TIPO[tr.cur.tipo].toLowerCase() + ', respeto la invalidación', v: 'ok', why: 'Mirar contexto no es malo. Usarlo para rescatar una operación que va mal sí lo es.' }],
          onAnswer(o, k) {
            if (k < 2) {
              const seq = tr.cur.tipo === 'scalp' ? (k ? ['scalp', 'intra', 'swing'] : ['scalp', 'intra']) : [tr.cur.tipo, k ? 'swing' : 'intra'];
              LAB.tradeAct(tr, 'tf', { to: k ? 'swing' : 'intra', why: 'esperanza', idx });
              h.appendChild(el(`<div class="esc">${seq.map(s => `<span>${TIPO[s].toUpperCase()}</span>`).join('<i>↓</i>')}<i>↓</i><em>«H4 todavía es alcista…»</em></div>`));
              h.appendChild(el(`<div class="note no"><b>Has cambiado el horizonte después de conocer información desfavorable.</b> El marco superior no ha cambiado: lo que ha cambiado es que la operación pierde.</div>`));
              hud();
            }
            done();
          }
        }));
      }
    }
    /* ---- 5 · REVISAR ---- */
    function end(why2) {
      stop(); pendQ = false;
      const rv = LAB.review(tr, { entry: entryCtx });
      const e = journalEntry({ sim: cfg.id, title: cfg.title, tr, rv, ctx: entryCtx, variant: cfg.variants ? String.fromCharCode(65 + vi) : null });
      LAB.journal.add(e);
      P.innerHTML = `<div class="lq-x"><b>Operación terminada</b> (${why2}). Revisión abajo.</div>`;
      finish(e);
    }
    function finish(e) {
      stage = 'review'; pipe([6]);
      const R = wrap.querySelector('.ts-rev'); R.innerHTML = '';
      R.appendChild(el('<h3 class="sec" style="margin-top:22px">Revisión</h3>'));
      R.appendChild(reviewCard(e));
      if (cfg.variants && !e.noTrade) R.appendChild(el(`<div class="note">En esta repetición el mercado siguió la <b>variante ${String.fromCharCode(65 + vi)}</b>${cfg.varNames ? ' (' + cfg.varNames[vi] + ')' : ''}. Repite el ejercicio: la variante puede cambiar. Tu proceso no debería.</div>`));
      if (cfg.after) R.appendChild(el(`<div class="note key">${cfg.after}</div>`));
      const bar = el('<div class="ls-bar"><button class="btn plain" data-a="rest">Ver qué pasó después</button><button class="btn" data-a="again">Repetir el ejercicio</button></div>');
      bar.querySelector('[data-a="rest"]').onclick = e2 => { ch.upto(view.length); e2.target.remove(); };
      bar.querySelector('[data-a="again"]').onclick = () => { cfg.waited = 0; boot(); host.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
      R.appendChild(bar);
      if (cfg.onDone) cfg.onDone(e);
    }
    if (cfg.skipDecide) { entryCtx = cfg.skipDecide.ctx || 'plan'; plan(cfg.skipDecide.prefill || {}); } else decide();
    host._api = { stage: () => stage, tr: () => tr, chart: ch };
  }
  boot();
  return host;
}

/* ---------- operación guionizada: resultado frente a proceso ---------- */
function scriptedTrade(cfg) {
  const { tr, rv } = LAB.simulate(cfg.cd, cfg.start, cfg.plan, cfg.script, cfg.ctx || {});
  const e = journalEntry({ sim: cfg.id, title: cfg.title, tr, rv, ctx: (cfg.ctx || {}).entry });
  const x0 = cfg.start - 1;
  const ov = [{ k: 'level', p: cfg.plan.entry, from: x0, color: C.gold, lw: 1.1, label: 'entrada', L: 'user', at: x0 },
  { k: 'level', p: cfg.plan.sl, from: x0, to: tr.log.find(d => d.act === 'sl_away') ? tr.log.find(d => d.act === 'sl_away').idx : tr.endIdx, color: C.bear, lw: 1.3, label: 'stop del plan', L: 'user', at: x0 }];
  tr.log.filter(d => d.act === 'sl_away' || d.act === 'sl_be' || d.act === 'sl_tighten').forEach(d => ov.push({ k: 'level', p: d.to, from: d.idx, to: tr.endIdx, color: C.warn, lw: 1.3, dash: '4 3', label: 'stop movido', L: 'user', at: d.idx }));
  if (cfg.plan.tp != null) ov.push({ k: 'level', p: cfg.plan.tp, from: x0, to: tr.endIdx, color: C.bull, lw: 1.2, label: 'objetivo', L: 'user', at: x0 });
  tr.log.forEach(d => ov.push({ k: 'note', i: d.idx, side: tr.s > 0 ? 'L' : 'H', text: LAB.ACTN[d.act], color: C.warn, L: 'user', at: d.idx, fs: 9.5, off: 30 }));
  const wrap = el(`<div class="scripted"><div class="sc-h"><b>${cfg.title}</b><span>${cfg.sub || ''}</span></div></div>`);
  wrap.appendChild(lchart(cfg.cd, { title: 'XAUUSD', tf: cfg.tf || 'M5', h: 300, play: true, playFrom: cfg.start, causal: true, ov }).node);
  const btn = el('<div class="ls-bar"><button class="btn">Ver la evaluación</button></div>');
  btn.querySelector('button').onclick = () => { btn.replaceWith(reviewCard(e)); };
  wrap.appendChild(btn);
  return wrap;
}

/* ---------- diario de decisiones ---------- */
function journalView() {
  const wrap = el('<div class="jview"></div>');
  function paint() {
    const J = LAB.journal.all().slice().reverse();
    wrap.innerHTML = '';
    if (!J.length) { wrap.appendChild(el('<div class="note">Todavía no hay entradas. Cada simulación que termines (también las de «no operar») aparecerá aquí con su plan, sus decisiones y su evaluación.</div>')); return; }
    const tr = J.filter(e => !e.noTrade), R = tr.reduce((a, e) => a + e.result, 0), P = tr.length ? Math.round(tr.reduce((a, e) => a + e.process.score, 0) / tr.length) : 0;
    const flags = {}; J.forEach(e => (e.process ? e.process.flags : []).forEach(f => flags[f] = (flags[f] || 0) + 1));
    wrap.appendChild(el(`<div class="jsum">
      <div><span>simulaciones</span><b>${J.length}</b></div><div><span>no trade</span><b>${J.length - tr.length}</b></div>
      <div><span>resultado acumulado</span><b>${LAB.sgn(R)}R</b></div><div><span>plan respetado (media)</span><b>${P} %</b></div></div>`));
    if (Object.keys(flags).length) wrap.appendChild(el(`<div class="flags"><span>Comportamientos que han coincidido con patrones conocidos:</span>${Object.entries(flags).map(([k, v]) => `<b>${k} ×${v}</b>`).join('')}</div>`));
    J.slice(0, 12).forEach(e => {
      const d = el(`<details class="jent"><summary><span class="t">${esc(e.title || e.sim)}</span><span class="r ${e.result >= 0 ? 'u' : 'd'}">${e.noTrade ? 'NO TRADE' : LAB.sgn(e.result) + 'R'}</span><span class="p">${e.process ? e.process.verdict : ''}</span></summary></details>`);
      d.addEventListener('toggle', () => { if (d.open && !d.querySelector('.rev')) d.appendChild(reviewCard(e)); });
      wrap.appendChild(d);
    });
    const b = el('<div class="ls-bar"><button class="btn plain">Borrar diario</button></div>');
    b.querySelector('button').onclick = () => { if (confirm('¿Borrar todas las entradas del diario?')) { LAB.journal.clear(); paint(); } };
    wrap.appendChild(b);
  }
  paint();
  return wrap;
}

/* ============================================================
   SOBREOPERACIÓN — una sesión completa en la que puedes operar
   tanto como quieras. Al final: ¿qué información nueva
   justificaba cada entrada?
   cfg: { cd, from, marks:{clear:[i], amb:[i]} }
   ============================================================ */
function overtradeSim(cfg) {
  const RS_ = { plan: 'Setup planificado', sinconf: 'Sin confirmación', fomo: 'FOMO', fuera: 'Fuera del plan', aburr: 'Aburrimiento' };
  const wrap = el(`<div class="lab ovt"><div class="lab-main"></div><aside class="lab-side">
    <div class="hud"></div>
    <div class="ls-bar"><button class="btn" data-a="play">▶ Reproducir sesión</button><button class="btn plain" data-a="one">+1 vela</button></div>
    <div class="ls-tools big"><button data-d="1" class="buy">Comprar</button><button data-d="-1" class="sell">Vender</button></div>
    <div class="why" hidden><p class="ls-p">¿Por qué entras?</p><div class="ls-tools">${Object.entries(RS_).map(([k, t]) => `<button data-w="${k}">${t}</button>`).join('')}</div></div>
    <ul class="olog"></ul><div class="ls-x"></div></aside></div>`);
  const cd = cfg.cd; let T = null, pos = null, dir = 0; const trades = [];
  const ch = lchart(cd, { title: 'XAUUSD · Londres 08:00–11:00', tf: 'M1', h: 360, play: true, playFrom: cfg.from, causal: true, lockFwd: () => true, ov: OVX.sessions(cd) });
  ch.node.classList.add('noplay');
  wrap.querySelector('.lab-main').appendChild(ch.node);
  const U = () => ch.cur();
  const ov = () => OVX.sessions(cd).concat(trades.flatMap(t => [{ k: 'mark', i: t.i, side: t.dir > 0 ? 'L' : 'H', color: t.dir > 0 ? C.bull : C.bear, text: String(t.n), L: 'user', fs: 9 }]),
    pos ? [{ k: 'level', p: pos.tr.cur.sl, from: pos.i, color: C.bear, label: 'stop', L: 'user' }, { k: 'level', p: pos.tr.cur.tp, from: pos.i, color: C.bull, label: 'obj.', L: 'user' }] : []);
  function hud() {
    const R = trades.reduce((a, t) => a + (t.R || 0), 0), u = U();
    wrap.querySelector('.hud').innerHTML = `<div><span>hora</span><b>${LAB.hhmm(cd[u - 1].t)}</b></div><div><span>operaciones</span><b>${trades.length}</b></div><div><span>resultado</span><b class="${R >= 0 ? 'u' : 'd'}">${LAB.sgn(R)}R</b></div><div><span>posición</span><b>${pos ? (pos.dir > 0 ? 'larga' : 'corta') : '—'}</b></div>`;
    wrap.querySelector('.olog').innerHTML = trades.map(t => `<li><b>#${t.n}</b> ${LAB.hhmm(cd[t.i].t)} · ${t.dir > 0 ? 'compra' : 'venta'} · ${RS_[t.w]} · ${t.R == null ? 'abierta' : LAB.sgn(t.R) + 'R'}</li>`).join('');
  }
  function step() {
    const u = U(); if (u >= cd.length) { stop(); summary(); return false; }
    ch.upto(u + 1);
    if (pos) { const h = LAB.tradeBar(pos.tr, cd[u], u); if (h) { pos.t.R = LAB.realized(pos.tr); pos = null; } }
    ch.setOv(ov()); hud();
    if (U() >= cd.length) { stop(); if (pos) { LAB.tradeAct(pos.tr, 'close', { idx: cd.length - 1 }); pos.t.R = LAB.realized(pos.tr); pos = null; } summary(); return false; }
    return true;
  }
  const play = () => { stop(); T = setInterval(() => { if (!step()) stop(); }, 260); wrap.querySelector('[data-a="play"]').textContent = '⏸ Pausa'; };
  const stop = () => { clearInterval(T); T = null; wrap.querySelector('[data-a="play"]').textContent = '▶ Reproducir sesión'; };
  wrap.querySelector('[data-a="play"]').onclick = () => T ? stop() : play();
  wrap.querySelector('[data-a="one"]').onclick = () => { stop(); step(); };
  wrap.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
    if (pos || U() >= cd.length) return;
    stop(); dir = +b.dataset.d; wrap.querySelector('.why').hidden = false;
  });
  wrap.querySelectorAll('[data-w]').forEach(b => b.onclick = () => {
    if (!dir) return;
    const u = U(), last = cd[u - 1].c, a = LAB.atr(cd.slice(0, u)), at = LAB.atrAt(a, u - 1) || 1;
    let ext = dir > 0 ? Infinity : -Infinity; for (let i = Math.max(0, u - 12); i < u; i++) ext = dir > 0 ? Math.min(ext, cd[i].l) : Math.max(ext, cd[i].h);
    const sl = dir > 0 ? Math.min(ext - at * .3, last - at) : Math.max(ext + at * .3, last + at);
    const tp = dir > 0 ? last + Math.abs(last - sl) * 1.5 : last - Math.abs(last - sl) * 1.5;
    const plan = { tipo: 'scalp', dir: dir > 0 ? 'long' : 'short', hip: 'entrada rápida de sesión', evid: [RS_[b.dataset.w]], inval: 'último extremo de 12 velas', entry: last, sl, tp, risk: .25, mgmt: 'fijo' };
    const tr = LAB.tradeOpen(plan, u - 1); tr.last = last;
    const t = { n: trades.length + 1, i: u - 1, dir, w: b.dataset.w, R: null };
    trades.push(t); pos = { tr, t, dir, i: u - 1 }; dir = 0;
    wrap.querySelector('.why').hidden = true; ch.setOv(ov()); hud();
  });
  function summary() {
    if (wrap.querySelector('.osum')) return;
    const cnt = k => trades.filter(t => t.w === k).length;
    const x = wrap.querySelector('.ls-x');
    x.appendChild(el(`<div class="osum"><h6>Sesión terminada</h6><div class="jsum">
      <div><span>operaciones</span><b>${trades.length}</b></div><div><span>setups planificados</span><b>${cnt('plan')}</b></div>
      <div><span>sin confirmación</span><b>${cnt('sinconf')}</b></div><div><span>por FOMO</span><b>${cnt('fomo')}</b></div>
      <div><span>fuera del plan</span><b>${cnt('fuera') + cnt('aburr')}</b></div><div><span>resultado</span><b>${LAB.sgn(trades.reduce((a, t) => a + (t.R || 0), 0))}R</b></div></div>
      ${trades.length ? `<p class="ls-p"><b>¿Qué información nueva justificaba cada entrada?</b></p>
      <div class="just">${trades.map(t => `<div><span>#${t.n} · ${LAB.hhmm(cd[t.i].t)}</span><select data-n="${t.n}"><option value="">—</option><option value="est">estructura nueva</option><option value="reac">reacción en un nivel</option><option value="disp">desplazamiento</option><option value="mov">ninguna: solo el movimiento</option><option value="ns">no lo sé</option></select></div>`).join('')}</div>
      <button class="btn" data-a="j">Ver reflexión</button>` : '<p>No has operado. Si no veías información nueva, es una sesión perfectamente válida.</p>'}
      <div class="refl"></div></div>`));
    const jb = x.querySelector('[data-a="j"]');
    if (jb) jb.onclick = () => {
      const v = [...x.querySelectorAll('.just select')].map(s => s.value);
      const none = v.filter(z => z === 'mov' || z === 'ns' || !z).length;
      x.querySelector('.refl').innerHTML = `<div class="note key">${none ? `<b>${none} de ${trades.length}</b> entradas no tenían información nueva identificable.` : 'Cada entrada tenía una razón declarada.'} No se trata de un número correcto de operaciones: se trata de poder señalar qué cambió en el gráfico antes de cada clic.</div>`;
      ch.setOv(ov().concat((cfg.marks.clear || []).map(i => ({ k: 'vzone', from: i - 2, to: i + 4, color: C.bull, fo: .1, label: 'situación clara', L: 'user' })), (cfg.marks.amb || []).map(i => ({ k: 'vzone', from: i - 2, to: i + 3, color: C.mut, fo: .08, label: 'ambigua', L: 'user' }))));
      const flags = []; if (trades.length >= 5) flags.push(LAB.FLAG.OVER); if (cnt('fomo')) flags.push(LAB.FLAG.FOMO); if (cnt('sinconf')) flags.push(LAB.FLAG.ANT);
      const R = trades.reduce((a, t) => a + (t.R || 0), 0);
      const score = clamp(100 - cnt('fomo') * 15 - cnt('sinconf') * 10 - (cnt('fuera') + cnt('aburr')) * 15 - Math.max(0, trades.length - 4) * 5 - none * 5, 0, 100);
      LAB.journal.add({ sim: 'sobreoperacion', title: 'Sesión de Londres (sobreoperación)', ts: Date.now(), noTrade: trades.length === 0, decision: trades.length ? null : 'No operar en toda la sesión', plan: null, log: [], result: +R.toFixed(2), process: { score, verdict: score >= 80 ? 'CONSISTENTE' : score >= 50 ? 'PARCIALMENTE CONSISTENTE' : 'INCONSISTENTE', flags, notes: [`${trades.length} operaciones, ${none} sin información nueva identificable.`] }, extra: { trades } });
      if (trades.length) x.querySelector('.refl').appendChild(el(`<div class="flags">${flags.length ? '<span>Este comportamiento coincidió con:</span>' + flags.map(f => `<b>${f}</b>`).join('') : '<span>Sin patrones de sesgo destacables.</span>'}</div>`));
      jb.remove();
    };
  }
  hud();
  return wrap;
}

/* ============================================================
   SIMULADOR COMPLETO DE SESIÓN — H1 / M15 / M5 / M1 del mismo
   mercado, Asia → Londres → Nueva York, 14 pasos.
   cfg: { m1, stages:[...] } (ver contenido)
   ============================================================ */
function sessionSim(cfg) {
  const m1 = cfg.m1, TFK = { M1: 1, M5: 5, M15: 15, H1: 60 }, WIN = { M1: 110, M5: 120, M15: 96, H1: 40 };
  const wrap = el(`<div class="ssim">
    <div class="ss-steps"></div>
    <div class="lab"><div class="lab-main"><div class="tfpick"></div><div class="ss-chart"></div></div><aside class="lab-side"><div class="ss-p"></div></aside></div>
    <div class="ss-rev"></div></div>`);
  let si = 0, now = cfg.stages[0].at, tf = cfg.stages[0].tf || 'H1', api = null;
  const marks = { poi: null, liq: [] }, log = [];
  const stepsBox = wrap.querySelector('.ss-steps');
  const paintSteps = () => { stepsBox.innerHTML = `<ol>${cfg.stages.map((s, k) => `<li class="${k < si ? 'done' : k === si ? 'on' : ''}"><i>${k + 1}</i>${s.n}</li>`).join('')}</ol>`; };
  const tfb = wrap.querySelector('.tfpick');
  tfb.innerHTML = Object.keys(TFK).reverse().map(k => `<button data-tf="${k}">${k}</button>`).join('') + '<span class="clock"></span>';
  tfb.querySelectorAll('button').forEach(b => b.onclick = () => { tf = b.dataset.tf; chart(); });
  /* serie visible del marco elegido, agregada solo con velas M1 ya cerradas */
  function series() {
    const k = TFK[tf], all = LAB.aggUpto(m1, k, now), w0 = Math.max(0, all.length - WIN[tf]);
    return { cd: all.slice(w0), w0, k };
  }
  const idxOfT = (cd, t) => { let b = -1; cd.forEach((c, i) => { if (c.t <= t) b = i; }); return b; };
  function chart(extra = []) {
    const { cd } = series();
    tfb.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.tf === tf));
    tfb.querySelector('.clock').textContent = LAB.tlabel(m1[now - 1].t) + ' · ' + LAB.sessionOf(m1[now - 1].t).n;
    const ov = OVX.sessions(cd);
    if (marks.poi) { const i = idxOfT(cd, marks.poi.t); ov.push({ k: 'zone', p1: marks.poi.p1, p2: marks.poi.p2, from: Math.max(0, i), color: C.gold, fo: .13, label: 'tu POI', L: 'user' }); }
    marks.liq.forEach((p, k) => ov.push({ k: 'level', p, color: C.liq, dash: '2 3', label: 'liq ' + (k + 1), lab: 'in', L: 'user' }));
    const box = wrap.querySelector('.ss-chart'); box.innerHTML = '';
    api = lchart(cd, { title: 'XAUUSD', tf, h: 370, ov: ov.concat(extra) });
    box.appendChild(api.node);
    api.render('all');
    return api;
  }
  const P = wrap.querySelector('.ss-p');
  function stage() {
    paintSteps();
    const s = cfg.stages[si]; if (!s) return;
    now = Math.max(now, s.at || now); if (s.tf) tf = s.tf;
    P.innerHTML = `<div class="ls-top"><span>Paso ${si + 1} de ${cfg.stages.length}</span><span class="lvb">${s.n}</span></div>`;
    if (si === 0) P.appendChild(principle());
    const next = () => { si++; stage(); };
    chart();
    if (s.k === 'q') {
      P.appendChild(ask({ q: s.q, opts: s.opts, why: s.why, onAnswer(o) { log.push({ n: s.n, a: o.t, v: o.v }); P.appendChild(nb(next)); } }));
    } else if (s.k === 'poi') {
      P.appendChild(el(`<div class="ls-h">${s.q}</div><p class="ls-p">Arrastra en el gráfico para dibujar la zona.</p>`));
      const d = onChartDrag(api, {
        move: z => api.setOv(OVX.sessions(api.spec.candles).concat([{ k: 'zone', p1: z.p1, p2: z.p2, from: z.i1, color: C.gold, fo: .13, L: 'user' }])),
        done: z => {
          d.off(); const cd = api.spec.candles; marks.poi = { p1: z.p1, p2: z.p2, t: cd[z.i1].t };
          const r = s.ref, ov = Math.max(0, Math.min(r.p2, z.p2) - Math.max(r.p1, z.p1)) / (Math.max(r.p2, z.p2) - Math.min(r.p1, z.p1));
          const v = ov > .25 ? 'ok' : ov > 0 ? 'part' : 'no';
          chart([{ k: 'zone', p1: r.p1, p2: r.p2, from: Math.max(0, idxOfT(api.spec.candles, r.t)), color: C.liq, fo: .1, label: 'POI de referencia', L: 'poi', force: true }]);
          log.push({ n: s.n, a: 'zona ' + z.p1.toFixed(1) + '–' + z.p2.toFixed(1), v });
          P.appendChild(el(`<div class="lq-x"><b class="vd ${v}">${VERD[v]}</b> ${s.why}</div>`)); P.appendChild(nb(next));
        }
      });
    } else if (s.k === 'liq') {
      P.appendChild(el(`<div class="ls-h">${s.q}</div><p class="ls-p">Haz clic a la altura de cada zona (hasta 3) y pulsa Comprobar.</p>`));
      const ck = onChartClick(api, pt => { if (marks.liq.length >= 3) marks.liq.shift(); marks.liq.push(pt.p); chart(); rebind(); });
      let ckr = ck; const rebind = () => { ckr = onChartClick(api, pt => { if (marks.liq.length >= 3) marks.liq.shift(); marks.liq.push(pt.p); chart(); rebind(); }); };
      const b = el('<button class="btn">Comprobar</button>'); P.appendChild(b);
      b.onclick = () => {
        ckr.off(); b.remove();
        const hit = s.ref.filter(p => marks.liq.some(m => Math.abs(m - p) <= s.tol)).length, v = hit === s.ref.length ? 'ok' : hit ? 'part' : 'no';
        chart(s.ref.map(p => ({ k: 'level', p, color: C.liq, lw: 1.4, label: 'zona candidata', L: 'liq', force: true })));
        log.push({ n: s.n, a: marks.liq.length + ' marcas', v });
        P.appendChild(el(`<div class="lq-x"><b class="vd ${v}">${hit} de ${s.ref.length} zonas candidatas marcadas.</b> ${s.why}</div>`)); P.appendChild(nb(next));
      };
    } else if (s.k === 'replay') {
      P.appendChild(el(`<div class="ls-h">${s.q0 || 'Observa'}</div><p class="ls-p">${s.p || 'Avanza el tiempo. No sabes qué va a pasar: solo observa.'}</p>`));
      const b = el(`<div class="ls-bar"><button class="btn">▶ Avanzar ${s.stepMin || 15} min</button><span class="mut rp"></span></div>`); P.appendChild(b);
      const bt = b.querySelector('button');
      bt.onclick = () => {
        now = Math.min(s.to, now + (s.stepMin || 15)); chart();
        b.querySelector('.rp').textContent = LAB.hhmm(m1[now - 1].t) + ' / ' + LAB.hhmm(m1[s.to - 1].t);
        if (now >= s.to) { bt.remove(); P.appendChild(ask({ q: s.q, opts: s.opts, why: s.why, onAnswer(o) { log.push({ n: s.n, a: o.t, v: o.v }); P.appendChild(nb(next)); } })); }
      };
    } else if (s.k === 'decide') {
      P.appendChild(ask({
        q: s.q, opts: s.opts, why: s.why, onAnswer(o, k) {
          log.push({ n: s.n, a: o.t, v: o.v });

          else if (o.act === 'wait') { P.appendChild(el(`<div class="note">Esperar es válido. Avanzamos ${s.waitMin || 20} minutos.</div>`)); const b = el('<button class="btn">Esperar →</button>'); b.onclick = () => { now = Math.min(m1.length - 60, now + (s.waitMin || 20)); stage(); }; P.appendChild(b); }
          else P.appendChild(nb(next, 'Planificar →'));
        }
      }));
    } else if (s.k === 'trade') {

      const ts = tradeSim({ id: 'sesion', title: 'Sesión completa · M5', tf: 'M5', cd: m5, start: st5, window: 90, skipDecide: { prefill: s.prefill }, evid: s.evid, h4: s.h4, onDone: e => { tradeE = e; const b = el('<button class="btn">Ir al resumen de la sesión →</button>'); b.onclick = () => { si = cfg.stages.findIndex(x => x.k === 'review'); tfb.hidden = false; stage(); }; P.appendChild(b); } });

      if (tradeE) R.appendChild(reviewCard(tradeE));
      else R.appendChild(el(`<div class="note key"><b>Sin operación.</b> Si en ningún momento hubo información suficiente para ti, no operar fue coherente. Mira la sesión completa en el gráfico: el resultado posterior no cambia la calidad de esa decisión.</div>`));
      if (noTrade) LAB.journal.add({ sim: 'sesion', title: 'Simulador de sesión', ts: Date.now(), noTrade: true, decision: 'No operar', plan: null, log: [], result: 0, process: { score: 100, verdict: 'CONSISTENTE', flags: [], notes: ['Decidiste no operar en la sesión.'] } });
      const b = el('<div class="ls-bar"><button class="btn plain">Empezar la sesión de nuevo</button></div>');
      b.querySelector('button').onclick = () => { si = 0; now = cfg.stages[0].at; marks.poi = null; marks.liq = []; log.length = 0; tradeE = null; noTrade = false; R.innerHTML = ''; stage(); };

}

/* extremo real de las velas alrededor de un pivote diseñado */
function xt(cd, a, b, side) {
  let k = a; for (let i = a; i <= b; i++) if (side === 'H' ? cd[i].h > cd[k].h : cd[i].l < cd[k].l) k = i;
  return { i: k, p: side === 'H' ? cd[k].h : cd[k].l };
}
const hl = (cd, a, b) => { let h = -Infinity, l = Infinity; for (let i = a; i <= b; i++) { h = Math.max(h, cd[i].h); l = Math.min(l, cd[i].l); } return { h, l }; };
const firstTouch = (cd, from, pred) => { for (let i = from; i < cd.length; i++) if (pred(cd[i], i)) return i; return -1; };
const mean = a => a.reduce((x, y) => x + y, 0) / a.length;

function sixPlaces() {
  const L = LIQ();

    { t: 'Máximos iguales', cd: L[0].cd, z: L[0].zones },
    { t: 'Mínimos iguales', cd: L[1].cd, z: L[1].zones },

    { t: 'Extremos de rango', cd: L[3].cd, z: L[3].zones },
    { t: 'Break + retest / trendline', cd: L[7].cd, z: L[7].zones }
  ];
  const w = el(`<div class="six"><div class="gal">${S.map((s, i) => `<button data-i="${i}" class="${i ? '' : 'on'}"><span class="mono">${i + 1}</span> ${s.t}</button>`).join('')}</div><div class="six-b"></div></div>`);
  const show = i => {
    w.querySelectorAll('.gal button').forEach((b, k) => b.classList.toggle('on', k === i));
    const s = S[i], z = s.z || s.zf(s.cd), b = w.querySelector('.six-b'); b.innerHTML = '';
    const ch = lchart(s.cd, { title: 'XAUUSD', tf: 'M5', h: 270, ov: [] });
    b.appendChild(ch.node);
    const qs = el('<div class="six-q"></div>'); b.appendChild(qs);
    let k = 0;
    const next = () => {
      if (k < GUIDE.length) {
        const [q, a] = GUIDE[k++];
        const r = el(`<div class="gq"><b>${q}</b><button class="lnk">ver</button></div>`);
        r.querySelector('button').onclick = e => { e.target.replaceWith(el(`<p>${a}</p>`)); next(); };
        qs.appendChild(r);
      } else {
        const r = el('<button class="btn">Revelar la zona candidata</button>');
        r.onclick = () => { r.remove(); ch.setOv(z.map(x => ({ k: 'zone', p1: x.p + (x.side === 'H' ? 2.5 : -2.5), p2: x.p - (x.side === 'H' ? 2 : -2), from: x.from, color: C.liq, fo: .14, label: 'zona candidata', L: 'liq', force: true }))); qs.appendChild(el(`<p class="mut">${z[0].why || 'Es un extremo que cualquiera identifica a simple vista: por eso es candidato.'}</p>`)); };
        qs.appendChild(r);
      }
    };
    next();
  };
  w.querySelectorAll('.gal button').forEach(b => b.onclick = () => show(+b.dataset.i));
  show(0);
  return w;
}

   X.1 · RESULTADO ≠ CALIDAD DEL PROCESO
   ============================================================ */
function badGoodCases() {
  /* caso 1: mala decisión (alejar el stop) + resultado positivo */
  const c1 = LAB.extend(MGT().P, [[4, 4318, 1.6], [8, 4314.5, 1.4], [14, 4306, 2.2], [20, 4318, 2.4], [30, 4338, 2.6], [38, 4344, 2]], 15001);
  const s = MGT().start, e = c1[s - 1].c;
  let lo1 = Infinity; for (let i = s; i <= s + 8; i++) lo1 = Math.min(lo1, c1[i].l);
  const sl = +(lo1 - .6).toFixed(2), risk = e - sl;
  let lo2 = Infinity; for (let i = s; i < c1.length; i++) lo2 = Math.min(lo2, c1[i].l);
  const mv = firstTouch(c1, s, k => k.l - sl < risk * .25) ;
  const exit = firstTouch(c1, mv + 1, k => (k.c - e) / risk >= 1.8);
  const p1 = { tipo: 'intra', dir: 'long', hip: 'Continuación alcista tras retroceso', evid: ['Estructura del marco superior', 'Reacción en la zona'], inval: 'Cierre por debajo del último HL', entry: e, sl, tp: null, risk: .5, mgmt: 'fijo' };
  const scr1 = [{ i: mv, act: 'sl_move', o: { to: +(lo2 - 1.5).toFixed(2), why: 'esperanza', note: '«seguro que rebota»' } }, { i: exit, act: 'close', o: { why: 'otro' } }];
  /* caso 2: buen proceso + resultado negativo */
  const c2 = MGT().loseE, e2 = c2[s - 1].c;
  const p2 = { tipo: 'intra', dir: 'long', hip: 'Continuación alcista tras retroceso', evid: ['Estructura del marco superior', 'Reacción en la zona'], inval: 'Cierre por debajo del último HL', entry: e2, sl: +(e2 - 7).toFixed(2), tp: +(e2 + 14).toFixed(2), risk: .5, mgmt: 'fijo' };
  /* caso 3: la operación cambió (scalp → swing, stop alejado, sin objetivo) */
  const c3 = MGT().fall;
  const p3 = { tipo: 'scalp', dir: 'long', hip: 'Scalp de continuación en M5', evid: ['Reacción en la zona'], inval: 'Pérdida del mínimo del retroceso', entry: c3[s - 1].c, sl: +(c3[s - 1].c - 5).toFixed(2), tp: +(c3[s - 1].c + 7.5).toFixed(2), risk: .5, mgmt: 'fijo' };
  const n3 = firstTouch(c3, s, k => (k.c - p3.entry) / 5 <= -.6);
  const scr3 = [{ i: n3, act: 'tf', o: { to: 'swing', why: 'esperanza', note: 'H4 todavía es alcista' } }, { i: n3, act: 'sl_move', o: { to: +(p3.entry - 20).toFixed(2), why: 'esperanza' } }, { i: n3, act: 'tp_remove', o: { why: 'esperanza' } }];
  return { c1, p1, scr1, c2, p2, c3, p3, scr3, s };
}

  const t = (name, fn) => { try { const r = fn(); R.push({ name, ok: r === true || r === undefined, info: typeof r === 'string' ? r : r === true ? '' : String(r) }); } catch (e) { R.push({ name, ok: false, info: String(e && e.stack || e).slice(0, 400) }); } };
  const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const host = el('<div id="st-host" style="position:absolute;left:-12000px;top:0;width:1100px"></div>');
  document.body.appendChild(host);
  const mount = n => { host.innerHTML = ''; host.appendChild(n); REG.forEach(r => { if (r.box.isConnected) r.render('all'); }); return n; };

  /* ---------- semillas y agregación ---------- */
  const base = LAB.gen([[0, 4300], [200, 4340, 1], [400, 4310, 1], [600, 4350, 1]], 77, { tf: 1, t0: 0 });
  t('seeds reproducibles: misma semilla → misma serie', () => eq(base, LAB.gen([[0, 4300], [200, 4340, 1], [400, 4310, 1], [600, 4350, 1]], 77, { tf: 1, t0: 0 })));
  t('seeds: semilla distinta → serie distinta', () => !eq(base, LAB.gen([[0, 4300], [200, 4340, 1], [400, 4310, 1], [600, 4350, 1]], 78, { tf: 1, t0: 0 })));
  t('seeds: las series de los capítulos son deterministas', () => eq(LIQ()[0].cd.slice(0, 5), M5([[0, 4310], [14, 4328, 2], [22, 4318, 1.8], [34, 4346, 2.2], [42, 4334, 1.8], [52, 4358, 2], [60, 4340, 1.8], [70, 4358.5, 1.8], [78, 4346, 1.6], [88, 4358.2, 1.6], [99, 4350, 1.6]], 401).slice(0, 5)));
  t('multi-timeframe: M5 agregado respeta O/H/L/C de sus 5 velas M1', () => {
    const m5 = LAB.agg(base, 5);
    return m5.every((k, j) => { const s = base.slice(j * 5, j * 5 + 5); return k.o === s[0].o && k.c === s[s.length - 1].c && k.h === Math.max(...s.map(x => x.h)) && k.l === Math.min(...s.map(x => x.l)); });
  });
  t('multi-timeframe: H1 desde M1 = H1 desde M5 (mismo mercado)', () => eq(LAB.agg(base, 60).map(k => [k.o, k.h, k.l, k.c]), LAB.agg(LAB.agg(base, 5), 12).map(k => [k.o, k.h, k.l, k.c])));
  t('multi-timeframe: la vela superior en curso solo usa velas base cerradas', () => { const p = LAB.aggUpto(base, 15, 37); const last = p[p.length - 1]; return last.part && last.c === base[36].c && last.h === Math.max(...base.slice(30, 37).map(x => x.h)); });
  t('extend: dos escenarios idénticos hasta la bifurcación', () => { const S = SWP(); return eq(S.A.slice(0, S.fork), S.B.slice(0, S.fork)) && !eq(S.A.slice(S.fork), S.B.slice(S.fork)); });

  /* ---------- sin información futura ---------- */
  const cd = CYC().cd;

  const causal = (name, f) => t('sin futuro: ' + name, () => Ns.every(N => eq(f(cd.slice(0, N)), LAB.until(f(cd), N))) || 'difiere');

  causal('estado de sesión', c => LAB.sessions(c).map(s => ({ k: s.k, from: s.from, at: s.at })));
  t('sin futuro: evento de liquidez (barrido / aceptación)', () => {
    const lv = LAB.eqLevels(cd, LAB.swings(cd));

const GLOSS = [
  ['HH', 'Higher High — máximo creciente: un máximo por encima del máximo anterior', 'estructura'],
  ['HL', 'Higher Low — mínimo creciente: un mínimo por encima del mínimo anterior', 'estructura'],
  ['LH', 'Lower High — máximo decreciente', 'estructura'], ['LL', 'Lower Low — mínimo decreciente', 'estructura'],
  ['BOS', 'Break of Structure — rotura de estructura a favor de la tendencia', 'bos-choch'],
  ['CHoCH', 'Change of Character — cambio de carácter: primera rotura en contra de la estructura vigente', 'bos-choch'],
  ['MSS', 'Market Structure Shift — cambio de estructura con desplazamiento, normalmente tras un barrido', 'bos-choch'],
  ['FVG', 'Fair Value Gap — hueco de valor justo: el espacio entre la vela 1 y la vela 3 de una secuencia de tres', 'fvg'],
  ['OB', GLOS['Order Block'], 'supply-demand'], ['POI', GLOS.POI, 'lab-poi'], ['Sweep', GLOS.Sweep, 'lab-sweep'],
  ['Inducción', GLOS['Inducción'], 'lab-induccion'], ['Balance', GLOS.Balance, 'lab-balance'], ['Imbalance', GLOS.Imbalance, 'lab-balance'],
  ['Displacement', GLOS.Desplazamiento, 'lab-balance'], ['Liquidez', GLOS.Liquidez, 'liquidez'], ['Aceptación', GLOS['Aceptación'], 'lab-sweep'],
  ['ATR', 'ATR y Bandas de Bollinger miden lo mismo desde dos ángulos: amplitud. Sirven para dimensionar lo que ves, no para decidir dirección.', 'volatilidad'],
  ['ADX', 'El ADX mide la intensidad del movimiento direccional, sin decir el signo. Para la dirección están +DI y −DI, y sobre todo está el precio.', 'fuerza'],
  ['RSI', 'El RSI compara la fuerza de las subidas con la de las bajadas recientes.', 'momentum'],
  ['VWAP', 'VWAP es el precio medio ponderado de la sesión: es la referencia de quién va ganando dentro del día.', 'canales'],
  ['R', GLOS.R, 'op-plan']
];
(function glosInit() {
  const g = $('#glos'), dl = g.querySelector('dl'), inp = g.querySelector('input');
  const paint = q => { q = (q || '').toLowerCase(); dl.innerHTML = GLOSS.filter(([t, d]) => !q || (t + ' ' + d).toLowerCase().includes(q)).map(([t, d, id]) => `<dt>${t}</dt><dd>${d} <a href="#/${id}">${chOf(id) ? chOf(id).nav : ''} →</a></dd>`).join('') || '<dd class="mut">Sin resultados.</dd>'; };
  const open = () => { paint(''); inp.value = ''; g.hidden = false; setTimeout(() => inp.focus(), 30); };
  const close = () => { g.hidden = true; };
  inp.addEventListener('input', () => paint(inp.value));
  g.addEventListener('click', e => { if (e.target === g || e.target.closest('[data-close]') || e.target.closest('dd a')) close(); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && !g.hidden) close(); });
  $('#glosBtn').addEventListener('click', open);
  $('#toolsG').addEventListener('click', e => {
    const b = e.target.closest('[data-tool]'); if (!b) { if (e.target.closest('a')) document.body.classList.remove('menu'); return; }
    if (b.dataset.tool === 'glos') open();
    if (b.dataset.tool === 'naked') setNaked(!document.body.classList.contains('naked'));
  });
  window.openGlossary = open;
})();

/* @@NAV:END */
/* modo aprendizaje / modo desnudo */
(function nakedInit() {
  const b = $('#nakedBtn'); if (!b) return;
  let on = false;
  try { on = localStorage.getItem('xau_naked') === '1'; } catch (e) { }
  b.addEventListener('click', () => setNaked(!document.body.classList.contains('naked')));
  setNaked(on);
})();

addEventListener('hashchange', () => go((location.hash.replace('#/', '') || CH[0].id)));
$('#burger').addEventListener('click', () => document.body.classList.toggle('menu'));
$('.scrim').addEventListener('click', () => document.body.classList.remove('menu'));
$('#nav').addEventListener('click', e => { if (e.target.closest('a')) document.body.classList.remove('menu'); });

/* panel flotante */
const pf = $('#pfloat');
pf.innerHTML = `<div class="pf-h"><b>¿Cómo leo un gráfico?</b><button class="ghost" id="pfClose" style="padding:3px 9px">Cerrar</button></div>
<ol>${CKD.map(c => `<li><b>${c.t}</b>${c.s}</li>`).join('')}</ol>`;
$('#pfClose').addEventListener('click', () => pf.classList.remove('on'));
$('#pinBtn').addEventListener('click', () => pf.classList.toggle('on'));
document.addEventListener('click', e => {
  if (e.target.id === 'ckFloat') pf.classList.add('on');
  if (e.target.id === 'ckReset') { $$('.ck-item').forEach(n => n.classList.remove('on')); try { localStorage.removeItem('xau_ck'); } catch (err) { } }
});

go(location.hash.replace('#/', '') || CH[0].id);
if (/selftest/.test(location.search)) setTimeout(runSelfTest, 60);
</script>
