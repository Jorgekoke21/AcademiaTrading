<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leer el gráfico — Análisis técnico aplicado a XAUUSD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#0A0C10;
  --bg-2:#0E1117;
  --panel:#12161D;
  --panel-2:#171C25;
  --line:#232A35;
  --line-2:#2E3746;
  --tx:#DDE3EC;
  --tx-2:#9AA6B8;
  --tx-3:#6B7686;
  --gold:#E8B44A;
  --gold-dim:#8A6C2A;
  --bull:#2BBF7B;
  --bear:#E5484D;
  --liq:#8B7BF0;
  --info:#4CC2E0;
  --warn:#F0983C;
  --r-s:6px; --r-m:10px; --r-l:16px;
  --rail:266px;
  --ff-d:"Space Grotesk",system-ui,sans-serif;
  --ff-b:"Inter",system-ui,-apple-system,sans-serif;
  --ff-m:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root:not([data-theme="light"]){ color-scheme: dark; }
:root[data-theme="dark"]{ color-scheme: dark; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--tx);
  font-family:var(--ff-b);
  font-size:15.5px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4,h5{font-family:var(--ff-d);font-weight:600;line-height:1.18;letter-spacing:-.015em;margin:0}
p{margin:0 0 .9em}
a{color:var(--gold);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--ff-m)}
.mut{color:var(--tx-2)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#242c38;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- LAYOUT ---------- */
.app{display:flex;min-height:100vh}
.rail{
  width:var(--rail);flex:0 0 var(--rail);
  background:var(--bg-2);border-right:1px solid var(--line);
  position:fixed;inset:0 auto 0 0;height:100vh;display:flex;flex-direction:column;z-index:60;
}
.brand{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.brand .tick{display:flex;align-items:baseline;gap:8px;font-family:var(--ff-m);font-size:12px;color:var(--tx-3);letter-spacing:.06em}
.brand .tick b{color:var(--gold);font-weight:700}
.brand h1{font-size:19px;margin:6px 0 2px;letter-spacing:-.02em}
.brand p{margin:0;font-size:12.5px;color:var(--tx-3);line-height:1.4}
.prog{padding:12px 20px;border-bottom:1px solid var(--line)}
.prog .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx-3);font-family:var(--ff-m);margin-bottom:7px}
.prog .row b{color:var(--gold);font-weight:500}
.bar{height:4px;background:#1C2230;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));border-radius:99px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.nav{flex:1;overflow-y:auto;padding:10px 12px 28px}
.nav .grp{font-family:var(--ff-m);font-size:10.5px;letter-spacing:.14em;color:var(--tx-3);padding:14px 8px 7px}
.nav a{
  display:grid;grid-template-columns:26px 1fr;gap:9px;align-items:center;
  padding:7px 9px;border-radius:8px;color:var(--tx-2);font-size:13.8px;line-height:1.3;
  transition:background .16s,color .16s;position:relative
}
.nav a .n{font-family:var(--ff-m);font-size:11px;color:var(--tx-3);text-align:right}
.nav a:hover{background:#181E28;color:var(--tx)}
.nav a.on{background:#1B222E;color:var(--tx)}
.nav a.on .n{color:var(--gold)}
.nav a.on::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:2px;background:var(--gold);border-radius:0 2px 2px 0}
.nav a.done .n::after{content:"✓";color:var(--bull);margin-left:3px;font-size:10px}

.main{flex:1;margin-left:var(--rail);min-width:0}
.topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:0 26px;height:54px;background:rgba(10,12,16,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)
}
.topbar .crumb{font-family:var(--ff-m);font-size:11.5px;color:var(--tx-3);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .crumb b{color:var(--tx-2);font-weight:500}
.topbar .sp{flex:1}
.burger{display:none;width:34px;height:34px;border:1px solid var(--line);border-radius:8px;align-items:center;justify-content:center}
.burger span,.burger span::before,.burger span::after{content:"";display:block;width:15px;height:1.5px;background:var(--tx-2);position:relative}
.burger span::before{position:absolute;top:-5px}
.burger span::after{position:absolute;top:5px}
.ghost{border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-size:12.5px;color:var(--tx-2);transition:.16s}
.ghost:hover{border-color:var(--line-2);color:var(--tx)}
.ghost.pin{border-color:var(--gold-dim);color:var(--gold)}

.wrap{max-width:1080px;padding:38px 26px 120px;margin:0 auto}
.chapfoot{display:flex;justify-content:space-between;gap:12px;margin-top:56px;padding-top:22px;border-top:1px solid var(--line)}
.chapfoot button{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r-m);max-width:46%;text-align:left;transition:.18s}
.chapfoot button:hover{border-color:var(--gold-dim);background:var(--panel)}
.chapfoot button:last-child{text-align:right;align-items:flex-end}
.chapfoot small{font-family:var(--ff-m);font-size:10.5px;color:var(--tx-3)}
.chapfoot b{font-family:var(--ff-d);font-weight:600;font-size:14px}

/* ---------- HEADERS ---------- */
.chead{margin-bottom:30px}
.chead .kick{display:flex;align-items:center;gap:10px;font-family:var(--ff-m);font-size:11.5px;color:var(--gold);letter-spacing:.1em;margin-bottom:12px}
.chead .kick i{display:block;width:26px;height:1px;background:var(--gold-dim);font-style:normal}
.chead h2{font-size:clamp(28px,4.4vw,40px);letter-spacing:-.03em;margin-bottom:10px}
.chead .lede{font-size:17px;color:var(--tx-2);max-width:66ch;margin:0}
h3.sec{font-size:22px;margin:52px 0 6px;letter-spacing:-.02em;scroll-margin-top:70px}
h3.sec + .sub{color:var(--tx-2);margin:0 0 20px;max-width:70ch;font-size:15px}
h4.min{font-size:15.5px;font-family:var(--ff-d);margin:0 0 6px}
.body{max-width:72ch}
.body p{color:var(--tx-2)}
.body strong{color:var(--tx);font-weight:600}

/* ---------- CHART ---------- */
.chart{margin:22px 0 10px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);overflow:hidden}
.chart-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chart-head .t{font-family:var(--ff-d);font-weight:600;font-size:14.5px}
.chart-head .tf{font-family:var(--ff-m);font-size:10.5px;color:var(--tx-3);border:1px solid var(--line);padding:2px 7px;border-radius:99px}
.chart-head .sp{flex:1;min-width:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tgl{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel-2);padding:5px 11px 5px 8px;border-radius:99px;font-size:12.3px;color:var(--tx-2);transition:.18s;user-select:none}
.tgl .sw{width:26px;height:15px;border-radius:99px;background:#2A3240;position:relative;transition:background .2s;flex:0 0 auto}
.tgl .sw::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#7A8698;transition:transform .2s,background .2s}
.tgl.on{color:var(--tx);border-color:var(--gold-dim)}
.tgl.on .sw{background:#4A3A17}
.tgl.on .sw::after{transform:translateX(11px);background:var(--gold)}
.chart-svg{position:relative;padding:4px 6px 2px}
.chart-svg svg{display:block;width:100%;height:auto;overflow:visible}
.chart figcaption{padding:0 16px 14px;color:var(--tx-2);font-size:13.6px;line-height:1.55;max-width:80ch}
.chart figcaption b{color:var(--tx)}
.chart.flat{background:transparent;border-color:var(--line)}

@keyframes cdlIn{from{opacity:0;transform:translateY(10px) scaleY(.5)}to{opacity:1;transform:none}}
@keyframes ovIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.cdl{transform-box:fill-box;transform-origin:center;animation:cdlIn .34s cubic-bezier(.2,.8,.3,1) both}
.ovg{animation:ovIn .4s ease both}
.pulse{animation:pl 1.9s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.cdl,.ovg,.pulse{animation:none!important}*{transition-duration:.01ms!important}}

.xh{position:absolute;inset:0;pointer-events:none}
.readout{
  position:absolute;pointer-events:none;background:#080A0E;border:1px solid var(--line-2);
  border-radius:8px;padding:7px 9px;font-family:var(--ff-m);font-size:11px;line-height:1.5;
  color:var(--tx-2);white-space:nowrap;opacity:0;transition:opacity .12s;z-index:5
}
.readout b{color:var(--tx);font-weight:500}
.readout .u{color:var(--bull)}.readout .d{color:var(--bear)}

/* ---------- STEPPER ---------- */
.stepper{border-top:1px solid var(--line);background:var(--panel-2)}
.step-nav{display:flex;align-items:center;gap:12px;padding:10px 14px}
.step-nav button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);padding:6px 13px;border-radius:99px;font-size:12.8px;color:var(--tx-2);transition:.16s}
.step-nav button:hover:not(:disabled){border-color:var(--gold-dim);color:var(--tx)}
.step-nav button:disabled{opacity:.34;cursor:default}
.dots{flex:1;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.dots i{width:22px;height:3px;border-radius:99px;background:#2A3240;cursor:pointer;transition:background .2s,transform .2s}
.dots i.on{background:var(--gold)}
.dots i.past{background:var(--gold-dim)}
.step-txt{padding:2px 16px 15px;display:flex;gap:12px;align-items:flex-start}
.step-txt .num{font-family:var(--ff-m);font-size:11px;color:var(--gold);border:1px solid var(--gold-dim);border-radius:99px;padding:2px 8px;flex:0 0 auto;margin-top:2px}
.step-txt h5{font-family:var(--ff-d);font-size:15px;font-weight:600;margin:0 0 3px}
.step-txt p{margin:0;font-size:13.8px;color:var(--tx-2);max-width:74ch}

/* ---------- QA TABS ---------- */
.qa{border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;margin:18px 0 8px;background:var(--bg-2)}
.qa-tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.qa-tabs::-webkit-scrollbar{display:none}
.qa-tabs button{
  padding:11px 14px;font-size:12.6px;color:var(--tx-3);white-space:nowrap;border-bottom:2px solid transparent;
  transition:.16s;display:flex;gap:7px;align-items:center
}
.qa-tabs button:hover{color:var(--tx-2)}
.qa-tabs button.on{color:var(--tx);border-bottom-color:var(--gold);background:#141922}
.qa-tabs .dg{color:var(--tx-3);font-family:var(--ff-m);font-size:10.5px}
.qa-body{padding:15px 18px;font-size:14.6px;color:var(--tx-2);min-height:78px;max-width:84ch}
.qa-body b{color:var(--tx)}
.qa-body .k{font-family:var(--ff-d);color:var(--tx);display:block;margin-bottom:3px;font-size:13px}

/* ---------- CARDS / GRIDS ---------- */
.grid{display:grid;gap:14px;margin:20px 0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{border:1px solid var(--line);border-radius:var(--r-m);padding:16px 17px;background:var(--panel)}
.card h4{font-family:var(--ff-d);font-size:14.5px;margin:0 0 7px;display:flex;align-items:center;gap:8px}
.card p{margin:0;font-size:13.7px;color:var(--tx-2)}
.card p+p{margin-top:8px}
.card .dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.card.bull{border-color:#1E4A38}.card.bull h4{color:var(--bull)}
.card.bear{border-color:#4E2427}.card.bear h4{color:var(--bear)}
.card.liq{border-color:#3A3468}.card.liq h4{color:var(--liq)}
.card.gold{border-color:var(--gold-dim)}.card.gold h4{color:var(--gold)}

.note{border-left:2px solid var(--line-2);padding:12px 16px;background:var(--bg-2);border-radius:0 var(--r-m) var(--r-m) 0;margin:20px 0;font-size:14.2px;color:var(--tx-2)}
.note b{color:var(--tx)}
.note.warn{border-left-color:var(--warn)}
.note.warn b{color:var(--warn)}
.note.key{border-left-color:var(--gold)}
.note.key b{color:var(--gold)}
.note.no{border-left-color:var(--bear)}
.note.no b{color:var(--bear)}
.note p:last-child{margin-bottom:0}
.scalp-panel{margin:22px 0 8px;border:1px solid var(--gold-dim);border-radius:var(--r-l);background:var(--panel);overflow:hidden}
.scalp-panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);background:rgba(232,180,74,.05)}
.scalp-panel-h b{font-family:var(--ff-d);font-size:14px;color:var(--gold)}
.scalp-panel-h span{font-family:var(--ff-m);font-size:10.5px;color:var(--tx-3);text-transform:uppercase;letter-spacing:.08em}
.scalp-panel iframe{display:block;width:100%;height:900px;border:0;background:var(--bg)}

.term{border-bottom:1px dotted var(--tx-3);cursor:help;position:relative;color:var(--tx)}
.term:hover::after,.term:focus::after{
  content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:#080A0E;border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;width:max-content;max-width:270px;
  font-size:12.4px;line-height:1.45;color:var(--tx-2);font-family:var(--ff-b);z-index:40;white-space:normal;box-shadow:0 8px 24px rgba(0,0,0,.6)
}
.tag{font-family:var(--ff-m);font-size:11px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--tx-2);display:inline-block}
.tag.b{border-color:#1E4A38;color:var(--bull)}
.tag.s{border-color:#4E2427;color:var(--bear)}
.tag.l{border-color:#3A3468;color:var(--liq)}
.tag.g{border-color:var(--gold-dim);color:var(--gold)}

.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin:24px 0}
.flow .st{flex:1;min-width:132px;border:1px solid var(--line);border-radius:var(--r-m);padding:13px 14px;position:relative;background:var(--panel)}
.flow .st + .st{margin-left:10px}
.flow .st .i{font-family:var(--ff-m);font-size:10.5px;color:var(--tx-3)}
.flow .st h5{font-family:var(--ff-d);font-size:14px;margin:3px 0 4px}
.flow .st p{margin:0;font-size:12.6px;color:var(--tx-2);line-height:1.45}

ul.ticks{list-style:none;padding:0;margin:14px 0}
ul.ticks li{padding:7px 0 7px 26px;position:relative;font-size:14.2px;color:var(--tx-2);border-bottom:1px solid var(--line)}
ul.ticks li:last-child{border-bottom:none}
ul.ticks li::before{content:"";position:absolute;left:6px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--gold-dim)}
ul.ticks li b{color:var(--tx)}
ul.ticks.yes li::before{background:var(--bull)}
ul.ticks.no li::before{background:var(--bear)}

/* ---------- PRACTICE ---------- */
.quiz{border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);overflow:hidden;margin:20px 0}
.quiz-top{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.quiz-top .q{font-family:var(--ff-m);font-size:11px;color:var(--tx-3)}
.quiz-q{padding:16px 18px 6px;font-family:var(--ff-d);font-size:17.5px;font-weight:600}
.quiz-hint{padding:0 18px 12px;font-size:13.4px;color:var(--tx-3)}
.opts{display:grid;gap:9px;padding:12px 18px 18px}
.opts button{
  text-align:left;border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;
  font-size:14.2px;color:var(--tx-2);transition:.16s;display:flex;gap:11px;align-items:flex-start
}
.opts button .k{font-family:var(--ff-m);font-size:11.5px;color:var(--tx-3);border:1px solid var(--line);border-radius:5px;width:20px;height:20px;display:grid;place-items:center;flex:0 0 auto;margin-top:1px}
.opts button:hover:not(:disabled){border-color:var(--line-2);color:var(--tx);background:var(--panel-2)}
.opts button.ok{border-color:var(--bull);color:var(--tx);background:rgba(43,191,123,.07)}
.opts button.ko{border-color:var(--bear);color:var(--tx);background:rgba(229,72,77,.07)}
.opts button:disabled{cursor:default}
.quiz-sol{padding:0 18px 18px}
.solbox{border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:0 var(--r-m) var(--r-m) 0;padding:13px 16px;background:var(--bg-2);font-size:14.2px;color:var(--tx-2)}
.solbox b{color:var(--tx)}
.quiz-act{display:flex;gap:10px;padding:0 18px 18px;flex-wrap:wrap}
.btn{border:1px solid var(--gold-dim);color:var(--gold);padding:9px 17px;border-radius:99px;font-size:13.4px;transition:.16s}
.btn:hover{background:rgba(232,180,74,.1)}
.btn.plain{border-color:var(--line);color:var(--tx-2)}
.btn.plain:hover{background:var(--panel-2);color:var(--tx)}
.score{display:flex;gap:16px;align-items:center;font-family:var(--ff-m);font-size:12px;color:var(--tx-3)}
.score b{color:var(--gold);font-weight:500}
.clickable{cursor:crosshair}

/* ---------- CHECKLIST ---------- */
.ck{display:grid;gap:10px;margin:26px 0}
.ck-item{border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel);overflow:hidden;transition:border-color .2s}
.ck-item.on{border-color:#1E4A38}
.ck-head{display:grid;grid-template-columns:auto 34px 1fr auto;gap:12px;align-items:center;padding:13px 15px;width:100%;text-align:left}
.ck-box{width:20px;height:20px;border:1.5px solid var(--line-2);border-radius:6px;display:grid;place-items:center;flex:0 0 auto;transition:.18s}
.ck-item.on .ck-box{background:var(--bull);border-color:var(--bull)}
.ck-box svg{opacity:0;transition:opacity .18s}
.ck-item.on .ck-box svg{opacity:1}
.ck-n{font-family:var(--ff-m);font-size:11px;color:var(--gold);text-align:center}
.ck-t{font-family:var(--ff-d);font-size:15.5px;font-weight:600}
.ck-t span{display:block;font-family:var(--ff-b);font-weight:400;font-size:13px;color:var(--tx-2);margin-top:1px}
.ck-caret{color:var(--tx-3);transition:transform .2s}
.ck-item.open .ck-caret{transform:rotate(90deg)}
.ck-body{display:none;padding:0 15px 15px 61px}
.ck-item.open .ck-body{display:block}
.ck-body li{font-size:13.8px;color:var(--tx-2);margin-bottom:5px}
.ck-body .bad{color:var(--bear)}

.panel-float{position:fixed;right:18px;bottom:18px;width:330px;max-height:70vh;overflow:auto;background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-l);box-shadow:0 20px 60px rgba(0,0,0,.66);z-index:80;display:none}
.panel-float.on{display:block}
.panel-float .pf-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg-2)}
.panel-float .pf-h b{font-family:var(--ff-d);font-size:13.5px;flex:1}
.panel-float ol{margin:0;padding:10px 14px 14px 30px}
.panel-float li{font-size:13px;color:var(--tx-2);margin-bottom:9px;line-height:1.45}
.panel-float li b{color:var(--tx);font-family:var(--ff-d);display:block;font-size:13px}

.hero-mantra{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 8px}
.hero-mantra div{
  flex:1;min-width:104px;border:1px solid var(--line);border-radius:var(--r-m);padding:12px 12px 13px;background:var(--panel);
  position:relative;overflow:hidden
}
.hero-mantra div::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--c,var(--gold));opacity:.6}
.hero-mantra .l{font-family:var(--ff-m);font-size:10px;color:var(--tx-3);letter-spacing:.08em}
.hero-mantra .v{font-family:var(--ff-d);font-size:14.5px;font-weight:600;margin-top:4px}
.hero-mantra .d{font-size:12px;color:var(--tx-2);margin-top:3px;line-height:1.4}

.tl{margin:22px 0}
.tl-bar{display:flex;height:46px;border-radius:var(--r-m);overflow:hidden;border:1px solid var(--line)}
.tl-bar div{display:flex;flex-direction:column;justify-content:center;padding:0 13px;font-size:12.6px;transition:flex .3s}
.tl-bar .s{font-family:var(--ff-m);font-size:10px;opacity:.75}
.tl-asia{background:linear-gradient(180deg,rgba(76,194,224,.16),rgba(76,194,224,.05));border-right:1px solid var(--line);color:var(--info)}
.tl-lon{background:linear-gradient(180deg,rgba(232,180,74,.16),rgba(232,180,74,.05));border-right:1px solid var(--line);color:var(--gold)}
.tl-ny{background:linear-gradient(180deg,rgba(139,123,240,.16),rgba(139,123,240,.05));color:var(--liq)}

.mtf{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));margin:20px 0}
.mtf .chart{margin:0}
.tfpick{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 4px}
.tfpick button{border:1px solid var(--line);padding:7px 14px;border-radius:99px;font-family:var(--ff-m);font-size:12.5px;color:var(--tx-2);transition:.16s}
.tfpick button.on{border-color:var(--gold);color:var(--gold);background:rgba(232,180,74,.07)}

.gal{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 6px}
.gal button{border:1px solid var(--line);padding:7px 13px;border-radius:8px;font-size:12.8px;color:var(--tx-2);transition:.16s}
.gal button:hover{border-color:var(--line-2);color:var(--tx)}
.gal button.on{border-color:var(--gold);color:var(--gold);background:rgba(232,180,74,.07)}

.layerlist{display:grid;gap:7px}
.layerlist .li{display:grid;grid-template-columns:22px 1fr;gap:9px;align-items:center;padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.3px;color:var(--tx-3);transition:.25s;background:var(--panel)}
.layerlist .li .ic{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:10px}
.layerlist .li.on{color:var(--tx);border-color:#1E4A38;background:rgba(43,191,123,.05)}
.layerlist .li.on .ic{background:var(--bull);border-color:var(--bull);color:#06170F}
.conf-wrap{display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start}

/* ---------- ITERACIÓN 2 ---------- */
/* transporte de reproducción */
.play{display:flex;align-items:center;gap:6px;padding:9px 14px;border-top:1px solid var(--line);background:var(--panel-2);flex-wrap:wrap}
.play button{border:1px solid var(--line);background:var(--panel);color:var(--tx-2);border-radius:7px;padding:5px 9px;font-size:12px;font-family:var(--ff-m);transition:.15s;min-width:30px}
.play button:hover{border-color:var(--line-2);color:var(--tx)}
.play .main{padding:5px 14px;border-color:var(--gold-dim);color:var(--gold);font-family:var(--ff-b);font-size:12.6px}
.play .main.playing{background:rgba(232,180,74,.1)}
.play .pos{font-family:var(--ff-m);font-size:11px;color:var(--tx-3);margin-left:6px;white-space:nowrap}
.play .sp{flex:1;min-width:4px}
.play .spd{display:flex;gap:3px}
.play .spd button{padding:5px 8px;font-size:11px;min-width:0}
.play .spd button.on{border-color:var(--gold-dim);color:var(--gold)}
.pauseq{border-top:1px solid var(--line);background:linear-gradient(180deg,rgba(76,194,224,.07),transparent);padding:14px 16px 15px;animation:fade .3s both}
.pauseq .pq-h{font-family:var(--ff-m);font-size:10.5px;letter-spacing:.1em;color:var(--info);text-transform:uppercase;margin-bottom:10px}
.pauseq .pq-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.pauseq .pq-g span{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.8px;color:var(--tx-2);background:var(--panel)}
.pauseq .pq-t{margin:11px 0 0;font-size:13.4px;color:var(--tx);line-height:1.5}
.pauseq .pq-a{margin:10px 0 0;font-size:13.4px;line-height:1.55;color:var(--tx-2);border-left:2px solid var(--gold);padding-left:11px}
.pauseq .pq-b{display:flex;gap:8px;margin-top:12px}
.pauseq .pq-b button{border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:12.5px;color:var(--tx-2)}
.pauseq .pq-b button:last-child{border-color:var(--gold-dim);color:var(--gold)}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* modo desnudo */
.reveal{display:none;gap:6px;flex-wrap:wrap}
body.naked .reveal{display:flex}
body.naked .chart-head .tools{display:none}
.reveal button{border:1px dashed var(--line-2);border-radius:99px;padding:4px 11px;font-size:11.6px;color:var(--tx-3);font-family:var(--ff-m);transition:.15s}
.reveal button:hover{color:var(--tx);border-color:var(--tx-3)}
.reveal button.on{border-style:solid;border-color:var(--gold-dim);color:var(--gold);background:rgba(232,180,74,.08)}
.reveal .all{border-color:var(--line)}
#nakedBtn.nk{border-color:var(--liq);color:var(--liq);background:rgba(139,123,240,.1)}
body.naked .note,body.naked .qa,body.naked .vs-pts{opacity:1}

/* comparación lado a lado */
.vswrap{margin:22px 0 8px}
.vsblk{display:grid;grid-template-columns:1fr 34px 1fr;align-items:stretch;gap:0}
.vs-col{border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
.vs-col .chart{margin:0;border:0;border-radius:0;background:transparent}
.vs-col.bull{border-color:#1E4A38}.vs-col.bear{border-color:#5A2327}.vs-col.gold{border-color:var(--gold-dim)}
.vs-h{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.vs-h .tag{font-family:var(--ff-m);font-size:10px;letter-spacing:.11em;color:var(--tx-3);text-transform:uppercase;display:block;margin-bottom:4px}
.vs-col.bull .vs-h .tag{color:var(--bull)}.vs-col.bear .vs-h .tag{color:var(--bear)}.vs-col.gold .vs-h .tag{color:var(--gold)}
.vs-h h5{font-size:14.6px}
.vs-sep{display:grid;place-items:center;position:relative}
.vs-sep span{font-family:var(--ff-m);font-size:10.5px;color:var(--tx-3);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 6px;z-index:1}
.vs-sep::before{content:"";position:absolute;top:14px;bottom:14px;width:1px;background:var(--line)}
.vs-pts{list-style:none;margin:0;padding:2px 14px 14px;display:grid;gap:6px}
.vs-pts li{position:relative;padding-left:15px;font-size:13.2px;color:var(--tx-2);line-height:1.48}
.vs-pts li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--tx-3)}
.vs-col.bull .vs-pts li::before{background:var(--bull)}.vs-col.bear .vs-pts li::before{background:var(--bear)}.vs-col.gold .vs-pts li::before{background:var(--gold)}

/* EVENTO ≠ ENTRADA */
.neq{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:9px;margin:20px 0 8px}
.neq-i{border:1px solid var(--line);border-radius:var(--r-m);padding:13px 14px;background:var(--panel)}
.neq-r{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
.neq-r .a{font-family:var(--ff-m);font-size:12.4px;color:var(--gold);border:1px solid var(--gold-dim);border-radius:6px;padding:3px 8px;letter-spacing:.04em}
.neq-r .op{font-size:17px;color:var(--bear);font-weight:700}
.neq-r .b{font-family:var(--ff-m);font-size:12.4px;color:var(--tx-3);border:1px dashed var(--line-2);border-radius:6px;padding:3px 8px}
.neq-i p{margin:0;font-size:12.9px;color:var(--tx-2);line-height:1.5}

/* hechos / inferencias / incógnitas */
.factg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0 8px}
.fc{border:1px solid var(--line);border-radius:var(--r-m);padding:13px 14px;background:var(--panel)}
.fc h5{display:flex;align-items:center;gap:8px;font-size:13.4px;margin-bottom:9px}
.fc h5 i{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700}
.fc.f{border-color:#1E4A38}.fc.f h5 i{background:rgba(43,191,123,.16);color:var(--bull)}.fc.f h5{color:var(--bull)}
.fc.i{border-color:var(--gold-dim)}.fc.i h5 i{background:rgba(232,180,74,.16);color:var(--gold)}.fc.i h5{color:var(--gold)}
.fc.u{border-color:#3A2F55}.fc.u h5 i{background:rgba(139,123,240,.16);color:var(--liq)}.fc.u h5{color:var(--liq)}
.fc ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.fc li{font-size:12.9px;color:var(--tx-2);line-height:1.48;padding-left:12px;position:relative}
.fc li::before{content:"";position:absolute;left:0;top:7px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.4}

/* escenarios condicionales */
.scen{margin:20px 0 8px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);overflow:hidden}
.scen-tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.scen-tabs button{flex:1;min-width:150px;display:flex;align-items:center;gap:9px;padding:12px 14px;font-size:13.2px;color:var(--tx-3);border-right:1px solid var(--line);text-align:left;transition:.17s}
.scen-tabs button b{width:21px;height:21px;border-radius:6px;display:grid;place-items:center;background:var(--panel-2);font-family:var(--ff-m);font-size:11.5px;flex:0 0 auto}
.scen-tabs button.on{color:var(--tx);background:var(--panel-2)}
.scen-tabs button.on b{background:var(--gold);color:#12161D}
.scen-body .chart{margin:0;border:0;border-radius:0;background:transparent}
.scen-txt{padding:2px 16px 16px;display:flex;gap:12px;align-items:flex-start}
.scen-txt .lv{font-family:var(--ff-m);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:4px 9px;color:var(--tx-3);white-space:nowrap;margin-top:2px}
.scen-txt p{margin:0;font-size:13.5px;line-height:1.55;color:var(--tx-2)}
.scen-txt.bull .lv{color:var(--bull);border-color:#1E4A38}
.scen-txt.warn .lv{color:var(--warn);border-color:#5A3E1A}
.scen-txt.bear .lv{color:var(--bear);border-color:#5A2327}

/* niveles de dificultad */
.lvtabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 10px}
.lvtabs button{border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:12.5px;color:var(--tx-2);display:flex;align-items:center;gap:8px;transition:.16s}
.lvtabs button .d{font-family:var(--ff-m);font-size:10px;color:var(--tx-3)}
.lvtabs button.on{border-color:var(--gold);color:var(--gold);background:rgba(232,180,74,.07)}
.lvtabs button.on .d{color:var(--gold)}

/* ejercicio ¿qué sabemos? */
.kn{display:grid;gap:7px;margin:14px 0 4px}
.kn label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.4px;color:var(--tx-2);background:var(--panel);cursor:pointer;transition:.16s;line-height:1.45}
.kn label:hover{border-color:var(--line-2)}
.kn input{appearance:none;width:16px;height:16px;border:1.5px solid var(--line-2);border-radius:4px;flex:0 0 auto;margin-top:1px;transition:.16s;position:relative}
.kn input:checked{background:var(--gold);border-color:var(--gold)}
.kn input:checked::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:#12161D;font-weight:700}
.kn label.ok{border-color:#1E4A38;background:rgba(43,191,123,.06)}
.kn label.bad{border-color:#5A2327;background:rgba(229,72,77,.06)}
.kn label .why{display:block;font-size:12.2px;color:var(--tx-3);margin-top:4px}

/* escala ATR */
.atrscale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin:16px 0 8px}
.atrscale div{border:1px solid var(--line);border-radius:var(--r-m);padding:11px 13px;background:var(--panel)}
.atrscale b{display:block;font-family:var(--ff-m);font-size:12px;color:var(--warn);letter-spacing:.05em}
.atrscale span{display:block;font-family:var(--ff-d);font-size:19px;margin:3px 0 2px}
.atrscale i{font-style:normal;font-size:12.2px;color:var(--tx-3)}

/* familias de indicadores */
.fam-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:9px;margin:18px 0 8px}
.fam-g>div{border:1px solid var(--line);border-left:3px solid var(--c);border-radius:var(--r-m);padding:12px 14px;background:var(--panel)}
.fam-g h5{font-size:13.6px;color:var(--c);margin-bottom:6px}
.fam-g .ls{font-family:var(--ff-m);font-size:11.4px;color:var(--tx-2);line-height:1.5;margin-bottom:7px}
.fam-g p{margin:0;font-size:12.4px;color:var(--tx-3);line-height:1.45}

/* zoom fractal */
.zoom{margin:20px 0;border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);overflow:hidden}
.zoom-tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.zoom-tabs button{flex:1;min-width:80px;padding:11px 12px;font-family:var(--ff-m);font-size:12.6px;color:var(--tx-3);border-right:1px solid var(--line);transition:.16s}
.zoom-tabs button.on{color:var(--gold);background:var(--panel-2)}
.zoom-body .chart{margin:0;border:0;border-radius:0;background:transparent}
.zoom-txt{padding:2px 16px 14px;display:flex;gap:12px;align-items:flex-start}
.zoom-txt .lv{font-family:var(--ff-m);font-size:10.5px;color:var(--gold);border:1px solid var(--gold-dim);border-radius:99px;padding:4px 10px;white-space:nowrap;margin-top:2px}
.zoom-txt p{margin:0;font-size:13.5px;line-height:1.55;color:var(--tx-2)}
.zoom-bar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.zoom-bar button{border:1px solid var(--gold-dim);color:var(--gold);background:rgba(232,180,74,.07);border-radius:99px;padding:7px 16px;font-size:12.6px}
.zoom-bar .sec{border-color:var(--line);color:var(--tx-2);background:none}
.zoom-bar button:disabled{opacity:.4}
.modes{margin:18px 0}
.modes-body .grid{margin-top:12px}

/* examen final */
.exq{font-size:13.4px;color:var(--tx-2);margin:0 0 10px;line-height:1.5}
.exam-out .rp-c{margin-bottom:0}
.quiz-top .lvb{font-family:var(--ff-m);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-dim);border-radius:99px;padding:2px 8px;margin-left:9px}
/* examen final */
.exam{border:1px solid var(--gold-dim);border-radius:var(--r-l);background:var(--panel);overflow:hidden;margin:22px 0}
.exam-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(180deg,rgba(232,180,74,.08),transparent)}
.exam-h h4{font-size:15px}
.exam-h .st{font-family:var(--ff-m);font-size:11px;color:var(--tx-3);margin-left:auto}
.exam-step{border-top:1px solid var(--line)}
.exam-step > h5{display:flex;align-items:center;gap:11px;padding:12px 16px;font-size:13.6px;color:var(--tx-2);cursor:pointer;transition:.16s}
.exam-step > h5:hover{background:var(--panel-2)}
.exam-step > h5 .n{font-family:var(--ff-m);font-size:10.5px;color:var(--gold);border:1px solid var(--gold-dim);border-radius:5px;padding:2px 6px}
.exam-step > h5 .c{margin-left:auto;font-family:var(--ff-m);font-size:10.5px;color:var(--tx-3)}
.exam-step .bd{padding:0 16px 14px;display:none}
.exam-step.open .bd{display:block}
.exam-res{padding:16px;border-top:1px solid var(--line);background:var(--panel-2)}
.exam-res .rg{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.exam-bar{display:flex;gap:9px;padding:14px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.exam-bar button{border:1px solid var(--gold-dim);color:var(--gold);border-radius:99px;padding:8px 18px;font-size:13px;background:rgba(232,180,74,.07)}
.exam-bar button.sec{border-color:var(--line);color:var(--tx-2);background:none}

/* laboratorio por capas */
.llab{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start;margin:22px 0 10px}
.llab .chart{margin:0}
.llab-side{border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);overflow:hidden}
.llab-q{padding:13px 15px;border-bottom:1px solid var(--line);font-family:var(--ff-d);font-size:13.6px;color:var(--tx)}
.llab-list{padding:10px 12px;display:grid;gap:6px;max-height:420px;overflow:auto}
.ll{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--bg-2);opacity:.5;transition:.25s}
.ll.on{opacity:1;border-color:#2E3746}
.ll-h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx-2)}
.ll-h b{font-weight:500;color:var(--tx)}
.ll-h .ic{width:18px;height:18px;border-radius:5px;background:var(--panel-2);display:grid;place-items:center;font-size:10px;font-family:var(--ff-m);color:var(--tx-3);flex:0 0 auto}
.ll.on .ic{background:rgba(43,191,123,.16);color:var(--bull)}
.ll-h .tg{margin-left:auto;font-family:var(--ff-m);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--bull);border:1px solid #1E4A38;border-radius:99px;padding:2px 6px}
.ll-h .tg.r{color:var(--tx-3);border-color:var(--line)}
.ll p{margin:7px 0 0;font-size:12.4px;color:var(--tx-2);line-height:1.48}
.llab-bar{display:flex;gap:8px;padding:11px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.llab-bar button{border:1px solid var(--gold-dim);color:var(--gold);background:rgba(232,180,74,.07);border-radius:99px;padding:7px 14px;font-size:12.6px;flex:1}
.llab-bar button:disabled{opacity:.45;border-color:var(--line);color:var(--tx-3);background:none}
.llab-bar .sec{border-color:var(--line);color:var(--tx-2);background:none;flex:0 0 auto}

/* medidor de tramos */
.meas{padding:12px}
.ms-rows{display:grid;gap:5px;margin-bottom:11px}
.ms-rows div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.6px;color:var(--tx-3);border-bottom:1px dashed var(--line);padding-bottom:4px}
.ms-rows b{font-family:var(--ff-m);font-size:12.8px;color:var(--tx);font-weight:500}
.ms-v{border:1px solid var(--line);border-left:2px solid var(--tx-3);border-radius:8px;padding:10px 12px;background:var(--bg-2)}
.ms-v h5{font-size:13px;color:var(--tx-2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--ff-m)}
.ms-v p{margin:0;font-size:12.6px;color:var(--tx-2);line-height:1.5}
.ms-v.bull{border-left-color:var(--bull)}.ms-v.bull h5{color:var(--bull)}
.ms-v.warn{border-left-color:var(--warn)}.ms-v.warn h5{color:var(--warn)}

/* ¿qué sabemos? */
.knblk{border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);padding:15px;margin:18px 0}
.kn-q{font-family:var(--ff-d);font-size:14.4px;margin-bottom:4px}
.kn-bar{margin-top:11px}
.kn-bar button{border:1px solid var(--gold-dim);color:var(--gold);background:rgba(232,180,74,.07);border-radius:99px;padding:8px 18px;font-size:12.8px}
.kn-res{margin-top:6px}
.kn-res .factg{margin-bottom:0}

/* referencia al bot */
.botref{border:1px dashed var(--line-2);border-radius:var(--r-m);padding:12px 14px;margin:20px 0 8px;background:rgba(76,194,224,.03)}
.botref-h{font-family:var(--ff-m);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--info);margin-bottom:9px}
.botref-g{display:grid;gap:6px}

<body>

<div class="app">

    </header>

</div>
<div class="panel-float" id="pfloat"></div>
<script>
/* ============================================================
   INDICADORES — todos se calculan a partir de la serie OHLC
   real del gráfico. Nunca son líneas dibujadas a mano.
   Cada función devuelve un array alineado con las velas,
   con null en las posiciones donde todavía no hay dato.
   ============================================================ */
const IND = {
  sma(cd, n, sel = k => k.c) {
    const o = new Array(cd.length).fill(null); let s = 0;
    for (let i = 0; i < cd.length; i++) {
      s += sel(cd[i]); if (i >= n) s -= sel(cd[i - n]);
      if (i >= n - 1) o[i] = s / n;
    }
    return o;
  },
  ema(cd, n, sel = k => k.c) {
    const o = new Array(cd.length).fill(null), a = 2 / (n + 1);
    let prev = null, s = 0;
    for (let i = 0; i < cd.length; i++) {
      const v = sel(cd[i]);
      if (i < n - 1) { s += v; continue; }
      if (i === n - 1) { s += v; prev = s / n; o[i] = prev; continue; }
      prev = v * a + prev * (1 - a); o[i] = prev;
    }
    return o;
  },
  rsi(cd, n = 14) {
    const o = new Array(cd.length).fill(null);
    let ag = 0, al = 0;
    for (let i = 1; i < cd.length; i++) {
      const d = cd[i].c - cd[i - 1].c, g = Math.max(0, d), l = Math.max(0, -d);
      if (i <= n) { ag += g / n; al += l / n; if (i === n) o[i] = 100 - 100 / (1 + (al ? ag / al : 100)); continue; }
      ag = (ag * (n - 1) + g) / n; al = (al * (n - 1) + l) / n;
      o[i] = 100 - 100 / (1 + (al ? ag / al : 100));
    }
    return o;
  },
  stoch(cd, n = 14, d = 3, sm = 3) {
    const raw = new Array(cd.length).fill(null);
    for (let i = n - 1; i < cd.length; i++) {
      let hh = -Infinity, ll = Infinity;
      for (let k = i - n + 1; k <= i; k++) { hh = Math.max(hh, cd[k].h); ll = Math.min(ll, cd[k].l); }
      raw[i] = hh === ll ? 50 : (cd[i].c - ll) / (hh - ll) * 100;
    }
    const K = IND._smooth(raw, sm), D = IND._smooth(K, d);
    return { k: K, d: D };
  },
  _smooth(a, n) {
    const o = new Array(a.length).fill(null);
    for (let i = 0; i < a.length; i++) {
      let s = 0, c = 0;
      for (let k = i - n + 1; k <= i; k++) if (k >= 0 && a[k] != null) { s += a[k]; c++; }
      if (c === n) o[i] = s / n;
    }
    return o;
  },
  tr(cd) {
    return cd.map((k, i) => i === 0 ? k.h - k.l : Math.max(k.h - k.l, Math.abs(k.h - cd[i - 1].c), Math.abs(k.l - cd[i - 1].c)));
  },
  atr(cd, n = 14) {
    const t = IND.tr(cd), o = new Array(cd.length).fill(null);
    let s = 0;
    for (let i = 0; i < cd.length; i++) {
      if (i < n) { s += t[i]; if (i === n - 1) o[i] = s / n; continue; }
      o[i] = (o[i - 1] * (n - 1) + t[i]) / n;
    }
    return o;
  },
  adx(cd, n = 14) {
    const len = cd.length, t = IND.tr(cd);
    const pDM = new Array(len).fill(0), mDM = new Array(len).fill(0);
    for (let i = 1; i < len; i++) {
      const up = cd[i].h - cd[i - 1].h, dn = cd[i - 1].l - cd[i].l;
      pDM[i] = up > dn && up > 0 ? up : 0;
      mDM[i] = dn > up && dn > 0 ? dn : 0;
    }
    const sm = arr => { const o = new Array(len).fill(null); let s = 0; for (let i = 1; i < len; i++) { if (i <= n) { s += arr[i]; if (i === n) o[i] = s; continue; } o[i] = o[i - 1] - o[i - 1] / n + arr[i]; } return o; };
    const st = sm(t), sp = sm(pDM), sm2 = sm(mDM);
    const pdi = new Array(len).fill(null), mdi = new Array(len).fill(null), dx = new Array(len).fill(null), adx = new Array(len).fill(null);
    for (let i = 0; i < len; i++) {
      if (st[i] == null || !st[i]) continue;
      pdi[i] = 100 * sp[i] / st[i]; mdi[i] = 100 * sm2[i] / st[i];
      const den = pdi[i] + mdi[i];
      dx[i] = den ? 100 * Math.abs(pdi[i] - mdi[i]) / den : 0;
    }
    let s = 0, c = 0;
    for (let i = 0; i < len; i++) {
      if (dx[i] == null) continue;
      c++; s += dx[i];
      if (c === n) adx[i] = s / n;
      else if (c > n) adx[i] = (adx[i - 1] * (n - 1) + dx[i]) / n;
    }
    return { adx, pdi, mdi };
  },
  bb(cd, n = 20, k = 2) {
    const mid = IND.sma(cd, n), up = new Array(cd.length).fill(null), dn = new Array(cd.length).fill(null);
    for (let i = n - 1; i < cd.length; i++) {
      let s = 0; for (let j = i - n + 1; j <= i; j++) s += Math.pow(cd[j].c - mid[i], 2);
      const sd = Math.sqrt(s / n);
      up[i] = mid[i] + k * sd; dn[i] = mid[i] - k * sd;
    }
    const w = mid.map((m, i) => m != null && up[i] != null ? (up[i] - dn[i]) / m * 100 : null);
    return { mid, up, dn, w };
  },
  donchian(cd, n = 20) {
    const up = new Array(cd.length).fill(null), dn = new Array(cd.length).fill(null), mid = new Array(cd.length).fill(null);
    for (let i = n - 1; i < cd.length; i++) {
      let hh = -Infinity, ll = Infinity;
      for (let k = i - n + 1; k <= i; k++) { hh = Math.max(hh, cd[k].h); ll = Math.min(ll, cd[k].l); }
      up[i] = hh; dn[i] = ll; mid[i] = (hh + ll) / 2;
    }
    return { up, dn, mid };
  },
  /* VWAP de sesión: se reinicia en los índices indicados */
  vwap(cd, resets = [0]) {
    const o = new Array(cd.length).fill(null), R = new Set(resets);
    let pv = 0, vv = 0;
    for (let i = 0; i < cd.length; i++) {
      if (R.has(i)) { pv = 0; vv = 0; }
      const tp = (cd[i].h + cd[i].l + cd[i].c) / 3;
      /* proxy de volumen: rango de la vela (a mayor rango, más actividad) */
      const v = Math.max(1e-6, cd[i].h - cd[i].l);
      pv += tp * v; vv += v; o[i] = pv / vv;
    }
    return o;
  },
  /* utilidades de lectura */
  slope(a, i, back = 5) {
    if (i < back || a[i] == null || a[i - back] == null) return null;
    return (a[i] - a[i - back]) / back;
  },
  last(a) { for (let i = a.length - 1; i >= 0; i--) if (a[i] != null) return a[i]; return null; }
};

/* medidas de impulso / retroceso entre dos índices de la serie */
function measure(cd, i1, i2) {
  const a = cd[i1], b = cd[i2];
  const p1 = a.c, p2 = b.c;
  const d = p2 - p1, n = Math.abs(i2 - i1) || 1;
  const atr = IND.atr(cd, 14);
  const at = atr[i2] ?? IND.last(atr) ?? 1;
  return {
    usd: d, pct: d / p1 * 100, bars: n,
    speed: d / n, atr: at, atrN: d / at
  };
}
/* ============================================================
   MOTOR DE GRÁFICOS — velas SVG, overlays, pasos y toggles
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const el = h => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const C = { bull: '#2BBF7B', bear: '#E5484D', gold: '#E8B44A', liq: '#8B7BF0', info: '#4CC2E0', warn: '#F0983C', mut: '#6B7686', tx: '#DDE3EC', line: '#232A35' };

/* ---------- generador determinista de series ---------- */
function rnd(seed) { let s = (Math.abs(seed) * 9301 + 49297) % 233280 || 7; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }

function legOf(i, pts) {
  for (let k = 0; k < pts.length - 1; k++) if (i >= pts[k][0] && i <= pts[k + 1][0]) return { a: pts[k][1], b: pts[k + 1][1] };
  return { a: pts[0][1], b: pts[pts.length - 1][1] };
}

/* S(pts, seed, opt) — pts: [[índice, precio, 'H'|'L'|null], ...] */
function S(pts, seed = 3, opt = {}) {
  const r = rnd(seed), n = pts[pts.length - 1][0] + 1, path = new Array(n);
  for (let k = 0; k < pts.length - 1; k++) {
    const [ia, pa] = pts[k], [ib, pb] = pts[k + 1], span = (ib - ia) || 1;
    for (let i = ia; i <= ib; i++) {
      const t = (i - ia) / span;
      const e = opt.linear ? t : (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
      path[i] = pa + (pb - pa) * e;
    }
  }
  let lo = Infinity, hi = -Infinity;
  pts.forEach(p => { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); });
  const amp = (hi - lo) || 1;
  const nz = (opt.noise ?? .16) * amp, wk = (opt.wick ?? .10) * amp, m = (opt.pad ?? .025) * amp;
  const mk = {}; pts.forEach(p => { if (p[2]) mk[p[0]] = { p: p[1], k: p[2] }; });
  const out = []; let prev = path[0];
  for (let i = 0; i < n; i++) {
    const leg = legOf(i, pts), cap = Math.max(leg.a, leg.b), flo = Math.min(leg.a, leg.b);
    let c = path[i] + (r() - .5) * nz, o = prev, h, l;
    const w = mk[i];
    if (w && w.k === 'H') {
      h = w.p; c = w.p - (.2 + r() * .5) * wk; o = clamp(o, c - wk, w.p - .1 * wk); l = Math.min(o, c) - r() * wk * .6;
    } else if (w && w.k === 'L') {
      l = w.p; c = w.p + (.2 + r() * .5) * wk; o = clamp(o, w.p + .1 * wk, c + wk); h = Math.max(o, c) + r() * wk * .6;
    } else {
      c = clamp(c, flo + m, cap - m); o = clamp(o, flo + m, cap - m);
      h = Math.max(o, c) + r() * wk; l = Math.min(o, c) - r() * wk;
      h = Math.min(h, cap - m * .4); l = Math.max(l, flo + m * .4);
      h = Math.max(h, Math.max(o, c) + amp * .004); l = Math.min(l, Math.min(o, c) - amp * .004);
    }
    out.push({ o, h, l, c }); prev = c;
  }
  return out;
}
/* X(rows) — velas explícitas [o,h,l,c] */
const X = rows => rows.map(([o, h, l, c]) => ({ o, h, l, c }));
/* concatena series encadenando el precio */
function join(a, b) { const d = a[a.length - 1].c - b[0].o; return a.concat(b.map(k => ({ o: k.o + d, h: k.h + d, l: k.l + d, c: k.c + d }))); }


/* ============================================================
   RS(pts, seed, opt) — serie REALISTA
   Igual que S() pero con retrocesos internos, consolidaciones,
   mechas de tamaño variable y falsas rupturas opcionales.
   opt: { rough 0..1, wick, fakes:[{i,h|l}], flat:[[a,b]], pad }
   ============================================================ */
function RS(pts, seed = 5, opt = {}) {
  const r = rnd(seed), n = pts[pts.length - 1][0] + 1;
  const rough = opt.rough ?? (opt.noise != null ? clamp(opt.noise * 3.4, .3, 1.15) : .58);
  let lo = Infinity, hi = -Infinity;
  pts.forEach(p => { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); });
  const amp = (hi - lo) || 1;

  /* trayectoria base suavizada */
  const base = new Array(n);
  for (let k = 0; k < pts.length - 1; k++) {
    const [ia, pa] = pts[k], [ib, pb] = pts[k + 1], span = (ib - ia) || 1;
    for (let i = ia; i <= ib; i++) {
      const t = (i - ia) / span;
      const e = opt.linear ? t : (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
      base[i] = pa + (pb - pa) * e;
    }
  }
  /* ondas de retroceso + deriva: el precio nunca va en línea recta */
  const ph1 = r() * 6.28, ph2 = r() * 6.28, f1 = 1.4 + r() * 1.8, f2 = 3.6 + r() * 3.4;
  const flats = opt.flat || [];
  const inFlat = i => flats.some(([a, b]) => i >= a && i <= b);
  let drift = 0;
  const path = new Array(n);
  for (let i = 0; i < n; i++) {
    const leg = legOf(i, pts);
    const sp = Math.abs(leg.b - leg.a) || amp * .28;
    const t = n > 1 ? i / (n - 1) : 0;
    const q = inFlat(i) ? .35 : 1;
    drift = drift * .74 + (r() - .5) * sp * .11 * rough * q;
    const w = (Math.sin(t * 6.28 * f1 + ph1) * .13 + Math.sin(t * 6.28 * f2 + ph2) * .055) * sp * rough * q + drift;
    path[i] = base[i] + w;
  }
  const mk = {}; pts.forEach(p => { if (p[2]) mk[p[0]] = { p: p[1], k: p[2] }; });
  const fk = {}; (opt.fakes || []).forEach(f => { fk[f.i] = f; });
  const m = (opt.pad ?? .018) * amp;
  const out = []; let prev = path[0];
  for (let i = 0; i < n; i++) {
    const leg = legOf(i, pts), cap = Math.max(leg.a, leg.b), flo = Math.min(leg.a, leg.b);
    const w = mk[i], f = fk[i];
    /* carácter de la vela: la mayoría normales, alguna con mecha larga */
    const mood = r(), body = .35 + r() * .9;
    const wk = amp * (opt.wick ?? .055) * (.3 + mood * mood * 2.6) * (inFlat(i) ? .7 : 1);
    let o = prev, c, h, l;
    if (w && w.k === 'H') {
      h = w.p; c = w.p - (.25 + r() * .55) * wk * 1.5;
      o = clamp(o, c - wk * 1.4, w.p - .06 * wk); l = Math.min(o, c) - r() * wk * .8;
    } else if (w && w.k === 'L') {
      l = w.p; c = w.p + (.25 + r() * .55) * wk * 1.5;
      o = clamp(o, w.p + .06 * wk, c + wk * 1.4); h = Math.max(o, c) + r() * wk * .8;
    } else {
      c = clamp(prev + (path[i] - prev) * body + (r() - .5) * wk * .5, flo + m, cap - m);
      o = clamp(o, flo + m, cap - m);
      h = Math.max(o, c) + r() * wk; l = Math.min(o, c) - r() * wk;
      h = Math.min(h, cap - m * .25); l = Math.max(l, flo + m * .25);
      h = Math.max(h, Math.max(o, c) + amp * .003); l = Math.min(l, Math.min(o, c) - amp * .003);
    }
    if (f) { /* falsa ruptura: la mecha pincha el nivel y el cuerpo vuelve */
      if (f.h != null) { h = f.h; c = Math.min(c, f.h - wk * .9); o = Math.min(o, f.h - wk * .3); l = Math.min(l, Math.min(o, c) - amp * .003); }
      if (f.l != null) { l = f.l; c = Math.max(c, f.l + wk * .9); o = Math.max(o, f.l + wk * .3); h = Math.max(h, Math.max(o, c) + amp * .003); }
    }
    out.push({ o, h, l, c }); prev = c;
  }
  return out;
}

/* capas para el MODO DESNUDO */
const LAY = {
  swing: 'str', zig: 'str', trend: 'str', bracket: 'str',
  level: 'lvl', zone: 'lvl', stops: 'liq', vzone: 'liq',
  fvg: 'evt', hi: 'evt', mark: 'evt',
  line: 'ind', ribbon: 'ind',
  note: 'int', band: 'int', txt: 'int'
};
const layerOf = o => o.L || LAY[o.k] || 'evt';
const NAKED = () => document.body.classList.contains('naked');
const REVL = [['str', 'estructura'], ['lvl', 'niveles'], ['liq', 'liquidez'], ['evt', 'eventos'], ['ind', 'indicadores'], ['int', 'interpretación']];
/* grupo estándar de invalidación */
const INVAL = { id: 'inv', label: 'Mostrar invalidación', on: false };

/* ---------- helpers SVG ---------- */
function pill(x, y, text, color, anchor = 'start', o = {}) {
  const fs = o.fs || 11, w = String(text).length * fs * .6 + 12, h = fs + 9;
  const rx = anchor === 'start' ? x : anchor === 'end' ? x - w : x - w / 2;
  return `<g class="${o.cls || ''}"><rect x="${rx.toFixed(1)}" y="${(y - h / 2).toFixed(1)}" width="${w.toFixed(1)}" height="${h}" rx="5" fill="${o.bg || '#0B0E14'}" stroke="${color}" stroke-opacity="${o.so ?? .5}"/><text x="${(rx + w / 2).toFixed(1)}" y="${y.toFixed(1)}" fill="${color}" font-size="${fs}" text-anchor="middle" dominant-baseline="central" font-family="JetBrains Mono, monospace" font-weight="500">${esc(text)}</text></g>`;
}
function txt(x, y, t, color, anchor = 'start', o = {}) {
  return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" fill="${color}" font-size="${o.fs || 11.5}" text-anchor="${anchor}" dominant-baseline="${o.bl || 'central'}" font-family="${o.ff || 'JetBrains Mono, monospace'}" font-weight="${o.fw || 500}" opacity="${o.op ?? 1}">${esc(t)}</text>`;
}

/* ---------- gráfico ---------- */
const REG = [];
function mkChart(spec) {
  const id = 'c' + Math.random().toString(36).slice(2, 8);
  const groups = spec.groups || [];
  const N0 = spec.candles.length;
  const st = {
    step: 0, off: new Set(groups.filter(g => g.on === false).map(g => g.id)), prevUpto: 0,
    rev: new Set(), playing: false, spd: 1,
    upto: spec.play ? clamp(spec.playFrom ?? Math.round(N0 * .42), 2, N0) : null
  };
  const hasOv = (spec.ov || []).length > 0 && spec.naked !== false;

  const fig = el(`<figure class="chart ${spec.flat ? 'flat' : ''}">
    ${spec.title || spec.tf || groups.length || hasOv ? `<div class="chart-head">
      ${spec.title ? `<span class="t">${esc(spec.title)}</span>` : ''}
      ${spec.tf ? `<span class="tf">${esc(spec.tf)}</span>` : ''}
      <span class="sp"></span>
      <div class="tools">${groups.map(g => `<button class="tgl ${g.on === false ? '' : 'on'}" data-g="${g.id}"><span class="sw"></span>${esc(g.label)}</button>`).join('')}</div>
      ${hasOv ? `<div class="reveal">${REVL.map(([k, l]) => `<button data-r="${k}">Revelar ${l}</button>`).join('')}<button data-r="*" class="all">Todo</button></div>` : ''}
    </div>` : ''}
    <div class="chart-svg" id="${id}"><div class="readout"></div></div>
    ${spec.play ? `<div class="play">
      <button data-p="s" title="Al principio">&#9198;</button>
      <button data-p="b" title="Una vela atrás">&#9664;</button>
      <button data-p="t" class="main">&#9654; Reproducir mercado</button>
      <button data-p="f" title="Una vela adelante">&#9654;</button>
      <button data-p="e" title="Hasta el final">&#9197;</button>
      <span class="pos"></span><span class="sp"></span>
      <span class="spd">${[.5, 1, 2].map(v => `<button data-s="${v}" class="${v === 1 ? 'on' : ''}">${v}&#215;</button>`).join('')}</span>
    </div><div class="pauseq" hidden></div>` : ''}
    ${spec.caption ? `<figcaption>${spec.caption}</figcaption>` : ''}
    ${spec.steps ? `<div class="stepper">
      <div class="step-nav">
        <button data-prev>← Anterior</button>
        <div class="dots">${spec.steps.map((_, i) => `<i data-d="${i}"></i>`).join('')}</div>
        <button data-next>Siguiente →</button>
      </div>
      <div class="step-txt"><span class="num"></span><div><h5></h5><p></p></div></div>
    </div>` : ''}
  </figure>`);

  const box = fig.querySelector('.chart-svg');
  const readout = box.querySelector('.readout');
  let cross = null, sc = null;

  function visible(o) {
    if (o.g && st.off.has(o.g)) return false;
    if (hasOv && NAKED() && !st.rev.has(layerOf(o))) return false;
    if (spec.play) {
      const at = o.at != null ? o.at : (spec.autoAt === false ? -1 : (o.i ?? o.to ?? o.i2 ?? o.from ?? 0));
      if (at > st.upto - 1) return false;
    }
    if (spec.steps) {
      if (o.only) return o.only.includes(st.step);
      if (o.s != null && st.step < o.s) return false;
      if (o.e != null && st.step > o.e) return false;
    }
    return true;
  }

  function render(anim) {
    const W = Math.max(280, box.clientWidth - 12);
    const H = spec.h || Math.round(clamp(W * .5, 235, 400));
    const PN = (spec.panes || []).filter(pn => (!pn.g || !st.off.has(pn.g)) && !(hasOv && NAKED() && !st.rev.has('ind')));
    const PH = PN.map(pn => pn.h || (W < 520 ? 74 : 88)), PGAP = 9;
    const TOT = H + PH.reduce((a, b) => a + b + PGAP, 0);
    const cd = spec.candles, n = cd.length;
    const padL = spec.padL ?? 10, padR = spec.padR ?? (W < 460 ? 54 : 88), padT = spec.padT ?? 22, padB = 20;
    let lo = Infinity, hi = -Infinity;
    cd.forEach(k => { lo = Math.min(lo, k.l); hi = Math.max(hi, k.h); });
    (spec.ov || []).forEach(o => {
      [o.p, o.p1, o.p2, o.py].forEach(v => { if (typeof v === 'number') { lo = Math.min(lo, v); hi = Math.max(hi, v); } });
      [o.data, o.up, o.dn].forEach(arr => {
        if (Array.isArray(arr)) arr.forEach(v => { if (typeof v === 'number') { lo = Math.min(lo, v); hi = Math.max(hi, v); } });
      });
    });
    const rg = (hi - lo) || 1;
    lo -= rg * (spec.padLo ?? .10); hi += rg * (spec.padHi ?? .12);
    const R = hi - lo;
    const iw = (W - padL - padR) / n;
    const x = i => padL + (i + .5) * iw;
    const y = p => padT + (hi - p) / R * (H - padT - padB);
    const px2i = px => clamp(Math.round((px - padL) / iw - .5), 0, n - 1);
    const py2p = py => hi - (py - padT) / (H - padT - padB) * R;
    sc = { x, y, px2i, py2p, W, H, padR, iw };
    const prec = R > 150 ? 0 : R > 25 ? 1 : 2;
    const cur = spec.play ? st.upto : (spec.steps ? (spec.steps[st.step].upto ?? n) : n);
    const from = anim === 'all' ? 0 : (anim === 'new' ? st.prevUpto : cur);

    let g = '';
    /* rejilla */
    const gridN = 4;
    for (let k = 0; k <= gridN; k++) {
      const p = lo + R * k / gridN, yy = y(p);
      g += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${(W - padR + 2).toFixed(1)}" y2="${yy.toFixed(1)}" stroke="#1A202B" stroke-width="1"/>`;
      if (padR > 40) g += txt(W - padR + 8, yy, p.toFixed(prec), '#4E586A', 'start', { fs: 10 });
    }
    g += `<line x1="${(W - padR + 2).toFixed(1)}" y1="${padT - 8}" x2="${(W - padR + 2).toFixed(1)}" y2="${H - padB + 6}" stroke="#1A202B"/>`;

    /* overlays de fondo */
    const ovs = (spec.ov || []).filter(visible);
    const bw = Math.max(2.4, Math.min(15, iw * .62));
    ovs.filter(o => ['zone', 'vzone', 'hi', 'fvg'].includes(o.k)).forEach(o => { g += drawOv(o, true); });
    /* velas */
    for (let i = 0; i < cur; i++) {
      const k = cd[i], up = k.c >= k.o, col = up ? C.bull : C.bear;
      const bodyY = y(Math.max(k.o, k.c)), bodyH = Math.max(1.4, Math.abs(y(k.o) - y(k.c)));
      const an = i >= from ? `class="cdl" style="animation-delay:${Math.min(900, (i - from) * 34)}ms"` : '';
      g += `<g ${an} opacity="${o_dim(i)}"><line x1="${x(i).toFixed(1)}" y1="${y(k.h).toFixed(1)}" x2="${x(i).toFixed(1)}" y2="${y(k.l).toFixed(1)}" stroke="${col}" stroke-width="1.3"/><rect x="${(x(i) - bw / 2).toFixed(1)}" y="${bodyY.toFixed(1)}" width="${bw.toFixed(1)}" height="${bodyH.toFixed(1)}" fill="${col}" rx="${bw > 6 ? 1.3 : .6}"/></g>`;
    }
    function o_dim(i) { const d = spec.dim; return d && i >= d[0] && i <= d[1] ? .28 : 1; }
    /* overlays delanteros */
    const delay = Math.min(900, Math.max(0, (cur - from)) * 34) + 60;
    ovs.filter(o => !['zone', 'vzone', 'hi', 'fvg'].includes(o.k)).forEach(o => {
      g += `<g class="ovg" style="animation-delay:${o.s != null && o.s === st.step ? 120 : delay}ms">${drawOv(o)}</g>`;
    });

    function drawOv(o) {
      const A = o.color || C.gold;
      switch (o.k) {
        case 'level': {
          const x1 = o.from != null ? x(o.from) : padL, x2 = o.to != null ? x(o.to) : W - padR + 2;
          let s = `<line x1="${x1.toFixed(1)}" y1="${y(o.p).toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y(o.p).toFixed(1)}" stroke="${A}" stroke-width="${o.lw || 1.4}" ${o.dash ? `stroke-dasharray="${o.dash}"` : ''} opacity="${o.op ?? .9}"/>`;
          if (o.label) s += padR > 40 && o.lab !== 'in'
            ? pill(W - padR + 6, y(o.p), o.label, A, 'start', { fs: o.fs || 10 })
            : pill(x1 + 6, y(o.p) - 11, o.label, A, 'start', { fs: o.fs || 10 });
          return s;
        }
        case 'zone': {
          const x1 = o.from != null ? x(o.from) - iw / 2 : padL, x2 = o.to != null ? x(o.to) + iw / 2 : W - padR + 2;
          const ya = y(Math.max(o.p1, o.p2)), yb = y(Math.min(o.p1, o.p2));
          let s = `<rect x="${x1.toFixed(1)}" y="${ya.toFixed(1)}" width="${(x2 - x1).toFixed(1)}" height="${Math.max(2, yb - ya).toFixed(1)}" fill="${A}" fill-opacity="${o.fo ?? .11}" stroke="${A}" stroke-opacity=".45" stroke-width="1" ${o.dash ? `stroke-dasharray="${o.dash}"` : ''} rx="2"/>`;
          if (o.label) s += txt(x1 + 7, ya + 10, o.label, A, 'start', { fs: o.fs || 10.5 });
          return s;
        }
        case 'fvg': {
          const x1 = x(o.from) - iw / 2, x2 = (o.to != null ? x(o.to) + iw / 2 : W - padR + 2);
          const ya = y(Math.max(o.p1, o.p2)), yb = y(Math.min(o.p1, o.p2));
          let s = `<rect x="${x1.toFixed(1)}" y="${ya.toFixed(1)}" width="${(x2 - x1).toFixed(1)}" height="${Math.max(2, yb - ya).toFixed(1)}" fill="${A}" fill-opacity=".17" stroke="${A}" stroke-opacity=".6" stroke-dasharray="3 3" rx="2"/>`;
          if (o.label) s += pill(x1 + 5, ya - 9, o.label, A, 'start', { fs: 10 });
          return s;
        }
        case 'vzone': {
          const x1 = x(o.from) - iw / 2, x2 = x(o.to) + iw / 2;
          let s = `<rect x="${x1.toFixed(1)}" y="${padT - 14}" width="${(x2 - x1).toFixed(1)}" height="${(H - padB - padT + 18).toFixed(1)}" fill="${A}" fill-opacity="${o.fo ?? .07}"/>`;
          s += `<line x1="${x1.toFixed(1)}" y1="${padT - 14}" x2="${x1.toFixed(1)}" y2="${H - padB + 4}" stroke="${A}" stroke-opacity=".3" stroke-dasharray="2 4"/>`;
          if (o.label) s += txt((x1 + x2) / 2, padT - 9, o.label, A, 'middle', { fs: 10.5 });
          return s;
        }
        case 'hi': {
          const x1 = x(o.from) - iw / 2, x2 = x(o.to) + iw / 2;
          return `<rect x="${x1.toFixed(1)}" y="${padT - 10}" width="${(x2 - x1).toFixed(1)}" height="${(H - padB - padT + 14).toFixed(1)}" fill="${A}" fill-opacity="${o.fo ?? .09}" stroke="${A}" stroke-opacity=".35" stroke-dasharray="4 4" rx="4"/>`;
        }
        case 'swing': {
          const c = spec.candles[o.i], up = o.side === 'H';
          const py = up ? y(c.h) - (o.off ?? 12) : y(c.l) + (o.off ?? 12);
          let s = `<circle cx="${x(o.i).toFixed(1)}" cy="${(up ? y(c.h) - 3 : y(c.l) + 3).toFixed(1)}" r="2.6" fill="${A}"/>`;
          s += pill(x(o.i), py, o.text, A, 'middle', { fs: o.fs || 10.5 });
          return s;
        }
        case 'zig': {
          const d = o.pts.map(([i, sd]) => `${x(i).toFixed(1)},${(sd === 'H' ? y(spec.candles[i].h) - 2 : y(spec.candles[i].l) + 2).toFixed(1)}`).join(' ');
          return `<polyline points="${d}" fill="none" stroke="${A}" stroke-width="${o.lw || 1.5}" stroke-opacity="${o.op ?? .75}" ${o.dash ? `stroke-dasharray="${o.dash}"` : ''} stroke-linejoin="round"/>`;
        }
        case 'trend': {
          return `<line x1="${x(o.i1).toFixed(1)}" y1="${y(o.p1).toFixed(1)}" x2="${x(o.i2).toFixed(1)}" y2="${y(o.p2).toFixed(1)}" stroke="${A}" stroke-width="${o.lw || 1.4}" ${o.dash ? `stroke-dasharray="${o.dash}"` : ''} opacity="${o.op ?? .85}"/>`;
        }
        case 'note': {
          const c = spec.candles[o.i];
          const py = o.py != null ? y(o.py) : (o.side === 'H' ? y(c.h) - (o.off ?? 26) : y(c.l) + (o.off ?? 26));
          let s = '';
          if (o.arrow !== false) {
            const ty = o.side === 'H' ? y(c.h) - 6 : y(c.l) + 6;
            s += `<line x1="${x(o.i).toFixed(1)}" y1="${py + (o.side === 'H' ? 8 : -8)}" x2="${x(o.i).toFixed(1)}" y2="${ty.toFixed(1)}" stroke="${A}" stroke-width="1" stroke-dasharray="2 2" opacity=".7"/>`;
          }
          s += pill(clamp(x(o.i) + (o.dx || 0), 40, W - padR - 20), py, o.text, A, 'middle', { fs: o.fs || 10.5 });
          return s;
        }
        case 'mark': {
          const c = spec.candles[o.i], up = o.side !== 'H';
          const ty = up ? y(c.l) + 9 : y(c.h) - 9;
          const d = up ? `${x(o.i)},${ty} ${x(o.i) - 4.5},${ty + 8} ${x(o.i) + 4.5},${ty + 8}` : `${x(o.i)},${ty} ${x(o.i) - 4.5},${ty - 8} ${x(o.i) + 4.5},${ty - 8}`;
          let s = `<polygon points="${d}" fill="${A}"/>`;
          if (o.text) s += pill(clamp(x(o.i) + (o.dx || 0), 44, W - padR - 24), up ? ty + 22 : ty - 22, o.text, A, 'middle', { fs: o.fs || 10.5 });
          return s;
        }
        case 'stops': {
          const x1 = x(o.from), x2 = x(o.to), cnt = o.n || 7, yy = y(o.p);
          let s = '';
          for (let k = 0; k < cnt; k++) {
            const xx = x1 + (x2 - x1) * k / (cnt - 1);
            s += `<line x1="${xx.toFixed(1)}" y1="${(yy - 26).toFixed(1)}" x2="${xx.toFixed(1)}" y2="${(yy - 9).toFixed(1)}" stroke="${A}" stroke-width="1.2" opacity=".75"/><polygon points="${xx},${yy - 5} ${xx - 3.4},${yy - 12} ${xx + 3.4},${yy - 12}" fill="${A}" opacity=".85"/>`;
          }
          if (o.text) s += txt((x1 + x2) / 2, yy - 35, o.text, A, 'middle', { fs: 10 });
          return s;
        }
        case 'line': {
          const dat = o.data || [], lim = o.to != null ? Math.min(cur, o.to + 1) : cur;
          let d = '', open = false;
          for (let i = (o.from || 0); i < lim; i++) {
            const v = dat[i];
            if (v == null) { open = false; continue; }
            d += (open ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1) + ' '; open = true;
          }
          let s2 = d ? `<path d="${d}" fill="none" stroke="${A}" stroke-width="${o.lw || 1.5}" ${o.dash ? `stroke-dasharray="${o.dash}"` : ''} opacity="${o.op ?? .95}" stroke-linejoin="round"/>` : '';
          if (o.label && d) {
            let li = -1; for (let i = lim - 1; i >= 0; i--) if (dat[i] != null) { li = i; break; }
            if (li >= 0 && padR > 40) s2 += pill(W - padR + 6, y(dat[li]), o.label, A, 'start', { fs: o.fs || 9.5 });
          }
          return s2;
        }
        case 'ribbon': {
          const up = o.up || [], dn = o.dn || [], lim = cur;
          const path = arr => {
            let dd = '', op = false;
            for (let i = 0; i < lim; i++) { const v = arr[i]; if (v == null) { op = false; continue; } dd += (op ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1) + ' '; op = true; }
            return dd;
          };
          const pts = [];
          for (let i = 0; i < lim; i++) if (up[i] != null && dn[i] != null) pts.push(i);
          let s2 = '';
          if (pts.length > 1) {
            let d = '';
            pts.forEach((i, k) => { d += (k ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(up[i]).toFixed(1) + ' '; });
            for (let k = pts.length - 1; k >= 0; k--) { const i = pts[k]; d += 'L' + x(i).toFixed(1) + ',' + y(dn[i]).toFixed(1) + ' '; }
            s2 += `<path d="${d}Z" fill="${A}" fill-opacity="${o.fo ?? .06}"/>`;
          }
          [up, dn].forEach(arr => { const d = path(arr); if (d) s2 += `<path d="${d}" fill="none" stroke="${A}" stroke-width="${o.lw || 1.2}" opacity="${o.op ?? .7}" ${o.dash ? `stroke-dasharray="${o.dash}"` : ''}/>`; });
          if (o.mid) { const d = path(o.mid); if (d) s2 += `<path d="${d}" fill="none" stroke="${A}" stroke-width="1.1" stroke-dasharray="4 4" opacity=".55"/>`; }
          if (o.label && pts.length) s2 += pill(x(pts[pts.length - 1]) - 6, y(up[pts[pts.length - 1]]) - 10, o.label, A, 'end', { fs: 9.5 });
          return s2;
        }
        case 'txt': return txt(o.i != null ? x(o.i) : (o.xp ?? padL + 8), o.py != null ? y(o.py) : (o.yp ?? padT), o.text, A, o.anchor || 'start', { fs: o.fs || 11, ff: o.ff });
        case 'band': { /* etiqueta grande centrada arriba */
          return pill(o.i != null ? x(o.i) : (W - padR) / 2, padT - 10, o.text, A, 'middle', { fs: o.fs || 11 });
        }
        case 'bracket': {
          const x1 = x(o.from) - iw / 2, x2 = x(o.to) + iw / 2, yy = o.yp ?? (H - padB + 8);
          return `<path d="M${x1},${yy - 5} L${x1},${yy} L${x2},${yy} L${x2},${yy - 5}" fill="none" stroke="${A}" stroke-width="1" opacity=".6"/>` + txt((x1 + x2) / 2, yy + 9, o.text, A, 'middle', { fs: 10 });
        }
      }
      return '';
    }

    /* ---- paneles de indicadores, sincronizados con las mismas velas ---- */
    let ptop = H;
    PN.forEach((pn, pi) => { const top = ptop + PGAP; g += drawPane(pn, top, PH[pi]); ptop = top + PH[pi]; });

    function drawPane(pn, top, hh) {
      const ser = (pn.series || []).filter(sr => !sr.g || !st.off.has(sr.g));
      let lo2 = Infinity, hi2 = -Infinity;
      ser.forEach(sr => sr.data.forEach((v, i) => { if (v != null && i < cur) { lo2 = Math.min(lo2, v); hi2 = Math.max(hi2, v); } }));
      (pn.lines || []).forEach(l => { lo2 = Math.min(lo2, l.v); hi2 = Math.max(hi2, l.v); });
      if (!isFinite(lo2) || !isFinite(hi2)) { lo2 = 0; hi2 = 1; }
      const pd = (hi2 - lo2) * .12 || 1;
      const mn = pn.min ?? lo2 - pd, mx = pn.max ?? hi2 + pd;
      const yy = v => top + (mx - clamp(v, mn, mx)) / ((mx - mn) || 1) * hh;
      let s2 = `<rect x="${padL}" y="${top.toFixed(1)}" width="${(W - padR + 2 - padL).toFixed(1)}" height="${hh}" fill="#0C1016" stroke="#1A202B" rx="5"/>`;
      (pn.lines || []).forEach(l => {
        s2 += `<line x1="${padL + 1}" y1="${yy(l.v).toFixed(1)}" x2="${(W - padR + 1).toFixed(1)}" y2="${yy(l.v).toFixed(1)}" stroke="${l.color || '#242C38'}" stroke-width="1" stroke-dasharray="${l.dash || '3 4'}"/>`;
        if (padR > 40) s2 += txt(W - padR + 8, yy(l.v), l.label ?? String(l.v), l.color || '#4E586A', 'start', { fs: 9.5 });
      });
      if (pn.zone) s2 += `<rect x="${padL + 1}" y="${yy(pn.zone[1]).toFixed(1)}" width="${(W - padR - padL).toFixed(1)}" height="${Math.abs(yy(pn.zone[0]) - yy(pn.zone[1])).toFixed(1)}" fill="${pn.zoneColor || C.mut}" fill-opacity=".06"/>`;
      ser.forEach(sr => {
        if (sr.hist) {
          const base = clamp(sr.base ?? mn, mn, mx);
          for (let i = 0; i < cur; i++) {
            const v = sr.data[i]; if (v == null) continue;
            const y1 = yy(v), y0 = yy(base);
            s2 += `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(.8, Math.abs(y1 - y0)).toFixed(1)}" fill="${sr.color}" fill-opacity="${sr.fo ?? .45}" rx="1"/>`;
          }
          return;
        }
        let d = '', open = false;
        for (let i = 0; i < cur; i++) {
          const v = sr.data[i]; if (v == null) { open = false; continue; }
          d += (open ? 'L' : 'M') + x(i).toFixed(1) + ',' + yy(v).toFixed(1) + ' '; open = true;
        }
        if (d) s2 += `<path d="${d}" fill="none" stroke="${sr.color}" stroke-width="${sr.lw || 1.5}" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''} opacity="${sr.op ?? 1}" stroke-linejoin="round"/>`;
      });
      (pn.marks || []).filter(visible).forEach(mk2 => {
        if (mk2.i >= cur) return;
        const v = mk2.v != null ? mk2.v : (ser[0] && ser[0].data[mk2.i]);
        if (v == null) return;
        s2 += `<circle cx="${x(mk2.i).toFixed(1)}" cy="${yy(v).toFixed(1)}" r="3" fill="${mk2.color || C.gold}"/>`;
        if (mk2.text) s2 += pill(clamp(x(mk2.i) + (mk2.dx || 0), 46, W - padR - 24), yy(v) + (mk2.up ? -13 : 14), mk2.text, mk2.color || C.gold, 'middle', { fs: 9.5 });
      });
      (pn.zigs || []).filter(visible).forEach(z => {
        const dd = z.pts.filter(([i]) => i < cur).map(([i, v]) => `${x(i).toFixed(1)},${yy(v != null ? v : (ser[0] && ser[0].data[i])).toFixed(1)}`).join(' ');
        if (dd) s2 += `<polyline points="${dd}" fill="none" stroke="${z.color || C.gold}" stroke-width="1.4" stroke-dasharray="${z.dash || '4 3'}" opacity=".85"/>`;
      });
      if (pn.title) s2 += txt(padL + 8, top + 12, pn.title, '#8A97A9', 'start', { fs: 10, ff: 'JetBrains Mono, monospace' });
      let lx = padL + 8 + (pn.title ? String(pn.title).length * 6.1 + 14 : 0);
      ser.forEach(sr => {
        if (!sr.name) return;
        s2 += `<rect x="${lx.toFixed(1)}" y="${(top + 10.8).toFixed(1)}" width="10" height="2.4" rx="1" fill="${sr.color}"/>`;
        s2 += txt(lx + 14, top + 12, sr.name, '#8A97A9', 'start', { fs: 9.5 });
        lx += 14 + String(sr.name).length * 5.7 + 12;
      });
      return s2;
    }

    box.querySelectorAll('svg').forEach(s => s.remove());
    box.insertAdjacentHTML('afterbegin', `<svg viewBox="0 0 ${W} ${TOT}" width="${W}" height="${TOT}" role="img" aria-label="${esc(spec.title || 'gráfico de velas')}">${g}</svg>`);
    st.prevUpto = cur;
  }

  /* interacción: crosshair + lectura OHLC */
  if (spec.hover !== false) {
    box.addEventListener('pointermove', e => {
      if (!sc) return;
      const r = box.getBoundingClientRect(), px = e.clientX - r.left - 6;
      const i = sc.px2i(px), k = spec.candles[i];
      const cur = spec.play ? st.upto : (spec.steps ? (spec.steps[st.step].upto ?? spec.candles.length) : spec.candles.length);
      if (!k || i >= cur) { readout.style.opacity = 0; return; }
      const up = k.c >= k.o, pr = (hiLoRange() > 150 ? 0 : hiLoRange() > 25 ? 1 : 2);
      readout.innerHTML = `<b>#${i + 1}</b> · <span class="${up ? 'u' : 'd'}">${up ? '▲' : '▼'}</span><br>A ${k.o.toFixed(pr)} · M ${k.h.toFixed(pr)}<br>m ${k.l.toFixed(pr)} · C <b>${k.c.toFixed(pr)}</b>`;
      readout.style.opacity = 1;
      const rx = sc.x(i) + 14, flip = rx + 122 > sc.W - sc.padR;
      readout.style.left = (flip ? sc.x(i) - 110 : rx) + 'px';
      readout.style.top = clamp(sc.y(k.h) - 18, 4, sc.H - 76) + 'px';
    });
    box.addEventListener('pointerleave', () => { readout.style.opacity = 0; });
  }
  function hiLoRange() { let lo = Infinity, hi = -Infinity; spec.candles.forEach(k => { lo = Math.min(lo, k.l); hi = Math.max(hi, k.h); }); return hi - lo; }

  if (spec.onPick) {
    box.classList.add('clickable');
    box.addEventListener('click', e => {
      if (!sc) return;
      const r = box.getBoundingClientRect();
      spec.onPick({ i: sc.px2i(e.clientX - r.left - 6), p: sc.py2p(e.clientY - r.top - 4) }, api);
    });
  }

  /* toggles */
  fig.querySelectorAll('.tgl').forEach(b => b.addEventListener('click', () => {
    const g = b.dataset.g;
    if (st.off.has(g)) { st.off.delete(g); b.classList.add('on'); } else { st.off.add(g); b.classList.remove('on'); }
    render(false);
  }));

  /* pasos */
  function syncStep() {
    if (!spec.steps) return;
    const s = spec.steps[st.step];
    fig.querySelector('.step-txt .num').textContent = (st.step + 1) + '/' + spec.steps.length;
    fig.querySelector('.step-txt h5').textContent = s.t || '';
    fig.querySelector('.step-txt p').innerHTML = s.d || '';
    fig.querySelector('[data-prev]').disabled = st.step === 0;
    fig.querySelector('[data-next]').disabled = st.step === spec.steps.length - 1;
    fig.querySelectorAll('.dots i').forEach((d, i) => { d.className = i === st.step ? 'on' : (i < st.step ? 'past' : ''); });
  }
  if (spec.steps) {
    fig.querySelector('[data-prev]').addEventListener('click', () => { if (st.step > 0) { st.step--; st.prevUpto = 0; syncStep(); render('all'); } });
    fig.querySelector('[data-next]').addEventListener('click', () => { if (st.step < spec.steps.length - 1) { st.step++; syncStep(); render('new'); } });
    fig.querySelectorAll('.dots i').forEach(d => d.addEventListener('click', () => { const t = +d.dataset.d; const fw = t > st.step; st.step = t; if (!fw) st.prevUpto = 0; syncStep(); render(fw ? 'new' : 'all'); }));
    syncStep();
  }

  /* revelar capas (modo desnudo) */
  if (hasOv) fig.querySelectorAll('.reveal button').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.r;
    if (k === '*') { const all = st.rev.size === REVL.length; st.rev = new Set(all ? [] : REVL.map(v => v[0])); }
    else if (st.rev.has(k)) st.rev.delete(k); else st.rev.add(k);
    syncRev(); render(false);
  }));
  function syncRev() {
    if (!hasOv) return;
    fig.querySelectorAll('.reveal button').forEach(b => {
      const k = b.dataset.r;
      b.classList.toggle('on', k === '*' ? st.rev.size === REVL.length : st.rev.has(k));
    });
  }

  /* ---------- reproducir mercado ---------- */
  let timer = null;
  if (spec.play) {
    const bar = fig.querySelector('.play'), pq = fig.querySelector('.pauseq');
    const posEl = bar.querySelector('.pos'), tBtn = bar.querySelector('[data-p="t"]');
    const setUpto = v => {
      const nv = clamp(v, 1, N0), fw = nv > st.upto;
      if (!fw) st.prevUpto = 0;
      st.upto = nv; render(fw ? 'new' : 'all'); sync();
    };
    const sync = () => {
      posEl.textContent = st.upto + ' / ' + N0;
      tBtn.innerHTML = st.playing ? '&#9208; Pausa' : '&#9654; Reproducir mercado';
      tBtn.classList.toggle('playing', st.playing);
    };
    const stop = () => { clearInterval(timer); timer = null; st.playing = false; sync(); };
    const tick = () => {
      if (st.upto >= N0) { stop(); return; }
      setUpto(st.upto + 1);
      const q = spec.pauses && spec.pauses[st.upto];
      if (q) { stop(); ask(q); }
    };
    const start = () => {
      pq.hidden = true;
      if (st.upto >= N0) { st.upto = clamp(spec.playFrom ?? 2, 1, N0); st.prevUpto = 0; render('all'); }
      st.playing = true; clearInterval(timer); timer = setInterval(tick, 620 / st.spd); sync();
    };
    function ask(q) {
      pq.hidden = false;
      pq.innerHTML = `<div class="pq-h">Vela ${st.upto} · para un momento y piénsalo</div>
        <div class="pq-g">
          <span>¿Sigue intacta la estructura?</span><span>¿Qué nivel está atacando?</span>
          <span>¿Dónde queda liquidez sin tocar?</span><span>¿Qué tendría que pasar para confirmar un cambio?</span>
        </div>
        ${q.t ? `<p class="pq-t">${q.t}</p>` : ''}
        <div class="pq-b"><button data-x="r">Ver respuesta</button><button data-x="g">Seguir &#9654;</button></div>
        ${q.a ? `<p class="pq-a" hidden>${q.a}</p>` : ''}`;
      pq.querySelector('[data-x="g"]').onclick = () => { pq.hidden = true; start(); };
      const rb = pq.querySelector('[data-x="r"]'), ans = pq.querySelector('.pq-a');
      if (rb) rb.onclick = () => { if (ans) ans.hidden = false; rb.remove(); };
    }
    bar.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.s) {
        st.spd = +b.dataset.s;
        bar.querySelectorAll('.spd button').forEach(x => x.classList.toggle('on', x === b));
        if (st.playing) { clearInterval(timer); timer = setInterval(tick, 620 / st.spd); }
        return;
      }
      const k = b.dataset.p; if (!k) return;
      if (k === 't') { st.playing ? stop() : start(); return; }
      stop(); pq.hidden = true;
      if (k === 's') setUpto(clamp(spec.playFrom ?? 2, 1, N0));
      else if (k === 'b') setUpto(st.upto - 1);
      else if (k === 'f') setUpto(st.upto + 1);
      else if (k === 'e') setUpto(N0);
    });
    sync();
  }

  const api = {
    node: fig,
    st,
    syncRev,
    render,
    setOv(ov) { spec.ov = ov; render(false); },
    setCandles(c) { spec.candles = c; st.prevUpto = 0; render('all'); },
    on(g) { st.off.delete(g); render(false); },
    offAll(gs) { gs.forEach(g => st.off.add(g)); render(false); },
    toggle(g, v) { v ? st.off.delete(g) : st.off.add(g); render(false); },
    step(i) { if (spec.steps) { st.step = i; syncStep(); render('all'); } },
    reveal(k) { st.rev.add(k); syncRev(); render(false); },
    upto(v) { if (spec.play) { st.upto = clamp(v, 1, N0); st.prevUpto = 0; render('all'); } }
  };
  REG.push({ box, render, api });
  requestAnimationFrame(() => render('all'));
  return api;
}
