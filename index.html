<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leer el gráfico — Análisis técnico aplicado a XAUUSD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#0A0C10;
  --bg-2:#0E1117;
  --panel:#12161D;
  --panel-2:#171C25;
  --line:#232A35;
  --line-2:#2E3746;
  --tx:#DDE3EC;
  --tx-2:#9AA6B8;
  --tx-3:#6B7686;
  --gold:#E8B44A;
  --gold-dim:#8A6C2A;
  --bull:#2BBF7B;
  --bear:#E5484D;
  --liq:#8B7BF0;
  --info:#4CC2E0;
  --warn:#F0983C;
  --r-s:6px; --r-m:10px; --r-l:16px;
  --rail:266px;
  --ff-d:"Space Grotesk",system-ui,sans-serif;
  --ff-b:"Inter",system-ui,-apple-system,sans-serif;
  --ff-m:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root:not([data-theme="light"]){ color-scheme: dark; }
:root[data-theme="dark"]{ color-scheme: dark; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--tx);
  font-family:var(--ff-b);
  font-size:15.5px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4,h5{font-family:var(--ff-d);font-weight:600;line-height:1.18;letter-spacing:-.015em;margin:0}
p{margin:0 0 .9em}
a{color:var(--gold);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--ff-m)}
.mut{color:var(--tx-2)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#242c38;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- LAYOUT ---------- */
.app{display:flex;min-height:100vh}
.rail{
  width:var(--rail);flex:0 0 var(--rail);
  background:var(--bg-2);border-right:1px solid var(--line);
  position:fixed;inset:0 auto 0 0;height:100vh;display:flex;flex-direction:column;z-index:60;
}
.brand{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.brand .tick{display:flex;align-items:baseline;gap:8px;font-family:var(--ff-m);font-size:12px;color:var(--tx-3);letter-spacing:.06em}
.brand .tick b{color:var(--gold);font-weight:700}
.brand h1{font-size:19px;margin:6px 0 2px;letter-spacing:-.02em}
.brand p{margin:0;font-size:12.5px;color:var(--tx-3);line-height:1.4}
.prog{padding:12px 20px;border-bottom:1px solid var(--line)}
.prog .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx-3);font-family:var(--ff-m);margin-bottom:7px}
.prog .row b{color:var(--gold);font-weight:500}
.bar{height:4px;background:#1C2230;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));border-radius:99px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.nav{flex:1;overflow-y:auto;padding:10px 12px 28px}
.nav .grp{font-family:var(--ff-m);font-size:10.5px;letter-spacing:.14em;color:var(--tx-3);padding:14px 8px 7px}
.nav a{
  display:grid;grid-template-columns:26px 1fr;gap:9px;align-items:center;
  padding:7px 9px;border-radius:8px;color:var(--tx-2);font-size:13.8px;line-height:1.3;
  transition:background .16s,color .16s;position:relative
}
.nav a .n{font-family:var(--ff-m);font-size:11px;color:var(--tx-3);text-align:right}
.nav a:hover{background:#181E28;color:var(--tx)}
.nav a.on{background:#1B222E;color:var(--tx)}
.nav a.on .n{color:var(--gold)}
.nav a.on::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:2px;background:var(--gold);border-radius:0 2px 2px 0}
.nav a.done .n::after{content:"✓";color:var(--bull);margin-left:3px;font-size:10px}

.main{flex:1;margin-left:var(--rail);min-width:0}
.topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:0 26px;height:54px;background:rgba(10,12,16,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)
}
.topbar .crumb{font-family:var(--ff-m);font-size:11.5px;color:var(--tx-3);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .crumb b{color:var(--tx-2);font-weight:500}
.topbar .sp{flex:1}
.burger{display:none;width:34px;height:34px;border:1px solid var(--line);border-radius:8px;align-items:center;justify-content:center}
.burger span,.burger span::before,.burger span::after{content:"";display:block;width:15px;height:1.5px;background:var(--tx-2);position:relative}
.burger span::before{position:absolute;top:-5px}
.burger span::after{position:absolute;top:5px}
.ghost{border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-size:12.5px;color:var(--tx-2);transition:.16s}
.ghost:hover{border-color:var(--line-2);color:var(--tx)}
.ghost.pin{border-color:var(--gold-dim);color:var(--gold)}

.wrap{max-width:1080px;padding:38px 26px 120px;margin:0 auto}
.chapfoot{display:flex;justify-content:space-between;gap:12px;margin-top:56px;padding-top:22px;border-top:1px solid var(--line)}
.chapfoot button{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r-m);max-width:46%;text-align:left;transition:.18s}
.chapfoot button:hover{border-color:var(--gold-dim);background:var(--panel)}
.chapfoot button:last-child{text-align:right;align-items:flex-end}
.chapfoot small{font-family:var(--ff-m);font-size:10.5px;color:var(--tx-3)}
.chapfoot b{font-family:var(--ff-d);font-weight:600;font-size:14px}

/* ---------- HEADERS ---------- */
.chead{margin-bottom:30px}
.chead .kick{display:flex;align-items:center;gap:10px;font-family:var(--ff-m);font-size:11.5px;color:var(--gold);letter-spacing:.1em;margin-bottom:12px}
.chead .kick i{display:block;width:26px;height:1px;background:var(--gold-dim);font-style:normal}
.chead h2{font-size:clamp(28px,4.4vw,40px);letter-spacing:-.03em;margin-bottom:10px}
.chead .lede{font-size:17px;color:var(--tx-2);max-width:66ch;margin:0}
h3.sec{font-size:22px;margin:52px 0 6px;letter-spacing:-.02em;scroll-margin-top:70px}
h3.sec + .sub{color:var(--tx-2);margin:0 0 20px;max-width:70ch;font-size:15px}
h4.min{font-size:15.5px;font-family:var(--ff-d);margin:0 0 6px}
.body{max-width:72ch}
.body p{color:var(--tx-2)}
.body strong{color:var(--tx);font-weight:600}

/* ---------- CHART ---------- */
.chart{margin:22px 0 10px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);overflow:hidden}
.chart-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chart-head .t{font-family:var(--ff-d);font-weight:600;font-size:14.5px}
.chart-head .tf{font-family:var(--ff-m);font-size:10.5px;color:var(--tx-3);border:1px solid var(--line);padding:2px 7px;border-radius:99px}
.chart-head .sp{flex:1;min-width:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tgl{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel-2);padding:5px 11px 5px 8px;border-radius:99px;font-size:12.3px;color:var(--tx-2);transition:.18s;user-select:none}
.tgl .sw{width:26px;height:15px;border-radius:99px;background:#2A3240;position:relative;transition:background .2s;flex:0 0 auto}
.tgl .sw::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#7A8698;transition:transform .2s,background .2s}
.tgl.on{color:var(--tx);border-color:var(--gold-dim)}
.tgl.on .sw{background:#4A3A17}
.tgl.on .sw::after{transform:translateX(11px);background:var(--gold)}
.chart-svg{position:relative;padding:4px 6px 2px}
.chart-svg svg{display:block;width:100%;height:auto;overflow:visible}
.chart figcaption{padding:0 16px 14px;color:var(--tx-2);font-size:13.6px;line-height:1.55;max-width:80ch}
.chart figcaption b{color:var(--tx)}
.chart.flat{background:transparent;border-color:var(--line)}

@keyframes cdlIn{from{opacity:0;transform:translateY(10px) scaleY(.5)}to{opacity:1;transform:none}}
@keyframes ovIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.cdl{transform-box:fill-box;transform-origin:center;animation:cdlIn .34s cubic-bezier(.2,.8,.3,1) both}
.ovg{animation:ovIn .4s ease both}
.pulse{animation:pl 1.9s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.cdl,.ovg,.pulse{animation:none!important}*{transition-duration:.01ms!important}}

.xh{position:absolute;inset:0;pointer-events:none}
.readout{
  position:absolute;pointer-events:none;background:#080A0E;border:1px solid var(--line-2);
  border-radius:8px;padding:7px 9px;font-family:var(--ff-m);font-size:11px;line-height:1.5;
  color:var(--tx-2);white-space:nowrap;opacity:0;transition:opacity .12s;z-index:5
}
.readout b{color:var(--tx);font-weight:500}
.readout .u{color:var(--bull)}.readout .d{color:var(--bear)}

/* ---------- STEPPER ---------- */
.stepper{border-top:1px solid var(--line);background:var(--panel-2)}
.step-nav{display:flex;align-items:center;gap:12px;padding:10px 14px}
.step-nav button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);padding:6px 13px;border-radius:99px;font-size:12.8px;color:var(--tx-2);transition:.16s}
.step-nav button:hover:not(:disabled){border-color:var(--gold-dim);color:var(--tx)}
.step-nav button:disabled{opacity:.34;cursor:default}
.dots{flex:1;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.dots i{width:22px;height:3px;border-radius:99px;background:#2A3240;cursor:pointer;transition:background .2s,transform .2s}
.dots i.on{background:var(--gold)}
.dots i.past{background:var(--gold-dim)}
.step-txt{padding:2px 16px 15px;display:flex;gap:12px;align-items:flex-start}
.step-txt .num{font-family:var(--ff-m);font-size:11px;color:var(--gold);border:1px solid var(--gold-dim);border-radius:99px;padding:2px 8px;flex:0 0 auto;margin-top:2px}
.step-txt h5{font-family:var(--ff-d);font-size:15px;font-weight:600;margin:0 0 3px}
.step-txt p{margin:0;font-size:13.8px;color:var(--tx-2);max-width:74ch}

/* ---------- QA TABS ---------- */
.qa{border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;margin:18px 0 8px;background:var(--bg-2)}
.qa-tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.qa-tabs::-webkit-scrollbar{display:none}
.qa-tabs button{
  padding:11px 14px;font-size:12.6px;color:var(--tx-3);white-space:nowrap;border-bottom:2px solid transparent;
  transition:.16s;display:flex;gap:7px;align-items:center
}
.qa-tabs button:hover{color:var(--tx-2)}
.qa-tabs button.on{color:var(--tx);border-bottom-color:var(--gold);background:#141922}
.qa-tabs .dg{color:var(--tx-3);font-family:var(--ff-m);font-size:10.5px}
.qa-body{padding:15px 18px;font-size:14.6px;color:var(--tx-2);min-height:78px;max-width:84ch}
.qa-body b{color:var(--tx)}
.qa-body .k{font-family:var(--ff-d);color:var(--tx);display:block;margin-bottom:3px;font-size:13px}

/* ---------- CARDS / GRIDS ---------- */
.grid{display:grid;gap:14px;margin:20px 0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{border:1px solid var(--line);border-radius:var(--r-m);padding:16px 17px;background:var(--panel)}
.card h4{font-family:var(--ff-d);font-size:14.5px;margin:0 0 7px;display:flex;align-items:center;gap:8px}
.card p{margin:0;font-size:13.7px;color:var(--tx-2)}
.card p+p{margin-top:8px}
.card .dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.card.bull{border-color:#1E4A38}.card.bull h4{color:var(--bull)}
.card.bear{border-color:#4E2427}.card.bear h4{color:var(--bear)}
.card.liq{border-color:#3A3468}.card.liq h4{color:var(--liq)}
.card.gold{border-color:var(--gold-dim)}.card.gold h4{color:var(--gold)}

.note{border-left:2px solid var(--line-2);padding:12px 16px;background:var(--bg-2);border-radius:0 var(--r-m) var(--r-m) 0;margin:20px 0;font-size:14.2px;color:var(--tx-2)}
.note b{color:var(--tx)}
.note.warn{border-left-color:var(--warn)}
.note.warn b{color:var(--warn)}
.note.key{border-left-color:var(--gold)}
.note.key b{color:var(--gold)}
.note.no{border-left-color:var(--bear)}
.note.no b{color:var(--bear)}
.note p:last-child{margin-bottom:0}
.scalp-panel{margin:22px 0 8px;border:1px solid var(--gold-dim);border-radius:var(--r-l);background:var(--panel);overflow:hidden}
.scalp-panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);background:rgba(232,180,74,.05)}
.scalp-panel-h b{font-family:var(--ff-d);font-size:14px;color:var(--gold)}
.scalp-panel-h span{font-family:var(--ff-m);font-size:10.5px;color:var(--tx-3);text-transform:uppercase;letter-spacing:.08em}
.scalp-panel iframe{display:block;width:100%;height:900px;border:0;background:var(--bg)}

.term{border-bottom:1px dotted var(--tx-3);cursor:help;position:relative;color:var(--tx)}
.term:hover::after,.term:focus::after{
  content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:#080A0E;border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;width:max-content;max-width:270px;
  font-size:12.4px;line-height:1.45;color:var(--tx-2);font-family:var(--ff-b);z-index:40;white-space:normal;box-shadow:0 8px 24px rgba(0,0,0,.6)
}
.tag{font-family:var(--ff-m);font-size:11px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--tx-2);display:inline-block}
.tag.b{border-color:#1E4A38;color:var(--bull)}
.tag.s{border-color:#4E2427;color:var(--bear)}
.tag.l{border-color:#3A3468;color:var(--liq)}
.tag.g{border-color:var(--gold-dim);color:var(--gold)}

.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin:24px 0}
.flow .st{flex:1;min-width:132px;border:1px solid var(--line);border-radius:var(--r-m);padding:13px 14px;position:relative;background:var(--panel)}
.flow .st + .st{margin-left:10px}
.flow .st .i{font-family:var(--ff-m);font-size:10.5px;color:var(--tx-3)}
.flow .st h5{font-family:var(--ff-d);font-size:14px;margin:3px 0 4px}
.flow .st p{margin:0;font-size:12.6px;color:var(--tx-2);line-height:1.45}

ul.ticks{list-style:none;padding:0;margin:14px 0}
ul.ticks li{padding:7px 0 7px 26px;position:relative;font-size:14.2px;color:var(--tx-2);border-bottom:1px solid var(--line)}
ul.ticks li:last-child{border-bottom:none}
ul.ticks li::before{content:"";position:absolute;left:6px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--gold-dim)}
ul.ticks li b{color:var(--tx)}
ul.ticks.yes li::before{background:var(--bull)}
ul.ticks.no li::before{background:var(--bear)}

/* ---------- PRACTICE ---------- */
.quiz{border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);overflow:hidden;margin:20px 0}
.quiz-top{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.quiz-top .q{font-family:var(--ff-m);font-size:11px;color:var(--tx-3)}
.quiz-q{padding:16px 18px 6px;font-family:var(--ff-d);font-size:17.5px;font-weight:600}
.quiz-hint{padding:0 18px 12px;font-size:13.4px;color:var(--tx-3)}
.opts{display:grid;gap:9px;padding:12px 18px 18px}
.opts button{
  text-align:left;border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;
  font-size:14.2px;color:var(--tx-2);transition:.16s;display:flex;gap:11px;align-items:flex-start
}
.opts button .k{font-family:var(--ff-m);font-size:11.5px;color:var(--tx-3);border:1px solid var(--line);border-radius:5px;width:20px;height:20px;display:grid;place-items:center;flex:0 0 auto;margin-top:1px}
.opts button:hover:not(:disabled){border-color:var(--line-2);color:var(--tx);background:var(--panel-2)}
.opts button.ok{border-color:var(--bull);color:var(--tx);background:rgba(43,191,123,.07)}
.opts button.ko{border-color:var(--bear);color:var(--tx);background:rgba(229,72,77,.07)}
.opts button:disabled{cursor:default}
.quiz-sol{padding:0 18px 18px}
.solbox{border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:0 var(--r-m) var(--r-m) 0;padding:13px 16px;background:var(--bg-2);font-size:14.2px;color:var(--tx-2)}
.solbox b{color:var(--tx)}
.quiz-act{display:flex;gap:10px;padding:0 18px 18px;flex-wrap:wrap}
.btn{border:1px solid var(--gold-dim);color:var(--gold);padding:9px 17px;border-radius:99px;font-size:13.4px;transition:.16s}
.btn:hover{background:rgba(232,180,74,.1)}
.btn.plain{border-color:var(--line);color:var(--tx-2)}
.btn.plain:hover{background:var(--panel-2);color:var(--tx)}
.score{display:flex;gap:16px;align-items:center;font-family:var(--ff-m);font-size:12px;color:var(--tx-3)}
.score b{color:var(--gold);font-weight:500}
.clickable{cursor:crosshair}

/* ---------- CHECKLIST ---------- */
.ck{display:grid;gap:10px;margin:26px 0}
.ck-item{border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel);overflow:hidden;transition:border-color .2s}
.ck-item.on{border-color:#1E4A38}
.ck-head{display:grid;grid-template-columns:auto 34px 1fr auto;gap:12px;align-items:center;padding:13px 15px;width:100%;text-align:left}
.ck-box{width:20px;height:20px;border:1.5px solid var(--line-2);border-radius:6px;display:grid;place-items:center;flex:0 0 auto;transition:.18s}
.ck-item.on .ck-box{background:var(--bull);border-color:var(--bull)}
.ck-box svg{opacity:0;transition:opacity .18s}
.ck-item.on .ck-box svg{opacity:1}
.ck-n{font-family:var(--ff-m);font-size:11px;color:var(--gold);text-align:center}
.ck-t{font-family:var(--ff-d);font-size:15.5px;font-weight:600}
.ck-t span{display:block;font-family:var(--ff-b);font-weight:400;font-size:13px;color:var(--tx-2);margin-top:1px}
.ck-caret{color:var(--tx-3);transition:transform .2s}
.ck-item.open .ck-caret{transform:rotate(90deg)}
.ck-body{display:none;padding:0 15px 15px 61px}
.ck-item.open .ck-body{display:block}
.ck-body li{font-size:13.8px;color:var(--tx-2);margin-bottom:5px}
.ck-body .bad{color:var(--bear)}

.panel-float{position:fixed;right:18px;bottom:18px;width:330px;max-height:70vh;overflow:auto;background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-l);box-shadow:0 20px 60px rgba(0,0,0,.66);z-index:80;display:none}
.panel-float.on{display:block}
.panel-float .pf-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg-2)}
.panel-float .pf-h b{font-family:var(--ff-d);font-size:13.5px;flex:1}
.panel-float ol{margin:0;padding:10px 14px 14px 30px}
.panel-float li{font-size:13px;color:var(--tx-2);margin-bottom:9px;line-height:1.45}
.panel-float li b{color:var(--tx);font-family:var(--ff-d);display:block;font-size:13px}

.hero-mantra{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 8px}
.hero-mantra div{
  flex:1;min-width:104px;border:1px solid var(--line);border-radius:var(--r-m);padding:12px 12px 13px;background:var(--panel);
  position:relative;overflow:hidden
}
.hero-mantra div::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--c,var(--gold));opacity:.6}
.hero-mantra .l{font-family:var(--ff-m);font-size:10px;color:var(--tx-3);letter-spacing:.08em}
.hero-mantra .v{font-family:var(--ff-d);font-size:14.5px;font-weight:600;margin-top:4px}
.hero-mantra .d{font-size:12px;color:var(--tx-2);margin-top:3px;line-height:1.4}

.tl{margin:22px 0}
.tl-bar{display:flex;height:46px;border-radius:var(--r-m);overflow:hidden;border:1px solid var(--line)}
.tl-bar div{display:flex;flex-direction:column;justify-content:center;padding:0 13px;font-size:12.6px;transition:flex .3s}
.tl-bar .s{font-family:var(--ff-m);font-size:10px;opacity:.75}
.tl-asia{background:linear-gradient(180deg,rgba(76,194,224,.16),rgba(76,194,224,.05));border-right:1px solid var(--line);color:var(--info)}
.tl-lon{background:linear-gradient(180deg,rgba(232,180,74,.16),rgba(232,180,74,.05));border-right:1px solid var(--line);color:var(--gold)}
.tl-ny{background:linear-gradient(180deg,rgba(139,123,240,.16),rgba(139,123,240,.05));color:var(--liq)}

.mtf{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));margin:20px 0}
.mtf .chart{margin:0}
.tfpick{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 4px}
.tfpick button{border:1px solid var(--line);padding:7px 14px;border-radius:99px;font-family:var(--ff-m);font-size:12.5px;color:var(--tx-2);transition:.16s}
.tfpick button.on{border-color:var(--gold);color:var(--gold);background:rgba(232,180,74,.07)}

.gal{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 6px}
.gal button{border:1px solid var(--line);padding:7px 13px;border-radius:8px;font-size:12.8px;color:var(--tx-2);transition:.16s}
.gal button:hover{border-color:var(--line-2);color:var(--tx)}
.gal button.on{border-color:var(--gold);color:var(--gold);background:rgba(232,180,74,.07)}

.layerlist{display:grid;gap:7px}
.layerlist .li{display:grid;grid-template-columns:22px 1fr;gap:9px;align-items:center;padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.3px;color:var(--tx-3);transition:.25s;background:var(--panel)}
.layerlist .li .ic{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:10px}
.layerlist .li.on{color:var(--tx);border-color:#1E4A38;background:rgba(43,191,123,.05)}
.layerlist .li.on .ic{background:var(--bull);border-color:var(--bull);color:#06170F}
.conf-wrap{display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start}

/* ---------- ITERACIÓN 2 ---------- */
/* transporte de reproducción */
.play{display:flex;align-items:center;gap:6px;padding:9px 14px;border-top:1px solid var(--line);background:var(--panel-2);flex-wrap:wrap}
.play button{border:1px solid var(--line);background:var(--panel);color:var(--tx-2);border-radius:7px;padding:5px 9px;font-size:12px;font-family:var(--ff-m);transition:.15s;min-width:30px}
.play button:hover{border-color:var(--line-2);color:var(--tx)}
.play .main{padding:5px 14px;border-color:var(--gold-dim);color:var(--gold);font-family:var(--ff-b);font-size:12.6px}
.play .main.playing{background:rgba(232,180,74,.1)}
.play .pos{font-family:var(--ff-m);font-size:11px;color:var(--tx-3);margin-left:6px;white-space:nowrap}
.play .sp{flex:1;min-width:4px}
.play .spd{display:flex;gap:3px}
.play .spd button{padding:5px 8px;font-size:11px;min-width:0}
.play .spd button.on{border-color:var(--gold-dim);color:var(--gold)}
.pauseq{border-top:1px solid var(--line);background:linear-gradient(180deg,rgba(76,194,224,.07),transparent);padding:14px 16px 15px;animation:fade .3s both}
.pauseq .pq-h{font-family:var(--ff-m);font-size:10.5px;letter-spacing:.1em;color:var(--info);text-transform:uppercase;margin-bottom:10px}
.pauseq .pq-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.pauseq .pq-g span{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.8px;color:var(--tx-2);background:var(--panel)}
.pauseq .pq-t{margin:11px 0 0;font-size:13.4px;color:var(--tx);line-height:1.5}
.pauseq .pq-a{margin:10px 0 0;font-size:13.4px;line-height:1.55;color:var(--tx-2);border-left:2px solid var(--gold);padding-left:11px}
.pauseq .pq-b{display:flex;gap:8px;margin-top:12px}
.pauseq .pq-b button{border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:12.5px;color:var(--tx-2)}
.pauseq .pq-b button:last-child{border-color:var(--gold-dim);color:var(--gold)}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* modo desnudo */
.reveal{display:none;gap:6px;flex-wrap:wrap}
body.naked .reveal{display:flex}
body.naked .chart-head .tools{display:none}
.reveal button{border:1px dashed var(--line-2);border-radius:99px;padding:4px 11px;font-size:11.6px;color:var(--tx-3);font-family:var(--ff-m);transition:.15s}
.reveal button:hover{color:var(--tx);border-color:var(--tx-3)}
.reveal button.on{border-style:solid;border-color:var(--gold-dim);color:var(--gold);background:rgba(232,180,74,.08)}
.reveal .all{border-color:var(--line)}
#nakedBtn.nk{border-color:var(--liq);color:var(--liq);background:rgba(139,123,240,.1)}
body.naked .note,body.naked .qa,body.naked .vs-pts{opacity:1}

/* comparación lado a lado */
.vswrap{margin:22px 0 8px}
.vsblk{display:grid;grid-template-columns:1fr 34px 1fr;align-items:stretch;gap:0}
.vs-col{border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
.vs-col .chart{margin:0;border:0;border-radius:0;background:transparent}
.vs-col.bull{border-color:#1E4A38}.vs-col.bear{border-color:#5A2327}.vs-col.gold{border-color:var(--gold-dim)}
.vs-h{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.vs-h .tag{font-family:var(--ff-m);font-size:10px;letter-spacing:.11em;color:var(--tx-3);text-transform:uppercase;display:block;margin-bottom:4px}
.vs-col.bull .vs-h .tag{color:var(--bull)}.vs-col.bear .vs-h .tag{color:var(--bear)}.vs-col.gold .vs-h .tag{color:var(--gold)}
.vs-h h5{font-size:14.6px}
.vs-sep{display:grid;place-items:center;position:relative}
.vs-sep span{font-family:var(--ff-m);font-size:10.5px;color:var(--tx-3);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 6px;z-index:1}
.vs-sep::before{content:"";position:absolute;top:14px;bottom:14px;width:1px;background:var(--line)}
.vs-pts{list-style:none;margin:0;padding:2px 14px 14px;display:grid;gap:6px}
.vs-pts li{position:relative;padding-left:15px;font-size:13.2px;color:var(--tx-2);line-height:1.48}
.vs-pts li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--tx-3)}
.vs-col.bull .vs-pts li::before{background:var(--bull)}.vs-col.bear .vs-pts li::before{background:var(--bear)}.vs-col.gold .vs-pts li::before{background:var(--gold)}

/* EVENTO ≠ ENTRADA */
.neq{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:9px;margin:20px 0 8px}
.neq-i{border:1px solid var(--line);border-radius:var(--r-m);padding:13px 14px;background:var(--panel)}
.neq-r{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
.neq-r .a{font-family:var(--ff-m);font-size:12.4px;color:var(--gold);border:1px solid var(--gold-dim);border-radius:6px;padding:3px 8px;letter-spacing:.04em}
.neq-r .op{font-size:17px;color:var(--bear);font-weight:700}
.neq-r .b{font-family:var(--ff-m);font-size:12.4px;color:var(--tx-3);border:1px dashed var(--line-2);border-radius:6px;padding:3px 8px}
.neq-i p{margin:0;font-size:12.9px;color:var(--tx-2);line-height:1.5}

/* hechos / inferencias / incógnitas */
.factg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0 8px}
.fc{border:1px solid var(--line);border-radius:var(--r-m);padding:13px 14px;background:var(--panel)}
.fc h5{display:flex;align-items:center;gap:8px;font-size:13.4px;margin-bottom:9px}
.fc h5 i{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700}
.fc.f{border-color:#1E4A38}.fc.f h5 i{background:rgba(43,191,123,.16);color:var(--bull)}.fc.f h5{color:var(--bull)}
.fc.i{border-color:var(--gold-dim)}.fc.i h5 i{background:rgba(232,180,74,.16);color:var(--gold)}.fc.i h5{color:var(--gold)}
.fc.u{border-color:#3A2F55}.fc.u h5 i{background:rgba(139,123,240,.16);color:var(--liq)}.fc.u h5{color:var(--liq)}
.fc ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.fc li{font-size:12.9px;color:var(--tx-2);line-height:1.48;padding-left:12px;position:relative}
.fc li::before{content:"";position:absolute;left:0;top:7px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.4}

/* escenarios condicionales */
.scen{margin:20px 0 8px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);overflow:hidden}
.scen-tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.scen-tabs button{flex:1;min-width:150px;display:flex;align-items:center;gap:9px;padding:12px 14px;font-size:13.2px;color:var(--tx-3);border-right:1px solid var(--line);text-align:left;transition:.17s}
.scen-tabs button b{width:21px;height:21px;border-radius:6px;display:grid;place-items:center;background:var(--panel-2);font-family:var(--ff-m);font-size:11.5px;flex:0 0 auto}
.scen-tabs button.on{color:var(--tx);background:var(--panel-2)}
.scen-tabs button.on b{background:var(--gold);color:#12161D}
.scen-body .chart{margin:0;border:0;border-radius:0;background:transparent}
.scen-txt{padding:2px 16px 16px;display:flex;gap:12px;align-items:flex-start}
.scen-txt .lv{font-family:var(--ff-m);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:4px 9px;color:var(--tx-3);white-space:nowrap;margin-top:2px}
.scen-txt p{margin:0;font-size:13.5px;line-height:1.55;color:var(--tx-2)}
.scen-txt.bull .lv{color:var(--bull);border-color:#1E4A38}
.scen-txt.warn .lv{color:var(--warn);border-color:#5A3E1A}
.scen-txt.bear .lv{color:var(--bear);border-color:#5A2327}

/* niveles de dificultad */
.lvtabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 10px}
.lvtabs button{border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:12.5px;color:var(--tx-2);display:flex;align-items:center;gap:8px;transition:.16s}
.lvtabs button .d{font-family:var(--ff-m);font-size:10px;color:var(--tx-3)}
.lvtabs button.on{border-color:var(--gold);color:var(--gold);background:rgba(232,180,74,.07)}
.lvtabs button.on .d{color:var(--gold)}

/* ejercicio ¿qué sabemos? */
.kn{display:grid;gap:7px;margin:14px 0 4px}
.kn label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.4px;color:var(--tx-2);background:var(--panel);cursor:pointer;transition:.16s;line-height:1.45}
.kn label:hover{border-color:var(--line-2)}
.kn input{appearance:none;width:16px;height:16px;border:1.5px solid var(--line-2);border-radius:4px;flex:0 0 auto;margin-top:1px;transition:.16s;position:relative}
.kn input:checked{background:var(--gold);border-color:var(--gold)}
.kn input:checked::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:#12161D;font-weight:700}
.kn label.ok{border-color:#1E4A38;background:rgba(43,191,123,.06)}
.kn label.bad{border-color:#5A2327;background:rgba(229,72,77,.06)}
.kn label .why{display:block;font-size:12.2px;color:var(--tx-3);margin-top:4px}

/* escala ATR */
.atrscale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin:16px 0 8px}
.atrscale div{border:1px solid var(--line);border-radius:var(--r-m);padding:11px 13px;background:var(--panel)}
.atrscale b{display:block;font-family:var(--ff-m);font-size:12px;color:var(--warn);letter-spacing:.05em}
.atrscale span{display:block;font-family:var(--ff-d);font-size:19px;margin:3px 0 2px}
.atrscale i{font-style:normal;font-size:12.2px;color:var(--tx-3)}

/* familias de indicadores */
.fam-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:9px;margin:18px 0 8px}
.fam-g>div{border:1px solid var(--line);border-left:3px solid var(--c);border-radius:var(--r-m);padding:12px 14px;background:var(--panel)}
.fam-g h5{font-size:13.6px;color:var(--c);margin-bottom:6px}
.fam-g .ls{font-family:var(--ff-m);font-size:11.4px;color:var(--tx-2);line-height:1.5;margin-bottom:7px}
.fam-g p{margin:0;font-size:12.4px;color:var(--tx-3);line-height:1.45}

/* zoom fractal */
.zoom{margin:20px 0;border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);overflow:hidden}
.zoom-tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.zoom-tabs button{flex:1;min-width:80px;padding:11px 12px;font-family:var(--ff-m);font-size:12.6px;color:var(--tx-3);border-right:1px solid var(--line);transition:.16s}
.zoom-tabs button.on{color:var(--gold);background:var(--panel-2)}
.zoom-body .chart{margin:0;border:0;border-radius:0;background:transparent}
.zoom-txt{padding:2px 16px 14px;display:flex;gap:12px;align-items:flex-start}
.zoom-txt .lv{font-family:var(--ff-m);font-size:10.5px;color:var(--gold);border:1px solid var(--gold-dim);border-radius:99px;padding:4px 10px;white-space:nowrap;margin-top:2px}
.zoom-txt p{margin:0;font-size:13.5px;line-height:1.55;color:var(--tx-2)}
.zoom-bar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.zoom-bar button{border:1px solid var(--gold-dim);color:var(--gold);background:rgba(232,180,74,.07);border-radius:99px;padding:7px 16px;font-size:12.6px}
.zoom-bar .sec{border-color:var(--line);color:var(--tx-2);background:none}
.zoom-bar button:disabled{opacity:.4}
.modes{margin:18px 0}
.modes-body .grid{margin-top:12px}

/* examen final */
.exq{font-size:13.4px;color:var(--tx-2);margin:0 0 10px;line-height:1.5}
.exam-out .rp-c{margin-bottom:0}
.quiz-top .lvb{font-family:var(--ff-m);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-dim);border-radius:99px;padding:2px 8px;margin-left:9px}
/* examen final */
.exam{border:1px solid var(--gold-dim);border-radius:var(--r-l);background:var(--panel);overflow:hidden;margin:22px 0}
.exam-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(180deg,rgba(232,180,74,.08),transparent)}
.exam-h h4{font-size:15px}
.exam-h .st{font-family:var(--ff-m);font-size:11px;color:var(--tx-3);margin-left:auto}
.exam-step{border-top:1px solid var(--line)}
.exam-step > h5{display:flex;align-items:center;gap:11px;padding:12px 16px;font-size:13.6px;color:var(--tx-2);cursor:pointer;transition:.16s}
.exam-step > h5:hover{background:var(--panel-2)}
.exam-step > h5 .n{font-family:var(--ff-m);font-size:10.5px;color:var(--gold);border:1px solid var(--gold-dim);border-radius:5px;padding:2px 6px}
.exam-step > h5 .c{margin-left:auto;font-family:var(--ff-m);font-size:10.5px;color:var(--tx-3)}
.exam-step .bd{padding:0 16px 14px;display:none}
.exam-step.open .bd{display:block}
.exam-res{padding:16px;border-top:1px solid var(--line);background:var(--panel-2)}
.exam-res .rg{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.exam-bar{display:flex;gap:9px;padding:14px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.exam-bar button{border:1px solid var(--gold-dim);color:var(--gold);border-radius:99px;padding:8px 18px;font-size:13px;background:rgba(232,180,74,.07)}
.exam-bar button.sec{border-color:var(--line);color:var(--tx-2);background:none}

/* laboratorio por capas */
.llab{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start;margin:22px 0 10px}
.llab .chart{margin:0}
.llab-side{border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);overflow:hidden}
.llab-q{padding:13px 15px;border-bottom:1px solid var(--line);font-family:var(--ff-d);font-size:13.6px;color:var(--tx)}
.llab-list{padding:10px 12px;display:grid;gap:6px;max-height:420px;overflow:auto}
.ll{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--bg-2);opacity:.5;transition:.25s}
.ll.on{opacity:1;border-color:#2E3746}
.ll-h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx-2)}
.ll-h b{font-weight:500;color:var(--tx)}
.ll-h .ic{width:18px;height:18px;border-radius:5px;background:var(--panel-2);display:grid;place-items:center;font-size:10px;font-family:var(--ff-m);color:var(--tx-3);flex:0 0 auto}
.ll.on .ic{background:rgba(43,191,123,.16);color:var(--bull)}
.ll-h .tg{margin-left:auto;font-family:var(--ff-m);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--bull);border:1px solid #1E4A38;border-radius:99px;padding:2px 6px}
.ll-h .tg.r{color:var(--tx-3);border-color:var(--line)}
.ll p{margin:7px 0 0;font-size:12.4px;color:var(--tx-2);line-height:1.48}
.llab-bar{display:flex;gap:8px;padding:11px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.llab-bar button{border:1px solid var(--gold-dim);color:var(--gold);background:rgba(232,180,74,.07);border-radius:99px;padding:7px 14px;font-size:12.6px;flex:1}
.llab-bar button:disabled{opacity:.45;border-color:var(--line);color:var(--tx-3);background:none}
.llab-bar .sec{border-color:var(--line);color:var(--tx-2);background:none;flex:0 0 auto}

/* medidor de tramos */
.meas{padding:12px}
.ms-rows{display:grid;gap:5px;margin-bottom:11px}
.ms-rows div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.6px;color:var(--tx-3);border-bottom:1px dashed var(--line);padding-bottom:4px}
.ms-rows b{font-family:var(--ff-m);font-size:12.8px;color:var(--tx);font-weight:500}
.ms-v{border:1px solid var(--line);border-left:2px solid var(--tx-3);border-radius:8px;padding:10px 12px;background:var(--bg-2)}
.ms-v h5{font-size:13px;color:var(--tx-2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--ff-m)}
.ms-v p{margin:0;font-size:12.6px;color:var(--tx-2);line-height:1.5}
.ms-v.bull{border-left-color:var(--bull)}.ms-v.bull h5{color:var(--bull)}
.ms-v.warn{border-left-color:var(--warn)}.ms-v.warn h5{color:var(--warn)}

/* ¿qué sabemos? */
.knblk{border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);padding:15px;margin:18px 0}
.kn-q{font-family:var(--ff-d);font-size:14.4px;margin-bottom:4px}
.kn-bar{margin-top:11px}
.kn-bar button{border:1px solid var(--gold-dim);color:var(--gold);background:rgba(232,180,74,.07);border-radius:99px;padding:8px 18px;font-size:12.8px}
.kn-res{margin-top:6px}
.kn-res .factg{margin-bottom:0}

/* referencia al bot */
.botref{border:1px dashed var(--line-2);border-radius:var(--r-m);padding:12px 14px;margin:20px 0 8px;background:rgba(76,194,224,.03)}
.botref-h{font-family:var(--ff-m);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--info);margin-bottom:9px}
.botref-g{display:grid;gap:6px}
.botref-g div{display:flex;gap:10px;align-items:baseline;font-size:12.6px;color:var(--tx-2);flex-wrap:wrap}
.botref-g code{font-family:var(--ff-m);font-size:12px;color:var(--gold);background:rgba(232,180,74,.08);border:1px solid var(--gold-dim);border-radius:5px;padding:1px 7px;white-space:nowrap}

/* panel de lectura manual */
.rpanel{border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);overflow:hidden;margin:20px 0}
.rp-g{display:grid}
.rp-row{display:grid;grid-template-columns:190px 1fr;gap:12px;align-items:center;padding:10px 15px;border-bottom:1px solid var(--line)}
.rp-k{font-size:13.2px;color:var(--tx);display:flex;flex-direction:column;gap:2px}
.rp-k .fam{font-family:var(--ff-m);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-3)}
.rp-o{display:flex;gap:6px;flex-wrap:wrap}
.rp-o button{border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12.2px;color:var(--tx-2);transition:.15s}
.rp-o button:hover{border-color:var(--line-2);color:var(--tx)}
.rp-o button.on{border-color:var(--gold);color:var(--gold);background:rgba(232,180,74,.08)}
.rp-bar{display:flex;gap:8px;padding:13px 15px;flex-wrap:wrap}
.rp-bar button{border:1px solid var(--gold-dim);color:var(--gold);background:rgba(232,180,74,.07);border-radius:99px;padding:8px 18px;font-size:12.8px}
.rp-bar .sec{border-color:var(--line);color:var(--tx-2);background:none}
.rp-res{padding:0 15px 15px}
.rp-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.rp-c{border:1px solid var(--line);border-radius:var(--r-m);padding:12px 13px;background:var(--bg-2)}
.rp-c h5{font-size:13px;margin-bottom:8px}
.rp-c.ok{border-color:#1E4A38}.rp-c.ok h5{color:var(--bull)}
.rp-c.no{border-color:#5A3E1A}.rp-c.no h5{color:var(--warn)}
.rp-c.mi{border-color:#3A2F55;margin-bottom:10px}.rp-c.mi h5{color:var(--liq)}
.rp-c ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rp-c li{font-size:12.6px;color:var(--tx-2);line-height:1.48}
.rp-c li b{color:var(--tx);font-weight:500}

@media (max-width:1000px){
  .llab{grid-template-columns:1fr}
}
@media (max-width:860px){
  .rp-row{grid-template-columns:1fr}
  .rp-cols{grid-template-columns:1fr}
  .vsblk{grid-template-columns:1fr}
  .vs-sep{padding:8px 0}
  .vs-sep::before{display:none}
  .factg{grid-template-columns:1fr}
  .exam-res .rg{grid-template-columns:1fr}
  .pauseq .pq-g{grid-template-columns:1fr}
}
@media (max-width:1000px){
  .conf-wrap{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  :root{--rail:280px}
  .rail{transform:translateX(-100%);transition:transform .28s cubic-bezier(.3,.8,.3,1)}
  body.menu .rail{transform:none;box-shadow:0 0 80px rgba(0,0,0,.7)}
  .main{margin-left:0}
  .burger{display:flex}
  .wrap{padding:26px 16px 110px}
  .topbar{padding:0 14px}
  .g2,.g3,.mtf{grid-template-columns:1fr}
  .flow .st + .st{margin-left:0;margin-top:8px}
  .flow{flex-direction:column}
  .panel-float{right:10px;left:10px;width:auto;bottom:10px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55;display:none}
  body.menu .scrim{display:block}
}
@media (max-width:520px){
  body{font-size:15px}
  .g4{grid-template-columns:1fr}
  .qa-body{font-size:14px}
}
/* @@LAB-CSS:BEGIN */
/* ============================================================
   LABORATORIO DE MERCADO · DE ANALIZAR A OPERAR
   ============================================================ */
.simtag{font-family:var(--ff-m);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-3);border:1px dashed var(--line-2);border-radius:99px;padding:2px 8px;white-space:nowrap}
.simnote{font-family:var(--ff-m);font-size:10.5px;color:var(--tx-3);text-align:center;margin:30px 0 0;letter-spacing:.04em}
.noplay .play{display:none}
.drawable{cursor:crosshair;touch-action:none}
.lnk{color:var(--gold);font-size:12.5px;text-decoration:underline dotted;padding:0}

/* ciclo / pipeline */
.cyc{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:4px 0 18px}
.cyc span{font-size:11.6px;color:var(--tx-3);border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:var(--panel);white-space:nowrap;display:flex;gap:6px;align-items:center}
.cyc span i{font-style:normal;font-family:var(--ff-m);font-size:9.5px;color:var(--tx-3);opacity:.7}
.cyc span.on{color:var(--gold);border-color:var(--gold-dim);background:rgba(232,180,74,.08)}
.cyc span.on i{color:var(--gold)}
.cyc b{color:var(--line-2);font-weight:400;font-size:12px}
.cyc.pipe-s{margin:0 0 10px}
.cyc.pipe-s span.on{color:var(--info);border-color:#1F4E5C;background:rgba(76,194,224,.08)}

.lab-principle{display:flex;gap:12px;align-items:flex-start;border:1px solid #2B3345;background:linear-gradient(90deg,rgba(139,123,240,.07),transparent);border-radius:var(--r-m);padding:12px 15px;margin:18px 0;font-size:13.6px;color:var(--tx-2);line-height:1.5}
.lab-principle .pi{color:var(--liq);font-size:13px;margin-top:1px}
.lab-principle b{color:var(--tx)}
.lab-principle em{display:block;color:var(--liq);font-style:normal;margin-top:3px;font-weight:500}
.lab-principle.alt{border-color:var(--gold-dim);background:linear-gradient(90deg,rgba(232,180,74,.08),transparent)}
.lab-principle.alt .pi{color:var(--gold);font-weight:700}

.lab-hero{display:grid;grid-template-columns:260px 1fr;gap:18px;margin:6px 0 20px;align-items:stretch}
.lh-seq{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.lh-seq span{font-size:12.6px;color:var(--tx-3);border:1px solid var(--line);border-radius:8px;padding:6px 11px;background:var(--panel);width:100%}
.lh-seq span.on{color:var(--gold);border-color:var(--gold-dim)}
.lh-seq b{color:var(--line-2);font-weight:400;padding-left:16px;font-size:11px;line-height:1}
.lh-txt{border:1px solid var(--line);border-radius:var(--r-l);padding:18px 20px;background:var(--panel)}
.lh-txt h4{font-family:var(--ff-m);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-3);margin-bottom:8px;font-weight:500}
.lh-txt .big{font-family:var(--ff-d);font-size:clamp(20px,3vw,27px);color:var(--tx);line-height:1.2;margin:0 0 10px;font-weight:600;letter-spacing:-.02em}
.lh-txt p{color:var(--tx-2);font-size:14px;margin:0}
.rulesno{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.rulesno span{font-family:var(--ff-m);font-size:12px;color:var(--bear);border:1px solid #4E2427;border-radius:6px;padding:4px 9px;text-decoration:line-through;text-decoration-color:rgba(229,72,77,.6)}
.lab-flow .st.on{border-color:var(--gold-dim)}
.lab-flow .st h5{margin-bottom:0}
.labmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:14px 0}
.labmap a{display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);border-radius:var(--r-m);padding:13px 14px;background:var(--panel);transition:.16s;color:var(--tx)}
.labmap a:hover{border-color:var(--gold-dim);background:var(--panel-2)}
.labmap b{font-family:var(--ff-d);font-size:14.5px;font-weight:600}
.labmap span{font-size:12.6px;color:var(--tx-2)}
.labmap i{font-style:normal;font-family:var(--ff-m);font-size:10px;color:var(--tx-3);margin-top:4px}

/* layout gráfico + panel */
.lab{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start;margin:18px 0 10px}
.lab-main{min-width:0}
.lab-main .chart{margin:0}
.lab-side{border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:10px;max-height:none}
.lab-side .lab-principle{margin:0 0 4px;font-size:12.6px}
.ls-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--ff-m);font-size:10.5px;color:var(--tx-3)}
.lvb{font-family:var(--ff-m);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-dim);border-radius:99px;padding:2px 8px}
.ls-h{font-family:var(--ff-d);font-size:15.5px;font-weight:600;color:var(--tx);line-height:1.3}
.ls-p{font-size:12.8px;color:var(--tx-2);margin:0;line-height:1.5}
.ls-sh{font-family:var(--ff-m);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--tx-3);margin:6px 0 0;font-weight:500}
.ls-tools{display:flex;flex-wrap:wrap;gap:6px}
.ls-tools button{border:1px solid var(--line-2);border-radius:8px;padding:7px 11px;font-size:12.6px;color:var(--tx-2);background:var(--bg-2);transition:.15s}
.ls-tools button:hover{color:var(--tx);border-color:var(--tx-3)}
.ls-tools button.on{border-color:var(--gold);color:var(--gold);background:rgba(232,180,74,.08)}
.ls-tools.big button{flex:1;min-width:120px;padding:10px 12px;font-size:13.4px;font-weight:500}
.ls-tools .buy{border-color:#1E4A38;color:var(--bull)}.ls-tools .sell{border-color:#5A2327;color:var(--bear)}
.ls-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ls-bar .btn:disabled{opacity:.4;cursor:not-allowed}
.ls-x:empty{display:none}
.ls-guide{display:grid;gap:6px}
.gq{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg-2);font-size:12.6px;display:flex;flex-direction:column;gap:4px;animation:fade .3s both}
.gq b{color:var(--tx);font-weight:500}
.gq p{margin:0;color:var(--tx-2)}
.ls-cont{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.ls-cont p{font-size:12.8px;color:var(--tx-2)}

/* pregunta con veredicto */
.lq{margin:10px 0}
.lab-card .lq{padding:12px 18px 6px;margin:0}
.lq-q{font-family:var(--ff-d);font-size:15.5px;font-weight:600;color:var(--tx);margin-bottom:4px;line-height:1.35}
.lq-h{font-size:12.8px;color:var(--tx-3);margin-bottom:8px}
.lq-o{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.lq-o button{border:1px solid var(--line-2);border-radius:9px;padding:9px 13px;font-size:13.2px;color:var(--tx-2);background:var(--bg-2);transition:.15s;text-align:left}
.lq-o button:hover:not(:disabled){color:var(--tx);border-color:var(--tx-3)}
.lq-o button:disabled{cursor:default;opacity:.75}
.lq-o button.pick{opacity:1}
.lq-o button.ok{border-color:var(--bull);color:var(--tx);background:rgba(43,191,123,.09)}
.lq-o button.part{border-color:var(--warn);color:var(--tx);background:rgba(240,152,60,.08)}
.lq-o button.no{border-color:var(--bear);color:var(--tx);background:rgba(229,72,77,.08)}
.lq-o button.alt{border-color:#1E4A38;border-style:dashed;opacity:1}
.lq-x{border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:0 var(--r-m) var(--r-m) 0;padding:11px 13px;background:var(--bg-2);font-size:13.2px;color:var(--tx-2);line-height:1.55;animation:fade .3s both}
.lq-x p{margin:6px 0 0}
.lq-x h6{font-family:var(--ff-m);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-3);margin:10px 0 2px;font-weight:500}
.lq-x.warnq{border-left-color:var(--info);background:rgba(76,194,224,.05)}
.lq-x .key{color:var(--tx)}
.vd{display:inline-block;margin-right:4px}
.vd.ok{color:var(--bull)}.vd.part{color:var(--warn)}.vd.no{color:var(--bear)}
.kn label.part{border-color:#5A3E1A;background:rgba(240,152,60,.06)}
.qctx{padding:10px 18px 0;font-size:13px;color:var(--tx-2)}
.qctx b{color:var(--info)}
.lab-card .qchart .chart{margin:0;border:0;border-radius:0;border-bottom:1px solid var(--line)}
.lmet{margin:4px 18px 10px;border:1px solid var(--line);border-radius:var(--r-m);padding:11px 13px;background:var(--bg-2);animation:fade .3s both}
.lmet h5{font-family:var(--ff-m);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--tx-3);margin-bottom:8px;font-weight:500}
.lmet-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.lmet-g div{display:flex;flex-direction:column}
.lmet-g span{font-size:11.2px;color:var(--tx-3)}
.lmet-g b{font-family:var(--ff-m);font-size:14px;color:var(--tx);font-weight:500}
.lmet-g i{font-style:normal;font-size:11px;color:var(--gold)}
.lab-card .note{margin:6px 18px 12px}

/* historias y líneas de tiempo */
.story{margin:0;padding:0;list-style:none;display:grid;gap:4px;counter-reset:st}
.story li{font-size:12.4px;border:1px solid var(--line);border-radius:7px;padding:6px 9px;display:flex;justify-content:space-between;gap:8px;color:var(--tx-2);background:var(--bg-2)}
.story li b{font-weight:500;color:var(--tx)}
.story li span{font-family:var(--ff-m);font-size:10.5px;color:var(--tx-3);text-align:right}
.story li.ok{border-color:#1E4A38}.story li.part{border-color:#5A3E1A}.story li.no{border-color:#5A2327}
.ls-tl:empty{display:none}
.tlh{display:flex;justify-content:space-between;font-family:var(--ff-m);font-size:9.5px;color:var(--tx-3);margin-bottom:3px}
.tlk{display:flex;gap:9px;align-items:center;font-size:10.5px;color:var(--tx-3);margin-top:4px;flex-wrap:wrap}
.tlk i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:-5px}
.cyc-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0}
.cyc-bar .mut{font-size:12.6px}

/* liquidez: seis lugares, bifurcaciones */
.six-b .chart{margin-top:10px}
.six-q{display:grid;gap:6px;margin:8px 0}
.twoways{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.twoways div{flex:1;min-width:230px;border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;background:var(--panel);display:flex;gap:10px;align-items:center;font-family:var(--ff-d);font-size:15px}
.twoways i{color:var(--tx-3);font-style:normal}
.twoways .bull{color:var(--bull)}.twoways .bear{color:var(--bear)}
.fork .lq{margin:12px 0}
.fork-tabs{margin-top:14px}

/* ordenar evidencias */
.esort{border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);padding:15px;margin:14px 0}
.es-ctx{font-size:13.6px;color:var(--tx-2);line-height:1.55;margin-bottom:8px}
.es-ctx b{color:var(--tx)}
.es-chart .chart{margin:6px 0 10px}
.es-list{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px;counter-reset:es}
.es-list li{counter-increment:es;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;background:var(--bg-2);font-size:13.2px;color:var(--tx);cursor:grab}
.es-list li::before{content:counter(es);font-family:var(--ff-m);font-size:11px;color:var(--gold);position:absolute;opacity:0}
.es-list li .h{color:var(--tx-3);font-size:12px;letter-spacing:-2px}
.es-list li .b{display:flex;gap:3px}
.es-list li .b button{border:1px solid var(--line);border-radius:6px;width:26px;height:24px;font-size:10px;color:var(--tx-2)}
.es-list li .b button:disabled{opacity:.3}
.es-list li .why{display:block;font-size:11.8px;color:var(--tx-3);margin-top:3px}
.es-list li .why i{font-style:normal;color:var(--tx-2)}
.es-list li.t1{border-left:3px solid var(--bull)}.es-list li.t2{border-left:3px solid var(--gold)}.es-list li.t3{border-left:3px solid var(--tx-3)}
.es-list li.drag{opacity:.4}

/* reconstruir historia */
.sr-list{list-style:none;padding:0;margin:0;display:grid;gap:4px;max-height:460px;overflow:auto}
.sr-list li{display:grid;grid-template-columns:22px 1fr;gap:8px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.6px;color:var(--tx-2);cursor:pointer;background:var(--bg-2)}
.sr-list li .n{font-family:var(--ff-m);font-size:10.5px;color:var(--tx-3);border:1px solid var(--line-2);border-radius:5px;display:grid;place-items:center;height:20px}
.sr-list li.on{border-color:var(--gold);color:var(--tx)}
.sr-list li.on .n{color:var(--gold);border-color:var(--gold-dim)}
.sr-list li.done .n{background:rgba(232,180,74,.14)}
.sr-list li.ok{border-color:#1E4A38}.sr-list li.no{border-color:#5A2327}.sr-list li.miss{border-color:#3A2F55}
.sr-list li .ch{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.sr-list li .ch button{border:1px solid var(--line-2);border-radius:6px;padding:3px 8px;font-size:11.6px;color:var(--tx-2)}
.sr-list li .ch button.on{border-color:var(--gold);color:var(--gold)}
.sr-list li .why{display:block;font-size:11.5px;color:var(--tx-3);margin-top:3px}

/* multi-timeframe */
.tfroles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.tfroles div{border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px;background:var(--panel);display:flex;flex-direction:column}
.tfroles b{font-family:var(--ff-m);font-size:13px;color:var(--gold)}
.tfroles span{font-size:12.6px;color:var(--tx-2)}

/* planificador */
.planner{border:1px solid var(--line-2);border-radius:var(--r-m);background:var(--bg-2);padding:12px;display:grid;gap:9px}
.pl-h{display:flex;flex-direction:column;gap:2px}
.pl-h b{font-family:var(--ff-d);font-size:14.5px}
.pl-h span{font-size:11.6px;color:var(--tx-3)}
.pl-r{display:grid;gap:4px}
.planner label{font-family:var(--ff-m);font-size:9.8px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-3)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{border:1px solid var(--line-2);border-radius:99px;padding:4px 10px;font-size:12px;color:var(--tx-2)}
.chips button.on{border-color:var(--gold);color:var(--gold);background:rgba(232,180,74,.08)}
.planner textarea,.planner input,.planner select,.mv input,.just select{width:100%;background:var(--panel);border:1px solid var(--line-2);border-radius:7px;color:var(--tx);font:inherit;font-size:12.8px;padding:6px 8px;resize:vertical}
.planner textarea:focus,.planner input:focus,.planner select:focus{outline:1px solid var(--gold-dim);border-color:var(--gold-dim)}
.pl-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.pl-g div{display:grid;gap:3px}
.pl-rr{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--tx-2)}
.pl-rr b{color:var(--tx);font-family:var(--ff-m);font-weight:500}
.pl-err{margin:0;padding-left:16px;font-size:11.8px;color:var(--warn);display:grid;gap:2px}
.pl-err:empty{display:none}
.btn.lock{font-size:14px;padding:10px 20px}
.btn.lock:disabled{border-color:var(--line);color:var(--tx-3);cursor:not-allowed}
.plan-anat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px;margin:14px 0}
.plan-anat div{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--panel);display:flex;flex-direction:column;gap:2px}
.plan-anat b{font-family:var(--ff-d);font-size:13.5px}
.plan-anat span{font-size:11.8px;color:var(--tx-3)}

/* simulador de operación */
.ts-ctx{font-size:13.4px;color:var(--tx-2);border-left:2px solid var(--info);padding:6px 12px;margin:10px 0}
.ts-ctx b{color:var(--info)}
.hud{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.hud div{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg-2);display:flex;flex-direction:column}
.hud span{font-family:var(--ff-m);font-size:9.3px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx-3)}
.hud b{font-family:var(--ff-m);font-size:14px;font-weight:500;color:var(--tx)}
.hud b.u{color:var(--bull)}.hud b.d{color:var(--bear)}
.hud div.warn{border-color:var(--warn)}.hud div.warn b{color:var(--warn)}
.pnow{font-size:12px;color:var(--tx-3);border:1px dashed var(--line-2);border-radius:8px;padding:7px 9px}
.pnow.chg{border-style:solid;border-color:var(--warn);color:var(--tx-2)}
.pnow.chg b{color:var(--warn)}
.dq{border:1px solid var(--info);border-radius:9px;padding:9px 11px;background:rgba(76,194,224,.07);display:flex;flex-direction:column;gap:2px;animation:fade .25s both}
.dq b{font-family:var(--ff-d);font-size:15px;color:var(--info)}
.dq span{font-size:12px;color:var(--tx-2)}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.acts button{border:1px solid var(--line-2);border-radius:7px;padding:6px 8px;font-size:12.2px;color:var(--tx-2);background:var(--bg-2);text-align:left}
.acts button:hover{color:var(--tx);border-color:var(--tx-3)}
.mot{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.mot span{font-size:11px;color:var(--tx-3);margin-right:2px}
.mot button{border:1px solid var(--line);border-radius:99px;padding:3px 8px;font-size:11.2px;color:var(--tx-3)}
.mot button.on{border-color:var(--gold);color:var(--gold)}
.mv{display:grid;grid-template-columns:1fr auto auto;gap:5px;align-items:end}
.mv label{grid-column:1/-1;font-size:11px;color:var(--tx-3)}
.mv button{border:1px solid var(--line-2);border-radius:7px;padding:6px 9px;font-size:12px;color:var(--tx-2)}
.mv button.on{border-color:var(--gold);color:var(--gold)}
.acx p{font-size:12px;margin:0}
.acx .bad{color:var(--bear)}
.htf .chart{margin:0}
.htf .grid{gap:8px}
.esc{display:flex;flex-direction:column;align-items:center;gap:2px;margin:10px 0;padding:10px;border:1px solid #5A2327;border-radius:var(--r-m);background:rgba(229,72,77,.05)}
.esc span{font-family:var(--ff-m);font-size:13px;letter-spacing:.1em;color:var(--tx)}
.esc i{font-style:normal;color:var(--bear)}
.esc em{font-style:italic;color:var(--tx-2);font-size:13px}

/* revisión */
.rev{border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);padding:15px;margin:10px 0}
.rev-top{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rv{border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;background:var(--bg-2);display:flex;flex-direction:column;gap:2px}
.rv span{font-family:var(--ff-m);font-size:9.8px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-3)}
.rv b{font-family:var(--ff-d);font-size:24px;font-weight:600;letter-spacing:-.02em}
.rv i{font-style:normal;font-size:11.8px;color:var(--tx-3)}
.rv.res.up b{color:var(--bull)}.rv.res.dn b{color:var(--bear)}
.rv.proc.ok{border-color:#1E4A38}.rv.proc.ok b{color:var(--bull)}
.rv.proc.part{border-color:#5A3E1A}.rv.proc.part b{color:var(--warn)}
.rv.proc.no{border-color:#5A2327}.rv.proc.no b{color:var(--bear)}
.rev-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.rev-cols>div{border:1px solid var(--line);border-radius:var(--r-m);padding:11px 12px;background:var(--bg-2)}
.rev-cols h5{font-family:var(--ff-m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line);font-weight:500}
.rev-cols dl{margin:0;display:grid;gap:5px}
.rev-cols dt{font-size:10.5px;color:var(--tx-3);font-family:var(--ff-m)}
.rev-cols dd{margin:0 0 3px;font-size:12.6px;color:var(--tx)}
.dlog{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.dlog li{font-size:12.2px;color:var(--tx-2);display:flex;flex-direction:column;border-left:2px solid var(--line-2);padding-left:8px}
.dlog li b{color:var(--tx);font-weight:500}
.dlog li .w{font-family:var(--ff-m);font-size:10.3px;color:var(--tx-3)}
.dlog li .m{font-size:11.2px;color:var(--tx-3)}
.dlog li.a-sl_away,.dlog li.a-tf,.dlog li.a-add{border-left-color:var(--bear)}
.dlog li.a-close,.dlog li.a-partial,.dlog li.a-sl_be{border-left-color:var(--gold)}
.flags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:10px 0 4px}
.flags span{font-size:11.8px;color:var(--tx-3);width:100%}
.flags b{font-family:var(--ff-m);font-size:10.8px;letter-spacing:.06em;color:var(--warn);border:1px solid #5A3E1A;border-radius:99px;padding:3px 8px;font-weight:500}
.flags.ok span{color:var(--bull)}
.pnotes{margin:6px 0 0;padding-left:16px;font-size:11.8px;color:var(--tx-2);display:grid;gap:3px}
.pdiff{border:1px solid var(--warn);border-radius:var(--r-m);padding:10px 12px;background:rgba(240,152,60,.05);margin:10px 0}
.pdiff h5{font-family:var(--ff-d);font-size:14px;color:var(--warn);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.pdiff table{width:100%;border-collapse:collapse;font-size:12.6px}
.pdiff th{font-family:var(--ff-m);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-3);text-align:left;font-weight:500;padding:3px 6px}
.pdiff td{padding:4px 6px;border-top:1px solid var(--line);color:var(--tx-2)}
.pdiff td.chg{color:var(--warn);font-weight:500}
.quad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0 4px}
.quad .q{border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;background:var(--panel);display:flex;flex-direction:column;gap:1px}
.quad b{font-family:var(--ff-d);font-size:14.5px}
.quad span{font-size:13px;color:var(--tx-2)}
.quad i{font-style:normal;font-size:12px;color:var(--tx-3);margin-top:3px}
.quad .ok{border-color:#1E4A38}.quad .ok b{color:var(--bull)}
.quad .warn{border-color:#5A3E1A}.quad .warn b{color:var(--warn)}
.quad .info{border-color:#1F4E5C}.quad .info b{color:var(--info)}
.quad .no{border-color:#5A2327}.quad .no b{color:var(--bear)}
.scripted{border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);padding:12px;margin:14px 0}
.scripted .chart{margin:8px 0}
.sc-h{display:flex;flex-direction:column;gap:2px}
.sc-h b{font-family:var(--ff-d);font-size:15px}
.sc-h span{font-size:12px;color:var(--tx-3)}
.chg-plan{display:grid;grid-template-columns:1fr 40px 1fr;gap:10px;align-items:center;margin:14px 0}
.cp{border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;background:var(--panel)}
.cp h5{font-family:var(--ff-m);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-3);margin-bottom:6px}
.cp ul{margin:0;padding-left:16px;font-size:13.4px;color:var(--tx);display:grid;gap:3px}
.cp.b{border-color:var(--warn)}.cp.b h5{color:var(--warn)}
.cp-arrow{text-align:center;font-size:22px;color:var(--warn)}
.cp-big{grid-column:1/-1;text-align:center;font-family:var(--ff-d);font-size:22px;font-weight:700;letter-spacing:.06em;color:var(--warn);border:1px dashed var(--warn);border-radius:var(--r-m);padding:10px}

/* sesgos / diario */
.revenge{border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);padding:14px;margin:14px 0}
.prevtrade{display:flex;gap:10px;align-items:baseline;border:1px solid #5A2327;border-radius:9px;padding:8px 12px;background:rgba(229,72,77,.05);width:max-content;max-width:100%}
.prevtrade span{font-family:var(--ff-m);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-3)}
.prevtrade b.d{font-family:var(--ff-d);font-size:20px;color:var(--bear)}
.prevtrade i{font-style:normal;font-size:12px;color:var(--tx-3)}
.olog{list-style:none;margin:0;padding:0;display:grid;gap:3px;max-height:180px;overflow:auto;font-size:11.8px;color:var(--tx-2)}
.olog b{color:var(--gold);font-family:var(--ff-m);font-weight:500}
.osum h6{font-family:var(--ff-d);font-size:14px;margin:4px 0 8px}
.just{display:grid;gap:5px;margin:6px 0 10px}
.just div{display:grid;grid-template-columns:90px 1fr;gap:6px;align-items:center;font-family:var(--ff-m);font-size:11px;color:var(--tx-3)}
.jsum{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:7px;margin:10px 0}
.jsum div{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--bg-2);display:flex;flex-direction:column}
.jsum span{font-family:var(--ff-m);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-3)}
.jsum b{font-family:var(--ff-d);font-size:19px;font-weight:600}
.jent{border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel);margin:6px 0}
.jent summary{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:10px 14px;cursor:pointer;font-size:13.2px;align-items:center}
.jent summary .r{font-family:var(--ff-m);font-size:12.6px}
.jent summary .r.u{color:var(--bull)}.jent summary .r.d{color:var(--bear)}
.jent summary .p{font-family:var(--ff-m);font-size:10.5px;color:var(--tx-3)}
.jent .rev{margin:0 10px 10px}
.jlegend{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:7px;margin:12px 0}
.jlegend div{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--panel);display:flex;flex-direction:column;gap:2px}
.jlegend b{font-family:var(--ff-m);font-size:11px;letter-spacing:.06em;color:var(--warn);font-weight:500}
.jlegend span{font-size:12.2px;color:var(--tx-2)}

/* simulador de sesión */
.ss-steps ol{list-style:none;margin:10px 0;padding:0;display:flex;flex-wrap:wrap;gap:5px}
.ss-steps li{font-size:11.4px;color:var(--tx-3);border:1px solid var(--line);border-radius:99px;padding:3px 10px 3px 4px;display:flex;gap:6px;align-items:center}
.ss-steps li i{font-style:normal;font-family:var(--ff-m);font-size:9.5px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2)}
.ss-steps li.on{color:var(--gold);border-color:var(--gold-dim)}
.ss-steps li.on i{background:var(--gold);color:#12161D}
.ss-steps li.done{color:var(--tx-2)}
.ss-steps li.done i{background:rgba(43,191,123,.2);color:var(--bull)}
.ssim .tfpick{margin:0 0 8px;align-items:center}
.ssim .tfpick .clock{font-family:var(--ff-m);font-size:11.5px;color:var(--tx-3);margin-left:auto}
.ss-chart .chart{margin:0}
.ss-chart .tsim .lab{grid-template-columns:1fr}
.sslog{list-style:none;margin:10px 0;padding:0;display:grid;gap:5px}
.sslog li{display:grid;grid-template-columns:190px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:12.8px;background:var(--panel)}
.sslog li b{font-weight:500}
.sslog li span{color:var(--tx-2)}
.sslog li i{font-style:normal;font-family:var(--ff-m);font-size:10.5px}
.sslog li.ok i{color:var(--bull)}.sslog li.part i{color:var(--warn)}.sslog li.no i{color:var(--bear)}

@media (max-width:1000px){
  .lab{grid-template-columns:1fr}
  .lab-hero{grid-template-columns:1fr}
  .rev-cols{grid-template-columns:1fr}
}
@media (max-width:860px){
  .rev-top{grid-template-columns:1fr}
  .quad{grid-template-columns:1fr}
  .chg-plan{grid-template-columns:1fr}
  .cp-arrow{transform:rotate(90deg)}
  .tfroles{grid-template-columns:1fr}
  .sslog li{grid-template-columns:1fr}
  .lq-o button{flex:1 1 100%}
  .ls-tools.big button{min-width:0}
  .labmap{grid-template-columns:1fr}
}

/* movimiento A → B */
h3.sec .abn{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line-2);font-family:var(--ff-m);font-size:12px;color:var(--gold);margin-right:10px;vertical-align:3px}
.abmotto{border:1px solid var(--gold-dim);border-radius:var(--r-l);padding:16px 20px;background:linear-gradient(135deg,rgba(232,180,74,.09),transparent 70%);margin:8px 0 10px}
.abmotto p{font-family:var(--ff-d);font-size:clamp(17px,2.2vw,21px);font-weight:600;color:var(--tx);margin:0 0 10px;letter-spacing:-.01em}
.abmotto ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:5px 16px}
.abmotto li{font-size:13.4px;color:var(--tx-2);padding-left:14px;position:relative}
.abmotto li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.abt{display:flex;flex-direction:column;gap:6px}
.abt .chart{margin:0}
.abt p{margin:0;font-size:13px;color:var(--tx-2)}
.abt-h b{font-family:var(--ff-d);font-size:14.5px}
.abt-h.ok b{color:var(--bull)}.abt-h.part b{color:var(--warn)}.abt-h.no b{color:var(--bear)}
.abrules3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.abrules3 div{border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px;background:var(--panel);display:flex;flex-direction:column}
.abrules3 b{font-size:13.4px}
.abrules3 span{font-family:var(--ff-m);font-size:12px}
.abrules3 .part span{color:var(--warn)}.abrules3 .no span{color:var(--bear)}
.abno{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:12px 0}
.abno div{border:1px solid #4E2427;border-radius:var(--r-m);padding:13px 14px;background:rgba(229,72,77,.04);display:flex;flex-direction:column;gap:4px}
.abno i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(229,72,77,.12);color:var(--bear);font-family:var(--ff-m);font-size:13px}
.abno b{font-family:var(--ff-d);font-size:14.5px}
.abno span{font-size:12.6px;color:var(--tx-2)}
.abpsy{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:12px 0}
.abpsy div{border:1px solid var(--line);border-left:3px solid var(--liq);border-radius:var(--r-m);padding:11px 13px;background:var(--panel);display:flex;flex-direction:column;gap:3px}
.abpsy b{font-size:13.6px}
.abpsy span{font-size:12.6px;color:var(--tx-2)}
.relgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin:12px 0}
.relgrid a{border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;background:var(--panel);display:flex;flex-direction:column;gap:3px;color:var(--tx);transition:.16s}
.relgrid a:hover{border-color:var(--gold-dim);background:var(--panel-2)}
.relgrid b{font-family:var(--ff-d);font-size:14px}
.relgrid span{font-size:12.4px;color:var(--tx-2)}
.relgrid i{font-style:normal;font-size:12px;color:var(--gold);margin-top:2px}
@media (max-width:860px){.abrules3{grid-template-columns:1fr}}
/* @@LAB-CSS:END */
/* @@NAV-CSS:BEGIN */
/* ============================================================
   RECORRIDO A–G · barra lateral en acordeón, portada, anchura
   ============================================================ */
.rail{overflow:hidden}
.prog{padding:12px 18px 12px}
.modesw{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:11px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.modesw button{font-size:11.6px;padding:6px 4px;color:var(--tx-3);transition:.15s}
.modesw button+button{border-left:1px solid var(--line)}
.modesw button.on{background:#1B222E;color:var(--gold)}
.nav{padding:6px 10px 18px}
.stg{border-bottom:1px solid #181E28;padding:4px 0 6px}
.stg-hr{display:flex;align-items:center}
.stg-h{flex:1;display:grid;grid-template-columns:12px 20px 1fr auto;gap:6px;align-items:center;padding:9px 6px 6px;text-align:left;border-radius:7px}
.stg-h:hover{background:#151A23}
.stg-h .car{color:var(--tx-3);font-size:10px;transition:transform .2s}
.stg.open .stg-h .car{transform:rotate(90deg)}
.stg-h .lt{font-family:var(--ff-m);font-size:11px;font-weight:700;color:var(--tx-3);border:1px solid var(--line-2);border-radius:5px;display:grid;place-items:center;height:19px}
.stg-h .nm{font-family:var(--ff-d);font-size:13.8px;font-weight:600;color:var(--tx-2);letter-spacing:-.01em}
.stg-h .ct{font-family:var(--ff-m);font-size:10.5px;color:var(--tx-3)}
.stg.cur .stg-h .lt{color:#12161D;background:var(--gold);border-color:var(--gold)}
.stg.cur .stg-h .nm{color:var(--tx)}
.stg-i{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);font-family:var(--ff-m);font-size:10px;color:var(--tx-3);margin-left:4px;flex:0 0 auto}
.stg-i:hover{color:var(--gold);border-color:var(--gold-dim)}
.stg-bar{height:2px;background:#1A202B;border-radius:99px;margin:0 6px 2px 44px;overflow:hidden}
.stg-bar i{display:block;height:100%;background:var(--gold-dim);border-radius:99px;transition:width .4s}
.stg-b{display:none;padding:4px 0 2px}
.stg.open .stg-b{display:block}
.stg-b .sub{font-family:var(--ff-m);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#4E586A;padding:9px 8px 3px 30px}
.nav a{grid-template-columns:24px 1fr auto;padding:5px 8px 5px 6px;margin-left:18px;font-size:13.3px;gap:8px}
.nav a .n{font-size:10px;text-align:left;color:#4E586A}
.nav a.done{color:#7C889A}
.nav a.done .n::after{content:none}
.nav a.done .n{color:#2E7A57}
.nav a.on{background:#1E2633;color:var(--tx);font-weight:500}
.nav a.on .n{color:var(--gold)}
.nav a.on::before{left:-8px;top:5px;bottom:5px;width:3px;border-radius:2px}
.nav a .imp{width:5px;height:5px;border-radius:50%;flex:0 0 auto}
.imp.esencial{background:var(--gold)}
.imp.importante,.imp.complementario,.imp.avanzado{background:transparent}
.nav a:hover .imp.importante{background:var(--info)}
.stg-sum{margin:4px 6px 6px 18px;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:var(--panel);font-size:12.2px;color:var(--tx-2);line-height:1.45;animation:fade .2s both}
.stg-sum p{margin:0 0 5px}
.stg-sum b{color:var(--tx);font-weight:500}
.btn.sm{padding:5px 12px;font-size:12px;display:inline-block;margin-top:3px}
.stg-empty{font-size:12px;color:var(--tx-3);padding:6px 10px 6px 30px;margin:0}
.tools-g{border-top:1px solid var(--line);padding:9px 12px 12px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tg-h{width:100%;font-family:var(--ff-m);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#4E586A;padding:0 4px 3px}
.tg-i{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--tx-2);border:1px solid var(--line);border-radius:99px;padding:4px 10px}
.tg-i:hover,.tg-i.on{color:var(--gold);border-color:var(--gold-dim)}
.tg-i .ic{font-size:11px;opacity:.8}

/* cabecera del capítulo */
.chead .kick{flex-wrap:wrap;gap:8px}
.chead .kick .kd{color:var(--tx-3)}
.chead .kick .kd::before{content:"/";margin-right:8px;color:var(--line-2)}
.imp-p{font-family:var(--ff-m);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-2);border-radius:99px;padding:2px 8px;color:var(--tx-3);position:relative;cursor:help;vertical-align:middle}
.imp-p.esencial{color:var(--gold);border-color:var(--gold-dim)}
.imp-p.importante{color:var(--info);border-color:#1F4E5C}
